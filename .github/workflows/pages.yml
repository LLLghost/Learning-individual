name: Публикация на GitHub Pages

# Действия закреплены хешами коммитов, а не тегами: тег можно передвинуть, и
# тогда в сборку молча приедет другой код. Номер версии оставлен комментарием
# рядом — по нему понятно, что обновлять. Хеш берётся так:
#   git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v4$'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно публикуется только одна сборка; уже идущую не прерываем,
# чтобы не оставить страницы в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Страницы проекта живут в подкаталоге /<репозиторий>/, личный сайт
      # <владелец>.github.io — в корне. Свой домен тоже отдаётся из корня:
      # в этом случае оставьте BASE_PATH пустым, а в SITE_URL впишите домен.
      # SITE_URL нужен для canonical, og:url и карты сайта: они требуют
      # абсолютных адресов, и без переменной просто не выпускаются.
      # Имя владельца приводится к нижнему регистру — адреса github.io
      # регистрозависимы, и ссылка с заглавной буквой ведёт в никуда.
      - name: Определить базовый путь
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event.repository.name }}" = "$owner.github.io" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      # Генератор и проверка используют только стандартную библиотеку Node,
      # поэтому устанавливать зависимости не нужно.
      - name: Собрать сайт
        run: node scripts/build-static.mjs

      - name: Проверить собранный сайт
        run: node scripts/validate-site.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
