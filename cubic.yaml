# Настройка бота обзора cubic. Здесь только одно правило, и оно про описания
# пул-реквестов: по умолчанию бот переписывает описание независимо от того,
# что в нём уже есть. В этом репозитории описание PR — не формальность, а
# рассказ о том, какой дефект правился и чем это проверено, поэтому терять
# его нельзя. Написанное автором остаётся как есть; там, где автор ничего не
# написал, сводка бота по-прежнему полезна.
version: 1

pr_descriptions:
  skip_if_author_description: true
