<script>
(()=>{
'use strict';
const DB=JSON.parse(document.getElementById('study-data').textContent), KEY='server-infrastructure-selfstudy-v6';
const ITEMS=new Map(DB.items.map(x=>[x.id,x])), CASES=new Map(DB.cases.map(x=>[x.id,x]));
// База работ практикума: сами ожидаемые значения лежат хешами, поэтому ответ
// не печатается в разметку — то же правило, что у мини-тренажёра. Хеш прячет
// ответ от чтения исходника, но не от перебора: пространство значений мало.
// Это защита от подглядывания, а не от подделки, и обещать большее нельзя.
const LABDB=JSON.parse(document.getElementById('lab-data').textContent);
const LABS=new Map(LABDB.labs.map(x=>[x.id,x]));
// Шкал две, а не одна. Отчёт работы вида dataset доказывает разбор выданных
// данных: стенда для неё не требуется вовсе, и практическим навыком он не
// станет ни при каком числе верных фактов. Практическую шкалу двигают только
// работы с полем bench — вид работы сам по себе доказательством не считается:
// сбор фактов тоже подтверждает лишь то, что перечислено в его сверке.
const LAB_KINDS={dataset:'Анализ готовых данных',collect:'Сбор фактов со стенда',stand:'Диагностика внесённой неисправности'};
const DATASET_LIMIT='Стенд не нужен: подтверждается разбор выданных данных и выбор механизма, а не действия на машине.';
const BENCH_LABS=LABDB.labs.filter(x=>x.bench===true);
// Критерии работы версионируются: расширенная сверка не должна засчитываться
// по отчёту, снятому под прежний, более узкий контракт.
const labCriteria=lab=>Number(lab.criteria)||1;
const labHash=(salt,value)=>{let h=0x811c9dc5;const feed=t=>{for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}};feed(salt);feed('|');feed(String(value));return h.toString(36);};
// Число модулей и порог итогового контроля берутся отсюда во всех расчётах:
// рассыпанные литералы уже расходились с числом заданий и молча портили счёт.
const MODULES=37, EXAM_PASS=32;
const VALID=new Set([...ITEMS.keys(),...DB.cases.flatMap(c=>c.stages.map((_,i)=>c.id+':'+i))]);
const TESTIDS=['N','M','P','C'].flatMap(p=>Array.from({length:7},(_,i)=>p+String(i+1).padStart(2,'0')));
// Число проверок программной практики задаётся составом TESTIDS, а не вторым литералом.
const PRACTICE_TESTS=TESTIDS.length;
const names=['Метод и единицы','Архитектура','Процессы','Память и VFS','Загрузка и доступ','Ранняя загрузка','Ethernet и IPv4','TCP, DNS, IPv6','VLAN и firewall','NUMA и RAS','PCIe и BMC','Питание и охлаждение','Block I/O','FS и LVM','RAID и SAS','Multipath/NFS','ZFS','Ceph и quorum','Производительность','Виртуализация','Наблюдаемость','Bash','Python/API','Ansible/Git','Контейнеры','CI/CD и IaC','Kubernetes','UEFI/PI','Фазы PI и передача ОС','ACPI/firmware','Доступ и криптография','Время и порядок','Долговечность данных','Надёжность и отказы','Инциденты и дежурство','Изменения и откат','Интеграция'];
// Уровни уверенности заявляются до проверки: без них самопроверка меряет только
// результат, а не разрыв между «кажется, знаю» и «знаю» — главную ошибку учёбы в одиночку.
const CONF=['догадка','склоняюсь к ответу','знаю'];
const ERRORS_MAX=300;
// Ответы попытки хранятся номерами вариантов, поэтому попытка привязана к тому
// порядку, при котором её начали: после перестановки вариантов старые номера
// означали бы уже другие строки, и проверка молча посчитала бы чужой ответ.
const ORDER=(()=>{let h=0x811c9dc5;const feed=t=>{for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}};DB.items.forEach(x=>(x.options||[]).forEach(feed));return h.toString(36);})();
const emptyCalibration=()=>CONF.map(()=>({n:0,correct:0}));
const newState=()=>({schema:'course-study-progress',version:DB.version,records:{},scenarios:{},exam:null,history:[],practice:null,calibration:emptyCalibration(),errors:[],labs:{}});
let state=newState(),storageOK=true,module=0,tab='learn';
// Почему прогресс не читается: ok — читается; foreign — другая версия банка;
// corrupt — повреждённые данные; unavailable — недоступное хранилище. Три
// случая раньше выглядели одним сообщением, и «не читается» молча
// превращалось в перезапись прежних данных при первом же ответе.
let storageWhy='ok',keptRaw=null,keptVersion='';
const KEPT_KEY='server-infrastructure-selfstudy-kept-v1';
const panel=document.getElementById('study-panel');
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};
const button=(text,fn)=>{const b=el('button',text);b.type='button';b.onclick=fn;return b;};
const link=(text,href)=>{const a=el('a',text);a.href=href;return a;};
const pad=n=>String(n).padStart(2,'0');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
// Отчёт работы приходит файлом с машины читателя: проверяется форма, а не
// независимая подпись. Подделать файл можно — но чтобы вписать правдоподобные
// факты, нужно знать внесённый вариант и вид подтверждённой гипотезы.
function labValid(r){
 if(!r||r.schema!=='course-lab-report'||r.version!==LABDB.version)return false;
 const lab=LABS.get(r.lab);
 if(!lab||r.kind!==lab.kind||!r.facts||typeof r.facts!=='object'||!r.claim||typeof r.claim!=='object')return false;
 if(!Number.isInteger(r.variant)||r.variant<0||r.variant>16)return false;
 if(typeof r.seed!=='string'||!/^[A-Za-z0-9_-]{2,64}$/.test(r.seed))return false;
 if(typeof r.collector_sha256!=='string'||!/^[a-f0-9]{64}$/.test(r.collector_sha256))return false;
 return Array.isArray(r.evidence)&&r.evidence.length>0&&r.evidence.length<=20;
}
// Сверка описана в самой работе, а не кодом под каждую: иначе двадцать работ
// означали бы двадцать почти одинаковых функций. Операция знает, что сравнить;
// что именно сравнивается — лежит в lab-data, и секретные значения там хешами.
const labExpected=(check,report,lab)=>lab.kind==='stand'?(lab.variants[report.variant]||{})[check.field]:(lab.expect||{})[check.field];
const LAB_OPS={
 // Заявленное читателем совпало с внесённым вариантом или с верным ответом.
 hash:(c,r,lab)=>labHash(lab.salt,r.claim[c.field])===labExpected(c,r,lab),
 // Измерение подтверждает заявленное: иначе ответ угадан, а не найден.
 sameAsClaim:(c,r)=>Number(r.facts[c.fact])===Number(r.claim[c.field]),
 matchesClaim:(c,r)=>String(r.facts[c.fact]??'')!==''&&String(r.facts[c.fact])===String(r.claim[c.field]),
 // Факт отстоит от заявленного на известную величину (полезная нагрузка и MTU).
 offset:(c,r)=>Number(r.facts[c.fact])===Number(r.claim[c.field])+Number(c.delta),
 equals:(c,r)=>String(r.facts[c.fact])===String(c.value),
 claimEquals:(c,r)=>String(r.claim[c.field])===String(c.value),
 isTrue:(c,r)=>r.facts[c.fact]===true,
 isFalse:(c,r)=>r.facts[c.fact]===false,
 atLeast:(c,r)=>Number(r.facts[c.fact])>=Number(c.value),
 atMost:(c,r)=>Number(r.facts[c.fact])<=Number(c.value),
 // Отсутствующий факт не сравнивается ни с чем: два null давали String('null')===String('null')
 // и зачёт за работу, которую скрипт не смог измерить вовсе.
 present:v=>v!==undefined&&v!==null&&String(v)!=='',
 same:(c,r,lab,ops)=>ops.present(r.facts[c.fact])&&ops.present(r.facts[c.other])&&String(r.facts[c.fact])===String(r.facts[c.other]),
 differs:(c,r,lab,ops)=>ops.present(r.facts[c.fact])&&ops.present(r.facts[c.other])&&String(r.facts[c.fact])!==String(r.facts[c.other]),
};
const labRows=(report,lab)=>{
 if(lab.kind==='stand'&&!lab.variants[report.variant])return [{name:'вариант инцидента',ok:false,note:'в отчёте вариант, которого нет в работе'}];
 return lab.checks.map(check=>{
  const op=check.op==='present'?null:LAB_OPS[check.op];
  const shown=check.field!==undefined?report.claim[check.field]:report.facts[check.fact];
  return {name:check.label,ok:op?!!op(check,report,lab,LAB_OPS):false,note:(check.note?check.note+': ':'')+(shown===undefined?'нет данных':String(shown))};
 });
};
// Вердикт работы считается один раз и в одном месте: карточка, общая шкала и
// таблица прогресса, считая каждая по-своему, разошлись бы незаметно.
function labResult(id){
 const lab=LABS.get(id),saved=state.labs[id];
 if(!lab||!saved)return null;
 const rows=labRows(saved.report,lab);
 return {lab,saved,rows,stale:(Number(saved.criteria)||1)<labCriteria(lab),ok:rows.every(r=>r.ok)&&saved.why===lab.why.answer};
}
// Практический трек завершён по цепочкам целиком, а не по числу работ: половина
// цепочки «восстановление данных» ничего не говорит о самой цепочке.
function benchInfo(){
 const done=BENCH_LABS.filter(lab=>{const r=labResult(lab.id);return !!r&&r.ok&&!r.stale;});
 const chains=[...new Set(BENCH_LABS.map(x=>x.chain))];
 return {need:BENCH_LABS.length,done:done.length,chains,left:chains.filter(c=>BENCH_LABS.some(x=>x.chain===c&&!done.includes(x)))};
}
function practiceValid(p){return p&&p.schema==='course-check-report'&&p.version===DB.version&&p.total===PRACTICE_TESTS&&Number.isInteger(p.passed)&&p.passed>=0&&p.passed<=PRACTICE_TESTS&&typeof p.code_sha256==='string'&&/^[a-f0-9]{64}$/.test(p.code_sha256)&&Array.isArray(p.tests)&&p.tests.length===PRACTICE_TESTS&&new Set(p.tests.map(x=>x.id)).size===PRACTICE_TESTS&&p.tests.every(x=>TESTIDS.includes(x.id)&&typeof x.pass==='boolean')&&p.tests.filter(x=>x.pass).length===p.passed;}
const plainObject=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
function validate(s){
 if(!s||s.schema!=='course-study-progress'||s.version!==DB.version||!s.records||typeof s.records!=='object'||Array.isArray(s.records))throw Error('Неподходящий формат или версия прогресса.');
 const clean=newState();
 for(const [id,r] of Object.entries(s.records)){if(!VALID.has(id)||!r||typeof r.correct!=='boolean'||!Number.isInteger(r.attempts)||r.attempts<1||r.attempts>100000||!Number.isFinite(r.last)||!Number.isFinite(r.due)||!Number.isInteger(r.streak)||r.streak<0)throw Error('Некорректная запись результата.');clean.records[id]={correct:r.correct,mechanism:typeof r.mechanism==='boolean'?r.mechanism:null,attempts:r.attempts,last:r.last,due:r.due,streak:Math.min(r.streak,10000)};}
 if(s.scenarios&&typeof s.scenarios==='object')for(const [id,n] of Object.entries(s.scenarios)){if(CASES.has(id)&&Number.isInteger(n)&&n>=0&&n<=4)clean.scenarios[id]=n;}
 if(Array.isArray(s.history))clean.history=s.history.filter(h=>h&&Number.isInteger(h.correct)&&Number.isInteger(h.total)&&h.total>0&&h.total<=200&&h.correct>=0&&h.correct<=h.total&&Number.isFinite(h.time)).slice(-100);
 if(Array.isArray(s.calibration)&&s.calibration.length===CONF.length)s.calibration.forEach((c,i)=>{if(c&&Number.isInteger(c.n)&&c.n>=0&&c.n<=1e6&&Number.isInteger(c.correct)&&c.correct>=0&&c.correct<=c.n)clean.calibration[i]={n:c.n,correct:c.correct};});
 if(Array.isArray(s.errors))clean.errors=s.errors.filter(e=>e&&ITEMS.has(e.id)&&Number.isFinite(e.time)&&Number.isInteger(e.conf)&&e.conf>=0&&e.conf<CONF.length).map(e=>({id:e.id,time:e.time,conf:e.conf,response:e.response,text:typeof e.text==='string'?e.text:undefined,done:!!e.done})).slice(-ERRORS_MAX);
 if(practiceValid(s.practice))clean.practice=s.practice;
 // Результаты работ переносятся вместе с прогрессом: отдельный ключ хранилища
 // потерялся бы при переносе в другой браузер молча.
 if(s.labs&&typeof s.labs==='object'&&!Array.isArray(s.labs))for(const [id,entry] of Object.entries(s.labs)){
  if(!LABS.has(id)||!entry||!labValid(entry.report)||entry.report.lab!==id)continue;
  const lab=LABS.get(id),why=entry.why;
  clean.labs[id]={report:entry.report,why:Number.isInteger(why)&&why>=0&&why<lab.why.options.length?why:null,criteria:Number.isInteger(entry.criteria)&&entry.criteria>0?Math.min(entry.criteria,labCriteria(lab)):1};}
 if(s.exam&&Array.isArray(s.exam.ids)&&s.exam.ids.length===MODULES&&new Set(s.exam.ids).size===MODULES&&s.exam.ids.every(id=>ITEMS.has(id))&&new Set(s.exam.ids.map(id=>ITEMS.get(id).module)).size===MODULES&&s.exam.responses&&typeof s.exam.responses==='object'&&s.exam.order===ORDER)clean.exam={ids:s.exam.ids,order:ORDER,responses:s.exam.responses,conf:plainObject(s.exam.conf),why:plainObject(s.exam.why),submitted:!!s.exam.submitted,started:Number(s.exam.started)||Date.now()};
 return clean;
}
// Прежние данные не перезаписываются при загрузке: нечитаемый прогресс
// остаётся в хранилище нетронутым, пока читатель не начнёт новый (см. save).
try{
 const raw=localStorage.getItem(KEY);
 if(raw!==null){
  let parsed;try{parsed=JSON.parse(raw);}catch{parsed=null;}
  if(parsed===null||parsed.schema!=='course-study-progress')storageWhy='corrupt';
  else if(parsed.version!==DB.version){storageWhy='foreign';keptVersion=String(parsed.version);}
  else{
   try{state=validate(parsed);}catch{storageWhy='corrupt';}
   if(storageWhy==='ok'){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageWhy='unavailable';}}
  }
  // Зачёты из другой версии не переносятся автоматически: совпадающие номера
  // заданий не доказывают, что задания не изменились. Исходная строка
  // сохраняется целиком — это и есть путь к восстановлению.
  if(storageWhy==='foreign'||storageWhy==='corrupt'){keptRaw=raw;state=newState();}
 }
}catch(e){storageWhy='unavailable';}
if(storageWhy==='unavailable')storageOK=false;
/* Шкала времени: дата первого зачёта модуля. Только добавление — записанная дата не меняется, интерфейса правки нет. Те же функции есть в site.js. */
const TIMELINE_KEY='server-infrastructure-timeline-v1';
function readTimeline(){try{const value=JSON.parse(localStorage.getItem(TIMELINE_KEY)||'null');return value&&value.events&&typeof value.events==='object'&&!Array.isArray(value.events)?value:{schema:'course-timeline',events:{}}}catch{return{schema:'course-timeline',events:{}}}}
function stampTimeline(key){const line=readTimeline();if(line.events[key])return;const now=new Date();line.events[key]=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);try{localStorage.setItem(TIMELINE_KEY,JSON.stringify(line))}catch{}}
function stampPassedModules(){for(let n=0;n<MODULES;n++)if(moduleInfo(n).passed)stampTimeline('module:'+n);}
// Первый save поверх нечитаемого прогресса — это переход: исходная строка
// сначала копируется в отдельный раздел, и лишь затем пишется новый прогресс.
// Не удалось сохранить копию — исходник не трогаем и честно об этом говорим.
function save(){
 if(keptRaw!==null){try{localStorage.setItem(KEPT_KEY,keptRaw);}catch{storageOK=false;storageWhy='unavailable';status();return;}}
 try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;keptRaw=null;storageWhy='ok';}catch{storageOK=false;storageWhy='unavailable';}
 stampPassedModules();status();}
// Механизм подтверждается вторым ярусом. Верный ответ без подтверждённого
// механизма в зачёт не идёт и возвращается на повторение сразу: угадать один
// вариант из четырёх нетрудно, а рассуждение из выбора не выводится.
function record(id,correct,conf,response,mechanism){const old=state.records[id],now=Date.now();const known=correct&&mechanism!==false;const streak=known?(old?.streak||0)+1:0;const days=known?[2,7,21][Math.min(streak-1,2)]:0;state.records[id]={correct,mechanism:mechanism===undefined?null:!!mechanism,attempts:(old?.attempts||0)+1,last:now,due:now+days*86400000,streak};
 if(Number.isInteger(conf)&&conf>=0&&conf<CONF.length){const cell=state.calibration[conf];cell.n++;if(correct)cell.correct++;
  // Журнал ошибок хранит саму попытку: разбирать нужно выбранный ответ, а не факт промаха.
  if(!correct&&ITEMS.has(id)){state.errors.push({id,time:now,conf,response,text:describe(ITEMS.get(id),response),done:false});state.errors=state.errors.slice(-ERRORS_MAX);}}
 save();}
// Задание засчитано, когда верен ответ и подтверждён механизм. У расчётных
// заданий и шагов сценария второго яруса нет: там ответ вводится числом или
// сам шаг стоит в цепочке рассуждения, поэтому угадывание уже ограничено.
function known(id){const r=state.records[id];if(!r?.correct)return false;const item=ITEMS.get(id);return item?.reason?r.mechanism===true:true;}
function moduleInfo(n){const ids=[...DB.items.filter(x=>x.module===n).map(x=>x.id),...[0,1,2,3].map(i=>'S'+pad(n)+':'+i)];const correct=ids.filter(known).length;const passed=correct>=6&&known('S'+pad(n)+':2')&&known('S'+pad(n)+':3');return {correct,passed:!!passed,ids};}
function completed(){return Array.from({length:MODULES},(_,i)=>moduleInfo(i)).filter(x=>x.passed).length;}
// Практическая шкала показывается отдельной таблицей: смешать её с модулями
// значило бы снова выдать разбор готовых данных за работу на стенде.
function benchTable(){
 const bench=benchInfo();
 panel.append(el('h3','Практика на стенде'),el('p','Сюда идут только работы, факты которых снимаются с настоящего стенда, — их '+bench.need+' из '+LABDB.labs.length+'. Остальные проверяют разбор выданных данных и в эту шкалу не входят.'));
 const table=el('table'),head=el('tr');['Работа','Цепочка','Вид','Статус'].forEach(t=>head.append(el('th',t)));table.append(head);
 for(const lab of BENCH_LABS){
  const r=labResult(lab.id),row=el('tr'),first=el('td');
  first.append(button(lab.id,()=>{module=lab.module;tab='learn';render();}));
  const failed=r?r.rows.filter(x=>!x.ok).length:0;
  const mark=!r?'Отчёт не загружен':r.stale?'Проверено по прежним критериям':r.ok?'Подтверждено':failed?'Не хватает фактов: '+failed:'Механизм объяснён неверно';
  row.append(first,el('td',lab.chain),el('td',LAB_KINDS[lab.kind]),el('td',mark));table.append(row);}
 panel.append(table,el('p','Самостоятельная отметка о выполненной работе — самоотчёт: она остаётся в вашем инженерном журнале и эту шкалу не двигает.','note'));
}
function status(){const done=completed(),practice=state.practice?.passed||0,best=Math.max(0,...state.history.filter(x=>x.total===MODULES).map(x=>x.correct));const theory=done===MODULES&&practice===PRACTICE_TESTS&&best>=EXAM_PASS;const bench=benchInfo();const box=document.getElementById('study-status');
 box.replaceChildren(
  el('strong',theory?'Теория и тренажёры: маршрут пройден по автоматическим критериям.':'Теория и тренажёры: маршрут ещё не завершён.'),
  el('div',`Модули: ${done}/${MODULES} · программные тесты: ${practice}/${PRACTICE_TESTS} · лучший итоговый: ${best}/${MODULES} (нужно ≥${EXAM_PASS}).`),
  el('strong',bench.done===bench.need?'Практика на стенде подтверждена.':'Практика на стенде подтверждена не полностью.'),
  el('div',`Стендовые работы: ${bench.done}/${bench.need}.${bench.left.length?' Незакрытые цепочки: '+bench.left.join(', ')+'.':''} Работы на готовых данных в эту шкалу не идут.`));
 const p=el('progress');p.max=MODULES;p.value=done;box.append(p);
 // Сообщение о хранилище различает три случая, которые раньше выглядели
 // одинаково: смена версии банка, повреждённые данные и недоступное

// защита от ошибки, а не от намерения: проверку в своём файле сотрёт кто угодно.
const STAND_KEY='server-infrastructure-stand-v1';
function standId(){try{return (localStorage.getItem(STAND_KEY)||'').trim()}catch(e){return ''}}
function standSet(v){try{v?localStorage.setItem(STAND_KEY,v):localStorage.removeItem(STAND_KEY)}catch(e){}}
// Номер обязан быть безопасен для подстановки в строку Python: проверяем форму,
// а не доверяем файлу. Шестнадцать шестнадцатеричных цифр — то, что выдаёт сборщик.
function standValid(v){return /^[0-9a-f]{16}$/.test(v)}
// Подстановка идёт по той самой строке, что объявлена в скрипте. Не найдя её,
// отдаём файл как есть: скрипт без привязки лучше, чем молча испорченный.
function stampLab(code){const id=standId();if(!id||!standValid(id))return code;
 return code.replace(/^STAND_ID = ''$/m,"STAND_ID = '"+id+"'");}
function standBox(parent){
 const id=standId(),box=el('div',undefined,'card');
 box.append(el('h3','Стенд'));
 box.append(el('p',id?'Скрипт работы выпускается для стенда '+id+' — на другой машине он откажется запускаться.':'Номер стенда не задан: скачанный скрипт будет работать на любой машине, где заведена метка /etc/course-lab-stand. Загрузите карточку course-stand.json — сборщик стенда кладёт её на хост Proxmox и называет путь в конце работы.','note'));
 const tools=el('div',undefined,'controls');box.append(tools);
 tools.append(fileInput(id?'Заменить карточку стенда':'Загрузить карточку стенда',async data=>{
  if(!data||data.schema!=='course-stand'||!standValid(String(data.stand||'')))throw Error('Ожидается course-stand.json с номером стенда из шестнадцати шестнадцатеричных цифр.');
  standSet(String(data.stand));render();}));
 if(id)tools.append(button('Забыть номер стенда',()=>{standSet('');render();}));
 parent.append(box);
}
function practice(){panel.append(el('h3','Четыре программные работы · 28 проверок'),el('p','subnet, metrics, percentile, capacity. Только Python 3.9+ и стандартная библиотека. Выполняется ваш код, без изменения серверной конфигурации.'),el('div',undefined,'controls'),el('pre','python course_checks.py init ./course-work\n# Реализуйте course-work/solutions.py\npython course_checks.py check ./course-work'),link('Полный контракт и ограничения','#autopractice'));
 panel.querySelector('.controls').append(button('Скачать course_checks.py',()=>download('course_checks.py',JSON.parse(document.getElementById('checker-code-data').textContent),'text/x-python;charset=utf-8')));
 panel.append(el('p','После запуска импортируйте course-work/course-check-report.json. Импорт проверяет структуру отчёта, а не независимую подпись; это инструмент честной самопроверки.'));
 const upload=el('div',undefined,'controls');panel.append(upload);upload.append(fileInput('Загрузить отчёт практикума',async data=>{if(!practiceValid(data))throw Error('Ожидается отчёт текущего checker с ровно 28 известными тестами и hash кода.');state.practice=data;save();render();}));if(state.practice){panel.append(el('p',`Пройдено ${state.practice.passed}/28. Код SHA-256: ${state.practice.code_sha256}`));for(const f of ['subnet','metrics','percentile','capacity']){const rows=state.practice.tests.filter(x=>x.function===f);panel.append(el('p',f+': '+rows.filter(x=>x.pass).length+'/7'));}}}
function labCard(lab,parent){
 const saved=state.labs[lab.id],card=el('div',undefined,'card lab-card');
 card.append(el('h3','Автопроверка · '+lab.id+' · '+LAB_KINDS[lab.kind]));
 // Читатель должен видеть, какой именно навык подтвердит этот отчёт, до того как
 // начнёт работу: «проверка пройдена» без границы читается как доказательство
 // всего, что описано в тексте работы, а подтверждается только перечисленное.
 card.append(el('p',lab.bench?'Идёт в шкалу «Практика на стенде» · цепочка: '+lab.chain:'В шкалу «Практика на стенде» не идёт.','note'));
 card.append(el('p',lab.intro),el('pre',lab.commands),el('p',lab.proof||DATASET_LIMIT,'note'));
 if(lab.kind==='stand')card.append(el('p','Стендовая работа: подготовка меняет настройки учебного стенда и требует root. Скрипт откажется работать без метки /etc/course-lab-stand, не трогает управляющую сеть и умеет вернуть изменённое.','note'));
 const tools=el('div',undefined,'controls');card.append(tools);
 tools.append(button('Скачать course_lab.py',()=>download('course_lab.py',stampLab(JSON.parse(document.getElementById('lab-code-data').textContent)),'text/x-python;charset=utf-8')));
 tools.append(fileInput('Загрузить отчёт '+lab.id,async data=>{
  if(!labValid(data))throw Error('Ожидается lab-report.json текущей версии для известной работы.');
  const before=state.labs[data.lab];
  state.labs[data.lab]={report:data,why:before&&before.report&&before.report.seed===data.seed?before.why:null,criteria:labCriteria(LABS.get(data.lab))};
  save();render();}));
 if(!saved){card.append(el('p','Отчёт не загружен. Вердикт выносит учебник: сам скрипт его не знает.'));parent.append(card);return;}
 const res=labResult(lab.id),rows=res.rows;
 // Отчёт, снятый под прежний, более узкий контракт, не выдаётся за проверку по
 // нынешнему: сверка расширилась, и прежнее «засчитано» её уже не описывает.
 if(res.stale)card.append(el('p','Этот отчёт проверен по прежним критериям работы. Сверка с тех пор расширилась — чтобы работа пошла в практическую шкалу, снимите отчёт заново.','note'));
 // Вердикт не показывается, пока не отвечен вопрос о механизме: правило то же,
 // что у заданий кабинета, и по той же причине — совпавшее число не является
 // объяснением.
 if(saved.why===null||saved.why===undefined){
  card.append(el('p','Отчёт принят. Прежде чем увидеть результат, объясните механизм.'),el('p',lab.why.q));
  const name='lab-'+lab.id+'-'+saved.report.seed;
  lab.why.options.forEach((text,index)=>{
   const label=el('label',undefined,'option'),input=el('input');
   input.type='radio';input.name=name;input.value=String(index);
   label.append(input,document.createTextNode(text));card.append(label);});
  card.append(button('Ответить',()=>{
   const picked=card.querySelector('input[name="'+name+'"]:checked');
   if(!picked){alert('Сначала выберите объяснение.');return;}
   state.labs[lab.id].why=Number(picked.value);save();render();}));
  parent.append(card);return;}
 const factsOK=rows.every(r=>r.ok),whyOK=saved.why===lab.why.answer;
 const result=el('div',undefined,'result');
 result.append(el('strong',factsOK&&whyOK?'Работа засчитана.':'Пока не засчитана.'));
 const list=el('ul');
 rows.forEach(r=>list.append(el('li',(r.ok?'✓ ':'✗ ')+r.name+' — '+r.note)));
 list.append(el('li',(whyOK?'✓ ':'✗ ')+'объяснение механизма'));
 result.append(list,el('p',lab.why.explanation));
 card.append(result);
 const seen=el('details');seen.append(el('summary','Что собрал скрипт'));
 saved.report.evidence.forEach(e=>seen.append(el('p',e.cmd+' → '+e.excerpt)));
 card.append(seen,button('Загрузить другой отчёт',()=>{delete state.labs[lab.id];save();render();}));
 parent.append(card);
}

function startExam(){if(state.exam&&!state.exam.submitted&&!confirm('Начать новый вариант? Ответы текущего незавершённого варианта будут заменены.'))return;state.exam={ids:Array.from({length:MODULES},(_,i)=>{const pool=DB.items.filter(x=>x.module===i);return pool[Math.floor(Math.random()*pool.length)].id;}),responses:{},conf:{},why:{},submitted:false,started:Date.now(),order:ORDER};save();render();}
function exam(){panel.append(el('h3','Итоговый контроль · по одному заданию из каждого модуля'),el('p','Порог ≥'+EXAM_PASS+'/'+MODULES+'. Задание засчитано, когда верны и ответ, и рассуждение. До отправки подсказки не показываются. Открытый банк и исходный код доступны: это учебная проверка, не защищённый экзамен.'),button(state.exam?'Новый вариант':'Начать вариант',startExam));if(!state.exam)return;const ex=state.exam;
 let correctCount=0;ex.ids.forEach((id,i)=>{const item=ITEMS.get(id),card=el('div',undefined,'card exam-card');card.append(el('h4',`${i+1}. U${pad(item.module)} · ${item.id}`),el('p',item.stem));if(!ex.submitted){answerInputs(item,card,ex.responses[id],v=>{ex.responses[id]=v;save();});const box=el('fieldset',undefined,'confidence');box.append(el('legend','Уверенность'));const unique='e-'+id;CONF.forEach((text,index)=>{const label=el('label',undefined,'conf-option'),input=el('input');input.type='radio';input.name=unique;input.value=index;input.checked=ex.conf[id]===index;input.onchange=()=>{ex.conf[id]=index;save();};label.append(input,document.createTextNode(text));box.append(label);});card.append(box);
   if(item.reason){const why=el('div',undefined,'reason-tier');why.append(el('h4','Какое рассуждение ведёт к этому выбору?'));answerInputs({id:id+'#why',options:item.reason.options,answer:item.reason.answer},why,ex.why[id],v=>{ex.why[id]=v;save();});card.append(why);}}
  else{const ok=evaluate(item,ex.responses[id]);const mech=item.reason?ex.why[id]===item.reason.answer:undefined;if(ok&&mech!==false)correctCount++;
   card.append(el('p',ok?'Верно':'Неверно',ok?'ok':'bad'),el('p',(item.reason?(mech?'Рассуждение верное. ':'Рассуждение выбрано другое — задание не засчитано. '):'')+'Отмечено до проверки: '+(CONF[ex.conf[id]]||'без отметки'),'note'),el('p',item.explanation),link('К теме','#ch'+pad(item.module)));}panel.append(card);});
 if(ex.submitted){panel.append(el('strong',`Результат: ${correctCount}/${MODULES} (${(100*correctCount/MODULES).toFixed(1)}%). ${correctCount>=EXAM_PASS?'Порог пройден.':'Повторите слабые темы.'}`));return;}
 panel.append(button('Отправить весь вариант на проверку',()=>{const missing=ex.ids.filter(id=>!answered(ITEMS.get(id),ex.responses[id]));if(missing.length){alert('Ответьте на все задания. Осталось: '+missing.length);return}const unrated=ex.ids.filter(id=>!Number.isInteger(ex.conf[id]));if(unrated.length){alert('Отметьте уверенность по каждому заданию. Осталось: '+unrated.length);return}const noWhy=ex.ids.filter(id=>ITEMS.get(id).reason&&!Number.isInteger(ex.why[id]));if(noWhy.length){alert('Выберите рассуждение по каждому заданию, где оно спрашивается. Осталось: '+noWhy.length);return}let correct=0;for(const id of ex.ids){const item=ITEMS.get(id),ok=evaluate(item,ex.responses[id]),mech=item.reason?ex.why[id]===item.reason.answer:undefined;if(ok&&mech!==false)correct++;record(id,ok,ex.conf[id],ex.responses[id],mech);}ex.submitted=true;state.history.push({correct,total:MODULES,time:Date.now()});state.history=state.history.slice(-100);save();render();}));}
// Перенос состояния живёт на «Маршруте» и только там. Своя кнопка экспорта
// в кабинете уносила один ключ из восьми: мини-тренажёры глав, календарь,
// заметки и настройки чтения оставались в старом браузере — молча, потому
// что файл при этом выглядел полноценной резервной копией.
function progress(){panel.append(el('h3','Прогресс по модулям'));const carry=el('p','Перенести прогресс в другой браузер: ');carry.append(link('резервная копия всего курса','#route-backup'));panel.append(carry);const table=el('table'),head=el('tr');['Модуль','Верно','Статус'].forEach(t=>head.append(el('th',t)));table.append(head);for(let n=0;n<MODULES;n++){const info=moduleInfo(n),row=el('tr'),first=el('td');first.append(button('U'+pad(n)+' '+names[n],()=>{module=n;tab='learn';render();}));row.append(first,el('td',info.correct+'/7'),el('td',info.passed?'Освоен':'В работе'));table.append(row);}panel.append(table,el('p','Попытки итогового контроля: '+state.history.map(h=>h.correct+'/'+h.total).join(', ')));benchTable();calibration();panel.append(button('Сбросить весь прогресс',()=>{if(confirm('Удалить текущий учебный прогресс в этом браузере? Сначала экспортируйте нужную копию.')){state=newState();save();render();}}));}
function render(){panel.replaceChildren();document.querySelectorAll('.navbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));({learn,mixed,review,errors,practice,exam,progress})[tab]();status();}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
// Exposes read-only validation functions for deterministic local QA; no server access.
window.CourseQA=Object.freeze({evaluate,numericOK,validate,practiceValid,labValid,labRows,bankSize:DB.items.length,caseSize:DB.cases.length,version:DB.version});
render();
})();
</script></body></html>
