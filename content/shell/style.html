<style>
:root{--ink:#182839;--muted:#506276;--paper:#fff;--bg:#f1f4f7;--line:#d4dde6;--accent:#165b79;--soft:#edf6f8}
*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#075c86;text-underline-offset:3px}a:hover{color:#ae4420}button,input,select{font:inherit}button{padding:8px 14px;border:1px solid #abc0cf;border-radius:6px;background:white;color:var(--ink);cursor:pointer}button:hover{background:var(--soft)}
aside{position:fixed;inset:0 auto 0 0;width:310px;background:#102b3c;color:white;overflow:auto;padding:24px 20px}aside a{color:#d6e8f0;text-decoration:none}aside a:hover{color:#fff;text-decoration:underline}aside input{width:100%;padding:10px;margin:16px 0;border:1px solid #67818f;border-radius:5px}aside ul{list-style:none;padding:0}aside li{margin:9px 0;font-size:14px;line-height:1.45}aside .level-2{padding-left:13px;border-left:1px solid #355467;color:#bfdae5}
.brand{font-size:24px;line-height:1.2;font-weight:700}.edition{color:#9bb8c8;font-size:13px;margin-top:10px}.content{margin-left:310px;padding:40px 48px 100px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;max-width:1040px;margin:0 auto 24px}.paper{max-width:1040px;margin:auto;background:white;padding:56px 62px;box-shadow:0 4px 22px #1735480a;border:1px solid var(--line);border-radius:8px}
h1,h2,h3,h4{line-height:1.28;color:#143b51;scroll-margin-top:22px}h1{font-size:32px;margin-top:70px;padding-top:26px;border-top:3px solid #1b7086}h1:first-child{margin-top:0;border-top:0;padding-top:0;font-size:43px}h2{font-size:25px;margin-top:40px}h2[id^=ch]{background:#edf5f7;padding:22px;border-left:5px solid #297e91;border-radius:0 6px 6px 0}h3{font-size:20px;margin-top:30px}p{margin:16px 0}li{margin:7px 0}blockquote{border-left:4px solid #70a3b4;margin:24px 0;padding:5px 22px;background:#f5f9fa}
pre{background:#132b3a;color:#eef5f7;padding:20px;border-radius:7px;overflow:auto;font-size:13px;line-height:1.6;tab-size:4}code{font-family:Consolas,"Liberation Mono",monospace;font-size:.87em;overflow-wrap:anywhere}p code,li code,td code{background:#f0f3f6;padding:2px 4px;border-radius:3px}pre code{font-size:inherit;overflow-wrap:normal}
table{width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.55;display:table}th,td{border:1px solid #cfdbe3;padding:10px 12px;vertical-align:top;overflow-wrap:anywhere}th.num,td.num{text-align:right}th{background:#eaf1f5;text-align:left}tr:nth-child(even) td{background:#f9fbfc}hr{border:0;border-top:1px solid var(--line);margin:38px 0}
details.answer-section{margin:40px 0;border:1px solid #b9cdd7;border-radius:7px;padding:22px;background:#fbfdfe}details summary{font-weight:700;color:#19475d;cursor:pointer}details.answer-section>h1{font-size:29px}.crossref{font-size:13px;color:var(--muted)}.quiz{background:#edf5f7;border:1px solid #bed6df;padding:24px;border-radius:8px;margin:25px 0}.quiz label{display:block;margin:10px 0;padding:9px;background:white;border-radius:5px}.quiz input{margin-right:10px}.feedback{font-weight:600}.progress{font-size:14px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:1100px){aside{width:250px}.content{margin-left:250px;padding:24px}.paper{padding:32px}}@media(max-width:760px){aside{position:relative;width:auto;max-height:350px}.content{margin:0;padding:14px}.paper{padding:23px 18px}h1:first-child{font-size:31px}h1{font-size:27px}h2{font-size:23px}table{font-size:12px}td,th{padding:7px}pre{font-size:12px}.toolbar{margin-top:10px}}
@media print{@page{size:A4;margin:18mm 15mm}body{background:white;font:10.5pt/1.45 Georgia,"Times New Roman",serif}aside,.toolbar,.quiz{display:none!important}.content{margin:0;padding:0}.paper{padding:0;max-width:none;border:0;box-shadow:none}h1{break-before:page;font-size:22pt;margin-top:0}h1:first-child{break-before:auto;font-size:28pt}h2{font-size:16pt}h3{font-size:12pt}h1,h2,h3,h4{break-after:avoid}table{font-size:8.5pt}tr,pre{break-inside:avoid}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:black;background:#f3f5f6;font-size:8pt}a{color:#163e58;text-decoration:none}details.answer-section{background:white;border:0;padding:0}details>summary{font-size:13pt}p{orphans:3;widows:3}}

.study-app{border:2px solid #337b8d;border-radius:10px;padding:24px;margin:32px 0;background:#f4f9fb}
.study-app h2{margin-top:8px}.study-app .controls{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.study-app select{max-width:100%;padding:9px}.study-app .card{background:white;border:1px solid #c8dbe4;border-radius:7px;padding:18px;margin:18px 0}.study-app label.option{display:block;padding:11px;margin:8px 0;border:1px solid #ccdce4;border-radius:5px;cursor:pointer}.study-app label.option:has(input:checked){background:#e1f0f5;border-color:#26738c}.study-app input[type=radio]{margin-right:9px}.study-app input.answer-field{width:100%;max-width:290px;padding:9px;border:1px solid #91b0be;border-radius:5px;display:block}.study-app .field{display:block;margin:12px 0}.study-app .ok{color:#146344}.study-app .bad{color:#9c361d}.study-app .note{font-size:14px;color:#4a6271}.study-app .result{padding:12px;border-left:4px solid #277b8e;background:#edf6f8;margin-top:12px}.study-app progress{width:100%;height:18px}.study-app table{font-size:13px}.study-app .status-box{padding:14px;background:#e7f2f6;border-radius:6px}.study-app pre{white-space:pre-wrap}.study-app .actions button{margin:5px 7px 5px 0}.study-app .hidden-input{display:none}.study-app button:disabled{opacity:.5;cursor:not-allowed}.study-app .file-label{display:inline-block;border:1px solid #abc0cf;border-radius:6px;background:white;padding:8px 14px;cursor:pointer}.study-app summary{cursor:pointer}.study-app .module-title{font-size:20px;font-weight:700}.study-app .exam-card{border-left:4px solid #709fac}.study-app .navbtn[aria-pressed=true]{background:#165b79;color:white}.study-app .review-item{margin:10px 0;padding:10px;background:white}
@media print{.study-app{display:none!important}}
</style>
