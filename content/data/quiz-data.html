<script type="application/json" id="quiz-data">[{"id": 1, "stem": "Какое утверждение лучше всего описывает роль `journalctl` в инженерной диагностике?", "options": {"A": "Инструмент восстановления повреждённой файловой системы.", "B": "Источник событий userspace/systemd/kernel, который используется как evidence.", "C": "Средство изменения kernel parameters.", "D": "Замена packet capture."}, "answer": "B", "module": 4}, {"id": 2, "stem": "Сервис имеет `active (running)`, но TCP-клиенты получают timeout. Что `active`\nдоказывает наиболее строго?", "options": {"A": "Приложение отвечает корректно.", "B": "Firewall не блокирует соединение.", "C": "systemd считает unit запущенным и его основной процесс не завершился по критерию unit.", "D": "DNS исправен."}, "answer": "C", "module": 4}, {"id": 3, "stem": "После удаления большого файла `df` не показывает освобождение места, а `du`\nпоказывает меньше данных. Какая гипотеза наиболее сильная?", "options": {"A": "ARP cache переполнен.", "B": "Удалённый inode всё ещё открыт процессом.", "C": "CPU работает в powersave.", "D": "Не хватает default route."}, "answer": "B", "module": 3}, {"id": 4, "stem": "Что происходит раньше при обычной Linux boot chain?", "options": {"A": "systemd запускает services до kernel.", "B": "Bootloader передаёт управление kernel, после чего kernel запускает ранний userspace/initramfs.", "C": "initramfs запускает firmware.", "D": "systemd выбирает UEFI boot entry."}, "answer": "B", "module": 4}, {"id": 5, "stem": "Kernel уже запущен и система оказалась в initramfs shell из-за отсутствия root\nустройства. Какой слой уже частично доказан как работоспособный?", "options": {"A": "Bootloader смог передать управление kernel.", "B": "Application layer.", "C": "NFS server.", "D": "Grafana."}, "answer": "A", "module": 4}, {"id": 6, "stem": "Host `10.10.10.11/24` отправляет пакет к `10.10.20.12`. Какое действие требуется\nдо передачи Ethernet frame к удалённой сети?", "options": {"A": "Разрешить MAC конечного `10.10.20.12` через ARP.", "B": "Выбрать route/next hop и разрешить L2 identity next hop.", "C": "Отправить DNS query независимо от адреса назначения.", "D": "Выполнить TCP handshake с gateway."}, "answer": "B", "module": 6}, {"id": 7, "stem": "Для destination вне локальной IPv4 subnet ARP обычно выполняется для:", "options": {"A": "DNS server.", "B": "Next-hop gateway.", "C": "Remote host через все маршрутизаторы.", "D": "DHCP server."}, "answer": "B", "module": 6}, {"id": 8, "stem": "Какой принцип определяет выбор route при нескольких совпадающих prefixes?", "options": {"A": "Самый старый route.", "B": "Наибольший MTU.", "C": "Наиболее специфичный prefix, затем дополнительные правила/метрики.", "D": "Самое короткое имя interface."}, "answer": "C", "module": 6}, {"id": 9, "stem": "TCP handshake проходит, но крупные HTTPS responses через tunnel зависают. Какую\nгипотезу нужно проверить приоритетно?", "options": {"A": "PMTU/MTU.", "B": "Отсутствие systemd.", "C": "Неверный PCIe BDF.", "D": "RAID parity."}, "answer": "A", "module": 7}, {"id": 10, "stem": "Что VLAN tag изменяет непосредственно?", "options": {"A": "Разделение Ethernet traffic по логическим L2 domains.", "B": "TCP congestion window.", "C": "Filesystem block size.", "D": "CPU NUMA node."}, "answer": "A", "module": 8}, {"id": 11, "stem": "`lspci` не показывает установленную PCIe-карту. Какой шаг наименее разумен первым?", "options": {"A": "Проверить установку/riser/power.", "B": "Проверить BIOS/bifurcation/root-port topology.", "C": "Переустановить application package, который использует карту.", "D": "Проверить firmware visibility."}, "answer": "C", "module": 10}, {"id": 12, "stem": "`lspci` видит endpoint, но driver не bound. Как это изменяет диагностику?", "options": {"A": "Basic PCIe enumeration уже доказана; приоритет смещается к binding/resources/init.", "B": "Нужно менять Ethernet cable.", "C": "Карта точно физически неисправна.", "D": "Kernel точно не работает."}, "answer": "A", "module": 10}, {"id": 13, "stem": "Что означает PCIe BDF?", "options": {"A": "Block:Disk:Filesystem.", "B": "Bus:Device.Function.", "C": "Boot:Driver:Firmware.", "D": "Buffer:Descriptor:Frame."}, "answer": "B", "module": 10}, {"id": 14, "stem": "Зачем сопоставлять PCIe device с NUMA node?", "options": {"A": "Для оценки локальности CPU/memory/I/O и performance effects.", "B": "Чтобы узнать DNS suffix.", "C": "Чтобы создать GPT.", "D": "Чтобы определить filesystem UUID."}, "answer": "A", "module": 9}, {"id": 15, "stem": "BMC SEL полезен прежде всего потому, что:", "options": {"A": "хранит только application logs.", "B": "может содержать out-of-band аппаратные события, когда OS уже не могла писать лог.", "C": "заменяет SMART.", "D": "автоматически восстанавливает RAID."}, "answer": "B", "module": 10}, {"id": 16, "stem": "Все диски одной SAS shelf исчезли одновременно. Какая гипотеза обычно сильнее?", "options": {"A": "Независимый media failure каждого диска.", "B": "Общий failure domain: expander, shelf power или upstream link.", "C": "Ошибка DNS.", "D": "Неверный timezone."}, "answer": "B", "module": 14}, {"id": 17, "stem": "Четыре `/dev/sdX` имеют один WWID. Что проверить до форматирования?", "options": {"A": "Multipath.", "B": "CPU governor.", "C": "SSH host key.", "D": "GRUB theme."}, "answer": "A", "module": 15}, {"id": 18, "stem": "Что HBA в direct/IT-mode модели обычно предоставляет ОС?", "options": {"A": "Один virtual disk независимо от drives.", "B": "Более прямую видимость individual drives/targets.", "C": "DNS forwarding.", "D": "CPU virtualization."}, "answer": "B", "module": 14}, {"id": 19, "stem": "Что лучше всего характеризует hardware RAID controller?", "options": {"A": "Он всегда показывает каждый physical drive отдельно.", "B": "Он может агрегировать drives и представить ОС logical/virtual disks.", "C": "Он заменяет filesystem.", "D": "Он выполняет ARP."}, "answer": "B", "module": 14}, {"id": 20, "stem": "После увеличения LVM LV с 300 до 500 GiB `df` всё ещё показывает около 300 GiB.\nНаиболее вероятно:", "options": {"A": "Filesystem ещё не расширен или смонтирован не тот объект.", "B": "Нужно изменить VLAN.", "C": "Сломан DNS.", "D": "Уменьшился PCIe width."}, "answer": "A", "module": 13}, {"id": 21, "stem": "Почему число IOPS без контекста не описывает storage performance?", "options": {"A": "IOPS всегда равно throughput.", "B": "Нужны block size, pattern, queue depth, latency и параметры workload.", "C": "IOPS применимо только к tape.", "D": "IOPS показывает CPU temperature."}, "answer": "B", "module": 18}, {"id": 22, "stem": "Что лучше всего характеризует user-visible I/O latency?", "options": {"A": "Только average throughput.", "B": "Latency distribution/percentiles вместе с workload context.", "C": "Только disk capacity.", "D": "Только filesystem label."}, "answer": "B", "module": 18}, {"id": 23, "stem": "Что multipath решает концептуально?", "options": {"A": "Объединяет несколько путей одного storage identity в управляемое представление.", "B": "Создаёт VLAN.", "C": "Запускает containers.", "D": "Шифрует UEFI variables."}, "answer": "A", "module": 15}, {"id": 24, "stem": "Что snapshot сам по себе НЕ гарантирует?", "options": {"A": "Представление состояния данных на определённый момент.", "B": "Независимую off-host копию, переживающую потерю исходного storage.", "C": "Быстрый rollback в некоторых системах.", "D": "CoW semantics в некоторых реализациях."}, "answer": "B", "module": 16}, {"id": 25, "stem": "Почему `iostat` внутри VM недостаточно для полной диагностики disk latency?", "options": {"A": "Guest не видит underlying host/backend path и contention полностью.", "B": "VM не использует block devices.", "C": "`iostat` показывает только DNS.", "D": "Hypervisor не влияет на I/O."}, "answer": "A", "module": 19}, {"id": 26, "stem": "Какую роль Linux bridge обычно выполняет в виртуализационном стенде?", "options": {"A": "L2 forwarding между virtual/physical interfaces.", "B": "Filesystem journal.", "C": "UEFI boot manager.", "D": "RAID parity calculator."}, "answer": "A", "module": 8}, {"id": 27, "stem": "Почему `Running` у Kubernetes Pod не доказывает доступность Service?", "options": {"A": "Service может не выбрать Pod по labels/selectors или иметь пустые endpoints.", "B": "Kubernetes не использует сеть.", "C": "Pod автоматически слушает все ports.", "D": "Service существует только в firmware."}, "answer": "A", "module": 26}, {"id": 28, "stem": "Какое свойство Ansible наиболее важно для повторяемой эксплуатации?", "options": {"A": "Idempotency.", "B": "Только интерактивный shell.", "C": "Зависимость от GUI.", "D": "Отсутствие inventory."}, "answer": "A", "module": 23}, {"id": 29, "stem": "Зачем использовать `set -euo pipefail` в инженерном Bash-скрипте?", "options": {"A": "Для более строгого обнаружения части ошибок, undefined variables и pipeline failures.", "B": "Для автоматического исправления hardware faults.", "C": "Для создания RAID.", "D": "Для шифрования network traffic."}, "answer": "A", "module": 21}, {"id": 30, "stem": "Что должен делать read-only diagnostic collector по умолчанию?", "options": {"A": "Менять состояние, чтобы «попробовать починить».", "B": "Собирать evidence без разрушительных изменений.", "C": "Выполнять `wipefs`.", "D": "Перезагружать BMC."}, "answer": "B", "module": 22}, {"id": 31, "stem": "Какой признак отличает хороший alert от простого threshold?", "options": {"A": "Он связан с impact, устойчивым условием и действием/runbook.", "B": "Он срабатывает на каждое краткое отклонение.", "C": "В нём нет context.", "D": "Он всегда использует только CPU%."}, "answer": "A", "module": 20}, {"id": 32, "stem": "Что RPO описывает в backup/recovery?", "options": {"A": "Допустимый объём потери данных по времени.", "B": "Скорость CPU.", "C": "VLAN ID.", "D": "PCIe width."}, "answer": "A", "module": 20}, {"id": 33, "stem": "Что RTO описывает?", "options": {"A": "Допустимое время восстановления сервиса.", "B": "RAID stripe size.", "C": "NUMA node count.", "D": "TCP source port."}, "answer": "A", "module": 20}, {"id": 34, "stem": "В какой фазе UEFI/PI обычно выполняется ранняя инициализация памяти до DXE?", "options": {"A": "PEI.", "B": "BDS.", "C": "systemd.", "D": "Kubernetes scheduler."}, "answer": "A", "module": 27}, {"id": 35, "stem": "Что DXE protocol в EDK2/PI модели представляет концептуально?", "options": {"A": "Интерфейс, через который firmware components предоставляют/используют services.", "B": "DNS record.", "C": "Linux group.", "D": "RAID metadata."}, "answer": "A", "module": 27}, {"id": 36, "stem": "UEFI Shell и Linux видят PCI endpoint, но driver не может использовать BAR/resources.\nКакой слой становится главным?", "options": {"A": "Resource allocation/driver/device initialization.", "B": "Ethernet ARP.", "C": "DNS cache.", "D": "Filesystem quota."}, "answer": "A", "module": 29}, {"id": 37, "stem": "После BIOS update исчезли NVMe на passive bifurcation card. Что сравнивают первым?", "options": {"A": "Pre/post firmware settings и PCIe topology.", "B": "Только `/etc/hosts`.", "C": "NTP.", "D": "Docker tags."}, "answer": "A", "module": 29}, {"id": 38, "stem": "Почему изменение конфигурации до сбора evidence вредно?", "options": {"A": "Оно может уничтожить исходное состояние и сделать root cause недоказуемым.", "B": "Оно всегда уменьшает latency.", "C": "Оно гарантирует recovery.", "D": "Оно необходимо для чтения logs."}, "answer": "A", "module": 0}, {"id": 39, "stem": "Какой ответ лучше демонстрирует инженерное мышление?", "options": {"A": "«Запущу десять команд и посмотрю».", "B": "«Сформулирую гипотезу, предскажу наблюдение, измерю и обновлю модель».", "C": "«Перезагружу до исчезновения симптома».", "D": "«Заменю самый дорогой компонент»."}, "answer": "B", "module": 0}, {"id": 40, "stem": "Какой результат сильнее всего показывает выпускное владение материалом?", "options": {"A": "Умение перечислить 100 команд.", "B": "Умение безопасно локализовать неизвестный multi-layer incident, восстановить сервис и объяснить root cause.", "C": "Умение запомнить определения.", "D": "Умение установить одну Linux VM."}, "answer": "B", "module": 36}]</script>
