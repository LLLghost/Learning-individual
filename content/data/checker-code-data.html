<script type="application/json" id="checker-code-data">"#!/usr/bin/env python3\n\"\"\"Offline self-study checker, Python 3.9+, standard library only.\nCreates only a new user-selected exercise directory; never modifies server settings.\nThe learner's Python code runs as their ordinary local user, not in a security sandbox.\n\"\"\"\nimport argparse\nimport datetime as dt\nimport hashlib\nimport json\nimport math\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\nVERSION = '6.0-selfstudy-1'\nTEMPLATE = '''\"\"\"Реализуйте четыре функции. Не копируйте ключи до самостоятельной попытки.\n\nsubnet(cidr): IPv4 CIDR -> dict network(str), broadcast(str), hosts(int).\n  Для /31 hosts=2, /32 hosts=1; для остальных count=2^(32-prefix)-2.\n  Невалидный IPv4 CIDR -> ValueError. Можно использовать ipaddress.\n\nmetrics(iops, bs_bytes, latency_ms): неотрицательные rates/latency, bs>0.\n  -> dict bps, mibps, inflight. Время в формуле Little переводится в секунды.\n  Отрицательный iops/latency или неположительный bs -> ValueError.\n\npercentile(values, p): 0<p<=100, непустой список чисел.\n  -> nearest-rank percentile; исходный список не изменять.\n  Невалидный p/пустой список -> ValueError.\n\ncapacity(n, size_tb, level, spares=0): n включает spare, size_tb>0.\n  level: 'raid1' (>=2 active), 'raid5' (>=3), 'raid6' (>=4),\n  'raid10' (чётное active>=4). n/spares целые, spares>=0.\n  -> dict usable_tb, usable_tib, без filesystem overhead.\n  Невалидная конфигурация -> ValueError.\n\"\"\"\n\ndef subnet(cidr):\n    raise NotImplementedError('Реализуйте subnet')\n\ndef metrics(iops, bs_bytes, latency_ms):\n    raise NotImplementedError('Реализуйте metrics')\n\ndef percentile(values, p):\n    raise NotImplementedError('Реализуйте percentile')\n\ndef capacity(n, size_tb, level, spares=0):\n    raise NotImplementedError('Реализуйте capacity')\n'''\n\nTESTS = [\n ('N01','subnet',['192.0.2.130/26'],{'network':'192.0.2.128','broadcast':'192.0.2.191','hosts':62},None),\n ('N02','subnet',['10.4.7.70/27'],{'network':'10.4.7.64','broadcast':'10.4.7.95','hosts':30},None),\n ('N03','subnet',['203.0.113.6/31'],{'network':'203.0.113.6','broadcast':'203.0.113.7','hosts':2},None),\n ('N04','subnet',['203.0.113.9/32'],{'network':'203.0.113.9','broadcast':'203.0.113.9','hosts':1},None),\n ('N05','subnet',['10.5.255.255/17'],{'network':'10.5.128.0','broadcast':'10.5.255.255','hosts':32766},None),\n ('N06','subnet',['10.1.1.999/24'],None,'ValueError'),\n ('N07','subnet',['10.1.1.1/33'],None,'ValueError'),\n ('M01','metrics',[80000,4096,0.5],{'bps':327680000,'mibps':312.5,'inflight':40},None),\n ('M02','metrics',[32000,16384,1.5],{'bps':524288000,'mibps':500,'inflight':48},None),\n ('M03','metrics',[0,4096,2],{'bps':0,'mibps':0,'inflight':0},None),\n ('M04','metrics',[1250,1048576,4],{'bps':1310720000,'mibps':1250,'inflight':5},None),\n ('M05','metrics',[-1,4096,1],None,'ValueError'),\n ('M06','metrics',[1,0,1],None,'ValueError'),\n ('M07','metrics',[1,4096,-1],None,'ValueError'),\n ('P01','percentile',[[1,2,2,3,12],80],3,None),\n ('P02','percentile',[[100,8,5,4,3,3,2,2,1,1],99],100,None),\n ('P03','percentile',[[9,1,2],50],2,None),\n ('P04','percentile',[[7],95],7,None),\n ('P05','percentile',[[1,2],100],2,None),\n ('P06','percentile',[[],95],None,'ValueError'),\n ('P07','percentile',[[1,2],0],None,'ValueError'),\n ('C01','capacity',[8,4,'raid6',0],{'usable_tb':24,'usable_tib':24*10**12/2**40},None),\n ('C02','capacity',[9,8,'raid6',1],{'usable_tb':48,'usable_tib':48*10**12/2**40},None),\n ('C03','capacity',[4,6,'raid10',0],{'usable_tb':12,'usable_tib':12*10**12/2**40},None),\n ('C04','capacity',[3,2,'raid1',0],{'usable_tb':2,'usable_tib':2*10**12/2**40},None),\n ('C05','capacity',[5,4,'raid5',1],{'usable_tb':12,'usable_tib':12*10**12/2**40},None),\n ('C06','capacity',[5,4,'raid10',0],None,'ValueError'),\n ('C07','capacity',[4,4,'raid6',1],None,'ValueError'),\n]\n\nWORKER = '''import importlib.util,json,sys,contextlib,io,os\npath,fn,args=sys.argv[1],sys.argv[2],json.loads(sys.argv[3])\noriginal=json.loads(json.dumps(args))\ntry:\n    with open(os.devnull,'w') as quiet,contextlib.redirect_stdout(quiet),contextlib.redirect_stderr(quiet):\n        spec=importlib.util.spec_from_file_location('learner',path)\n        module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\n        value=getattr(module,fn)(*args)\n    result={'value':value,'mutated':args!=original}\nexcept BaseException as exc:\n    result={'exception':type(exc).__name__,'is_value_error':isinstance(exc,ValueError),'message':str(exc)[:400]}\nprint(json.dumps(result,ensure_ascii=False,allow_nan=False))\n'''\n\ndef equal(expected, actual):\n    if isinstance(expected, dict):\n        return isinstance(actual,dict) and set(actual)==set(expected) and all(equal(v,actual[k]) for k,v in expected.items())\n    if isinstance(expected,(int,float)) and not isinstance(expected,bool):\n        return isinstance(actual,(int,float)) and not isinstance(actual,bool) and math.isfinite(actual) and math.isclose(expected,actual,rel_tol=1e-8,abs_tol=1e-9)\n    return actual==expected\n\ndef check(folder):\n    solution=folder/'solutions.py'\n    if not solution.is_file():\n        raise SystemExit('Нет solutions.py; сначала init, затем реализуйте функции.')\n    rows=[]\n    for ident,func,args,expected,error in TESTS:\n        start=time.monotonic()\n        try:\n            # Worker stdout is constrained by the checker contract. Learner code output is discarded.\n            completed=subprocess.run([sys.executable,'-X','utf8','-I','-c',WORKER,str(solution.resolve()),func,json.dumps(args)],\n                capture_output=True,text=True,encoding='utf-8',timeout=3)\n            if completed.returncode!=0:\n                row={'id':ident,'function':func,'pass':False,'reason':'worker exited nonzero'}\n            else:\n                actual=json.loads(completed.stdout)\n                passed=(actual.get('exception')==error or (error=='ValueError' and actual.get('is_value_error') is True)) if error else ('exception' not in actual and equal(expected,actual.get('value')) and not actual.get('mutated'))\n                row={'id':ident,'function':func,'pass':bool(passed),'input':args,'expected_exception':error,'expected':expected,'actual':actual}\n        except subprocess.TimeoutExpired:\n            row={'id':ident,'function':func,'pass':False,'reason':'timeout >3s'}\n        except (ValueError,OSError) as exc:\n            row={'id':ident,'function':func,'pass':False,'reason':str(exc)[:400]}\n        row['elapsed_s']=round(time.monotonic()-start,3);rows.append(row)\n    passed=sum(row['pass'] for row in rows)\n    report={'schema':'course-check-report','version':VERSION,'timestamp_utc':dt.datetime.now(dt.timezone.utc).isoformat(),\n      'code_sha256':hashlib.sha256(solution.read_bytes()).hexdigest(),'passed':passed,'total':len(TESTS),\n      'tests':rows,'scope':'four Python exercises; no real-server/hardware qualification'}\n    target=folder/'course-check-report.json'\n    target.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')\n    print(f'{passed}/{len(TESTS)} PASS. Отчёт: {target.resolve()}')\n    for row in rows:\n        if not row['pass']:print('FAIL',row['id'],row['function'],row.get('reason',row.get('actual')))\n    return 0 if passed==len(TESTS) else 2\n\ndef main():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument('command',choices=['init','check']);p.add_argument('directory',type=Path)\n    args=p.parse_args();folder=args.directory.resolve()\n    if args.command=='init':\n        if folder.exists():raise SystemExit('init требует новый каталог; существующий не изменён.')\n        folder.mkdir(parents=True)\n        (folder/'solutions.py').write_text(TEMPLATE,encoding='utf-8')\n        print('Создано',folder/'solutions.py');return 0\n    return check(folder)\n\nif __name__=='__main__':\n    raise SystemExit(main())\n"</script>
