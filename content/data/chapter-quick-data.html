<script type="application/json" id="chapter-quick-data">{"0": [[{"id": "C00-0", "stem": "Зачем в учебном стенде отдельные CLIENT-NET, SERVER-NET и STORAGE-NET?", "options": ["Чтобы наблюдать маршрутизацию и отказы между изолированными сегментами", "Чтобы каждая VM обязательно получила выход в интернет без маршрутизатора", "Чтобы заменить резервное копирование виртуальных машин", "Чтобы платформа автоматически исправляла сетевые ошибки"], "answer": 0, "explanation": "Изолированные мосты создают наблюдаемые сегменты второго уровня. Связь между ними требует маршрутизатора, поэтому путь пакета можно разбирать по слоям."}, {"id": "C00-0b", "stem": "Две учебные машины в разных сегментах стенда не видят друг друга. Что это значит?", "options": ["Так и задумано: между сегментами нужен маршрутизатор", "Мосты стенда настроены с ошибкой и требуют пересборки", "Платформа виртуализации не поддерживает такие сегменты", "Машинам не хватает второго сетевого интерфейса каждой"], "answer": 0, "explanation": "Изолированный мост — отдельный домен второго уровня. Связь между сегментами даёт маршрутизатор, и поэтому путь пакета на стенде разбирается по слоям."}], [{"id": "C00-1", "stem": "Что делает повторение работы со сломанным стендом осмысленным?", "options": ["Перезагрузка всех машин после каждого изменения", "Единственная копия стенда без описания", "Известная исходная точка: шаблон или снимок плюс зафиксированная конфигурация", "Одновременная замена нескольких настроек"], "answer": 2, "explanation": "Известная исходная точка делает опыт повторяемым и позволяет связать наблюдаемый эффект с конкретным изменением."}, {"id": "C00-1b", "stem": "Почему работу на стенде начинают со снимка и записанной конфигурации?", "options": ["Чтобы снимок заменил резервную копию рабочих данных", "Чтобы наблюдаемый эффект можно было связать с изменением", "Чтобы стенд занимал меньше места на диске гипервизора", "Чтобы не пришлось записывать версии пакетов и образов"], "answer": 1, "explanation": "Опыт повторяем только от известной исходной точки: без неё непонятно, что именно вызвало наблюдаемый эффект."}]], "1": [[{"id": "C01-0", "stem": "Что в этой главе называется границей, которую ищет диагностика?", "options": ["Административную границу между отделами", "Уровень, на котором ожидаемое состояние перестаёт совпадать с наблюдаемым", "Момент, когда истекает время на устранение отказа", "Предел нагрузки, после которого сервис деградирует"], "answer": 1, "explanation": "Инцидент разбирается как поиск границы: до неё система ведёт себя как ожидается, после — нет. Каждый следующий шаг сокращает число возможных причин."}, {"id": "C01-0b", "stem": "Что должно сокращаться на каждом шаге разбора?", "options": ["Время ответа сервиса пользователю", "Количество открытых журналов системы", "Число возможных причин отказа", "Число задействованных инструментов"], "answer": 2, "explanation": "Разбор идёт к границе, за которой ожидаемое перестаёт совпадать с наблюдаемым. Шаг, не сокращающий число причин, разбор не двигает."}], [{"id": "C01-1", "stem": "Перебор «перезапустить сервис → выключить экран → перезагрузить сервер» иногда устраняет отказ. Почему глава считает это ошибкой?", "options": ["Такой перебор занимает слишком много времени", "Эти команды требуют прав суперпользователя", "После него нельзя сказать, что было причиной, какое действие помогло и повторится ли отказ", "Перезагрузка опаснее любого другого действия"], "answer": 2, "explanation": "Диагностика — это скорость уменьшения неопределённости, а не скорость перебора. Случайно снятый симптом не даёт ни причины, ни минимального исправления, ни способа заметить отказ раньше."}, {"id": "C01-1b", "stem": "Отказ ушёл после перезагрузки сервера. Чего у вас теперь нет?", "options": ["Записи о времени начала и конца простоя", "Возможности обратиться к поставщику оборудования", "Работающего сервиса и довольных пользователей", "Причины, минимального исправления и раннего признака"], "answer": 3, "explanation": "Случайно снятый симптом не даёт ни причины, ни минимального исправления, ни способа заметить отказ раньше."}]], "2": [[{"id": "C02-0", "stem": "Как глава предлагает воспринимать Linux при диагностике?", "options": ["Как набор утилит командной строки, который нужно выучить", "Как ядро, дающее процессы, память, VFS, сеть и блочный слой, которые пространство пользователя наблюдает через системные вызовы и /proc", "Как дистрибутив, поведение которого определяется выбором поставщика", "Как оболочку, в которой выполняются команды администратора"], "answer": 1, "explanation": "Модель ядра и интерфейсов к нему — основа всех последующих глав: они уточняют отдельные части этой картины."}, {"id": "C02-0b", "stem": "Через что пространство пользователя наблюдает работу ядра?", "options": ["Через системные вызовы и файловые системы /proc и /sys", "Через счётчики производительности самого процессора", "Через журнал systemd и файлы в /var/log", "Через показания датчиков контроллера управления"], "answer": 0, "explanation": "Процессы, память, VFS, сеть и блочный слой видны снаружи именно через этот интерфейс — на нём построены все последующие главы."}], [{"id": "C02-1", "stem": "Почему load average 8 на восьмиядерной машине не означает стопроцентную загрузку процессора?", "options": ["Значение усредняется за минуту и потому занижено", "Load average считается в процентах от одного ядра", "Гипервизор округляет значение в меньшую сторону", "В Linux в него входят и задачи в непрерываемом сне, ожидающие устройство"], "answer": 3, "explanation": "Это два разных вопроса: сколько задач хотят выполняться или ждут устройство и сколько процессорного времени занято. Машина с load average 8 может простаивать на 90%."}, {"id": "C02-1b", "stem": "Какой вопрос load average не отвечает?", "options": ["Сколько задач ждут завершения работы устройства", "Какая доля процессорного времени занята работой", "Растёт очередь на машине или сокращается", "Сколько задач хотят выполняться прямо сейчас"], "answer": 1, "explanation": "В Linux в среднюю нагрузку входят и задачи в непрерываемом сне. Машина с load average 8 может простаивать на девяносто процентов."}]], "3": [[{"id": "C03-0", "stem": "От чего, кроме битов режима самого файла, зависит доступ к нему?", "options": ["Только от того, включён ли SELinux", "От владельца процесса, ACL, опций монтирования и возможности пройти каждый каталог пути", "От порядка записей в /etc/passwd", "От размера файла и файловой системы, на которой он лежит"], "answer": 1, "explanation": "Доступ вычисляется на всём пути и для того пользователя, под которым реально работает процесс, — а он почти никогда не тот, под кем вы вошли."}, {"id": "C03-0b", "stem": "Под каким пользователем нужно проверять доступ к файлу сервиса?", "options": ["Под суперпользователем: у него доступ полный", "Под владельцем самого файла и каталога", "Под тем, под которым реально работает процесс", "Под тем, под которым вы вошли на машину"], "answer": 2, "explanation": "Доступ вычисляется для владельца процесса и на всём пути к файлу, а он почти никогда не тот, под кем вы вошли."}], [{"id": "C03-1", "stem": "Почему права 777 на файле не гарантируют, что сервис сможет в него писать?", "options": ["Ядро игнорирует режим 777 из соображений безопасности", "Такие права действуют только для владельца", "На каждом каталоге пути нужен бит x", "Файловая система обязана быть смонтирована в режиме noexec"], "answer": 2, "explanation": "chmod 777 обычно не чинит проблему, а прячет её и создаёт новую. Проверять доступ нужно от имени того пользователя, под которым работает сервис."}, {"id": "C03-1b", "stem": "Чего не хватает, если файл доступен всем, а сервис в него не пишет?", "options": ["Свободного места в файловой системе", "Записи о файле в настройках самого сервиса", "Перезапуска сервиса после смены прав", "Бита x хотя бы на одном каталоге пути"], "answer": 3, "explanation": "Права проверяются на каждом каталоге пути. chmod 777 обычно не чинит проблему, а прячет её и создаёт новую."}]], "4": [[{"id": "C04-0", "stem": "Как глава предлагает воспринимать systemd?", "options": ["Как менеджер графа юнитов и контекстов выполнения", "Как замену сценариям оболочки в каталоге init.d", "Как службу, единственная задача которой", "Как средство просмотра журналов с дополнительными командами"], "answer": 0, "explanation": "Большинство проблем сводится к трём вопросам: какой юнит реально загружен, в каком контексте запускается процесс и какая зависимость влияет на момент запуска."}, {"id": "C04-0b", "stem": "К чему сводится большинство разборов отказа службы systemd?", "options": ["К загруженному юниту, контексту запуска и зависимостям", "К объёму памяти, выделенной процессу службы", "К порядку букв в имени файла юнита", "К версии systemd и дистрибутива на машине"], "answer": 0, "explanation": "systemd — менеджер графа юнитов и контекстов выполнения: какой юнит загружен, в каком окружении стартует процесс и что влияет на момент запуска."}], [{"id": "C04-1", "stem": "Команда работает вручную из оболочки, но служба падает. Почему это не доказывает, что файл юнита написан верно?", "options": ["Служба всегда запускается позже, чем доступна сеть", "systemd запускает команду дважды и второй запуск конфликтует с первым", "Ручной запуск не проверяет синтаксис файла юнита", "Служба исполняется в другом окружении"], "answer": 3, "explanation": "Обратная ошибка симметрична: active (running) означает, что процесс жив, а не что приложение готово принимать запросы."}, {"id": "C04-1b", "stem": "Служба в состоянии active (running). Что именно это доказывает?", "options": ["Что файл юнита написан без ошибок", "Что процесс запущен и ещё не завершился", "Что все зависимости юнита выполнены верно", "Что приложение готово принимать запросы"], "answer": 1, "explanation": "Готовность приложения — отдельное утверждение, и проверяется оно отдельной пробой, а не состоянием юнита."}]], "5": [[{"id": "C05-0", "stem": "В чём состоит метод диагностики загрузки?", "options": ["Определить последний этап цепочки передач управления, который точно завершился", "Переустановить загрузчик и повторить попытку", "Сравнить время загрузки с предыдущим успешным", "Начать с проверки файловой системы корневого раздела"], "answer": 0, "explanation": "Загрузка — цепочка: прошивка и запись загрузки → загрузчик → ядро → initramfs → монтирование корня → fstab → цель systemd. Рецепт восстановления зависит от того, где она оборвалась."}, {"id": "C05-0b", "stem": "Что нужно установить прежде выбора рецепта восстановления загрузки?", "options": ["Способ разметки диска на этой машине", "Версию ядра, установленную на машине", "Последний этап цепочки, который завершился", "Объём раздела с загрузочными файлами"], "answer": 2, "explanation": "Загрузка — цепочка передач управления: прошивка, загрузчик, ядро, initramfs, корень, fstab, цель systemd. Рецепт зависит от места обрыва."}], [{"id": "C05-1", "stem": "Вы видите меню загрузчика, но система не поднимается. Почему переустановка загрузчика здесь бесполезна?", "options": ["Переустановка возможна только из аварийной среды", "Меню доказывает, что прошивка и загрузчик уже отработали, значит отказ дальше по цепочке", "Меню рисует прошивка, а не загрузчик", "Загрузчик не участвует в монтировании корня"], "answer": 1, "explanation": "Дальше по цепочке отказ чаще вызван отсутствием драйвера контроллера в initramfs, изменившимся идентификатором корня после замены диска или обязательной строкой в fstab без nofail."}, {"id": "C05-1b", "stem": "Ядро загрузилось, но система уходит в аварийный режим. Куда смотреть в первую очередь?", "options": ["На запись загрузки в переменных прошивки", "На целостность самого образа ядра", "На меню и настройки загрузчика", "На монтирование корня и строки fstab"], "answer": 3, "explanation": "Запустившееся ядро снимает подозрение с прошивки и загрузчика. Дальше по цепочке отказ чаще вызван идентификатором корня или обязательной строкой fstab без nofail."}]], "6": [[{"id": "C06-0", "stem": "С чего начинается доставка по IP?", "options": ["С выбора адреса источника для исходящего пакета", "С разрешения имени в адрес", "С определения, находится ли адресат в том же сегменте", "С проверки состояния линии связи"], "answer": 2, "explanation": "Для локального адресата нужен его собственный адрес второго уровня, для удалённого — адрес следующего узла. Маршрут выбирается по наиболее специфичному префиксу."}, {"id": "C06-0b", "stem": "От чего зависит, чей адрес второго уровня нужен машине для отправки пакета?", "options": ["От того, в том же сегменте адресат или за его пределами", "От того, какой протокол работает выше уровнем", "От размера отправляемого пакета данных", "От числа интерфейсов, поднятых на машине"], "answer": 0, "explanation": "Для локального адресата нужен его собственный адрес второго уровня, для удалённого — адрес следующего узла. Маршрут выбирается по наиболее специфичному префиксу."}], [{"id": "C06-1", "stem": "Почему неудачный ping до шлюза не указывает на неисправность шлюза?", "options": ["Шлюз отвечает на эхо-запросы только из своей подсети", "Он означает лишь, что эхо-ответ не вернулся", "Ping проверяет только четвёртый уровень", "Шлюз всегда отвечает с задержкой больше стандартного ожидания"], "answer": 1, "explanation": "Успешный ping до соседа требует одновременно поднятой линии, верного VLAN, разрешения адреса второго уровня, совпадающего префикса и отсутствия фильтрации. Неудача не говорит, какое из условий нарушено."}, {"id": "C06-1b", "stem": "Что должно совпасть одновременно, чтобы ping до соседа прошёл?", "options": ["Только совпадающий префикс сети у обеих машин", "Линия, VLAN, разрешение адреса, префикс и фильтрация", "Только разрешение имени и доступность службы имён", "Только маршрут по умолчанию и работающий шлюз"], "answer": 1, "explanation": "Неудача не говорит, какое из условий нарушено, — и уж точно не указывает на неисправность соседа."}]], "7": [[{"id": "C07-0", "stem": "Почему dig и getent на одно и то же имя могут отвечать по-разному?", "options": ["getent кэширует ответ, а dig — нет", "dig спрашивает DNS напрямую, а приложение идёт по цепочке NSS", "dig работает по TCP, а getent по UDP", "getent обращается только к серверам из DHCP"], "answer": 1, "explanation": "DNS — отдельная подсистема разрешения имён, и путь приложения к имени длиннее, чем один запрос к серверу. Поэтому эти команды отвечают на разные вопросы."}, {"id": "C07-0b", "stem": "На какой вопрос отвечает getent hosts, но не отвечает dig?", "options": ["Какие серверы имён прописаны в настройках", "Какой адрес вернёт сервер имён напрямую", "Какой адрес получит приложение на этой машине", "Сколько времени занял запрос к серверу"], "answer": 2, "explanation": "Приложение идёт к имени по цепочке NSS, а не одним запросом к серверу. Поэтому эти команды отвечают на разные вопросы."}], [{"id": "C07-1", "stem": "Соединение TCP установилось. Что именно это доказывает о пути?", "options": ["Что путь исправен для трафика любого объёма", "Что межсетевой экран на пути отсутствует", "Что начальный обмен небольшими пакетами прошёл; прохождение крупного ответа нужно проверить отдельно", "Что обе стороны согласовали одинаковый размер окна"], "answer": 2, "explanation": "Установленное TCP-соединение подтверждает лишь успешный начальный обмен. Оно не доказывает прохождение больших пакетов, завершение HTTP-ответа или отсутствие фильтрации дальнейшего трафика."}, {"id": "C07-1b", "stem": "В учебном сценарии маршрут и служба исправны, рукопожатие проходит, а крупный ответ зависает. Какую сетевую гипотезу проверить?", "options": ["Межсетевой экран закрывает нужный порт", "Сервис на той стороне не запущен вовсе", "Имя разрешается в неверный адрес сети", "Крупные пакеты не проходят участок пути"], "answer": 3, "explanation": "Симптом согласуется с нарушением PMTU: маленькие пакеты рукопожатия проходят, крупные могут теряться при недоставленном сообщении ICMP. Гипотезу проверяют измерением MTU, а не считают доказанной по одному симптому."}]], "8": [[{"id": "C08-0", "stem": "Чем различаются роли VLAN, моста, маршрутизатора и межсетевого экрана?", "options": ["Мост и маршрутизатор решают одну задачу разными командами", "Межсетевой экран нужен только на границе с внешней сетью", "Пространство имён — это разновидность VLAN внутри одного хоста", "VLAN делит домены второго уровня, маршрутизатор связывает сети IP"], "answer": 3, "explanation": "Чёткое разделение ролей снимает значительную часть путаницы: можно иметь два VLAN, прекрасно маршрутизируемых между собой, и мост вообще без адреса."}, {"id": "C08-0b", "stem": "Может ли мост работать, не имея собственного адреса IP?", "options": ["Да: он работает на втором уровне, адрес ему не нужен", "Нет: адрес нужен ему для выбора нужного VLAN", "Да, но только если на нём не настроен ни один VLAN", "Нет: без адреса он не сможет пересылать кадры"], "answer": 0, "explanation": "VLAN делит домены второго уровня, маршрутизатор связывает сети IP, мост соединяет интерфейсы. Разделение ролей снимает значительную часть путаницы."}], [{"id": "C08-1", "stem": "Между двумя VLAN нет связности. Почему это само по себе не дефект настройки VLAN?", "options": ["Связность появляется только после перезапуска коммутатора", "VLAN по определению разделяет широковещательные домены", "Два VLAN на одном коммутаторе всегда изолированы аппаратно", "Связность между VLAN требует одинакового префикса"], "answer": 1, "explanation": "Отсутствие связи может быть вызвано отсутствующим маршрутом, выключенной пересылкой, политикой экрана или трансляцией адресов — четырьмя разными причинами, ни одна из которых не «неправильный VLAN»."}, {"id": "C08-1b", "stem": "Связи между двумя VLAN нет. Что из перечисленного объяснит это вернее всего?", "options": ["Неверный номер VLAN на портах коммутатора", "Отсутствие маршрута, пересылки, разрешения экрана", "Совпадение адресов у машин в разных VLAN", "Нехватка пропускной способности линии связи"], "answer": 1, "explanation": "VLAN по определению разделяет широковещательные домены. Отсутствие связи между ними — ожидаемое поведение, а не дефект настройки."}]], "9": [[{"id": "C09-0", "stem": "Почему ёмкость и количество компонентов не описывают сервер полностью?", "options": ["Потому что производители указывают ёмкость с запасом", "Потому что часть памяти всегда резервирует прошивка", "Потому что процессор, память и ввод-вывод образуют топологию", "Потому что ядро видит не все установленные модули"], "answer": 2, "explanation": "Сначала определяется физическая принадлежность ресурсов, затем сравниваются инвентарь прошивки, контроллера управления и операционной системы."}, {"id": "C09-0b", "stem": "Что сравнивают между собой, прежде чем делать вывод о железе сервера?", "options": ["Паспортные и измеренные величины пропускной способности", "Цену компонентов и их рыночные аналоги", "Инвентарь прошивки, контроллера управления и системы", "Показания датчиков температуры за последний месяц"], "answer": 2, "explanation": "Сначала определяется физическая принадлежность ресурсов, и только потом три независимых инвентаря сравниваются между собой."}], [{"id": "C09-1", "stem": "В системе видно меньше памяти, чем физически установлено. Почему из этого не следует неисправность модуля?", "options": ["Объём всегда округляется вниз до степени двойки", "Это зеркалирование, отключённый канал, дыра в адресах или предел прошивки", "Часть памяти занята страничным кэшем и потому не показывается", "Ядро резервирует под свои структуры фиксированную долю"], "answer": 1, "explanation": "Сначала сравнивают, что физически установлено, что видит прошивка и что видит ядро, и только потом делают вывод о модуле."}, {"id": "C09-1b", "stem": "Ядро видит меньше памяти, чем стоит в сервере. Какой шаг первый?", "options": ["Перезагрузить машину и посмотреть снова", "Обновить прошивку до последней доступной версии", "Заменить модуль, который кажется подозрительным", "Сравнить установленное, видимое прошивке и видимое ядру"], "answer": 3, "explanation": "Зеркалирование, отключённый канал, дыра в адресах и предел прошивки выглядят одинаково. Вывод о модуле делается последним."}]], "10": [[{"id": "C10-0", "stem": "В каком порядке глава предлагает диагностировать устройство PCIe?", "options": ["Драйвер → прошивка → линия → ресурсы", "Ресурсы → линия → драйвер → перечисление", "Линия и перечисление → выделение ресурсов → привязка драйвера", "Перечисление → инициализация → линия → драйвер"], "answer": 2, "explanation": "Такая последовательность предотвращает типичную ошибку — лечить драйвер там, где карта физически не подняла линию."}, {"id": "C10-0b", "stem": "Почему разбор устройства PCIe начинают не с драйвера?", "options": ["Драйверу нечего привязывать, если линия не поднята", "Драйверы редко бывают причиной отказа устройства", "Драйвер загружается позже всех прочих модулей", "Имя драйвера не всегда известно заранее"], "answer": 0, "explanation": "Порядок «линия и перечисление, затем ресурсы, затем привязка драйвера» предотвращает лечение драйвера там, где карта физически не поднялась."}], [{"id": "C10-1", "stem": "Карта видна в выводе lspci. Что именно доказано?", "options": ["Что для устройства загружен и привязан подходящий драйвер ядра", "Что устройство ответило на обращение к конфигурационному пространству", "Что линия согласована на ожидаемой ширине и поколении", "Что устройству выделены адресные окна"], "answer": 1, "explanation": "«Видно, но не работает» — это несколько разных состояний: нет драйвера, не выделены ресурсы, линия согласована уже, устройство в неподходящей группе изоляции. Они различаются разными командами."}, {"id": "C10-1b", "stem": "Устройство видно в lspci и не работает. Сколько это разных состояний?", "options": ["Два: нет драйвера или нет питания", "Несколько, и различаются они разными командами", "Ни одного: видимое устройство всегда работает", "Одно: устройство неисправно физически"], "answer": 1, "explanation": "Нет драйвера, не выделены ресурсы, линия согласована уже ожидаемого, устройство в неподходящей группе изоляции — состояния разные."}]], "11": [[{"id": "C11-0", "stem": "Зачем контроллер управления рассматривается как отдельный источник данных?", "options": ["Он точнее операционной системы измеряет температуру", "Он хранит журнал дольше, чем операционная система", "Он позволяет перезагрузить сервер без операционной системы", "Это независимая точка наблюдения"], "answer": 3, "explanation": "Неожиданная перезагрузка разбирается по трём независимым линиям времени, а не по одной, и сначала их приводят к общей шкале."}, {"id": "C11-0b", "stem": "Почему по трём линиям времени разбирают перезагрузку, а не по одной?", "options": ["Две линии времени невозможно привести к общей шкале", "Одна линия времени всегда содержит ошибки записи", "Источники независимы и видят разные части события", "Так требует формальный порядок разбора инцидента"], "answer": 2, "explanation": "Контроллер управления — независимая точка наблюдения. Линии сначала приводят к общей шкале, а потом сопоставляют."}], [{"id": "C11-1", "stem": "В журнале операционной системы перед перезагрузкой пусто. Почему это не доказывает панику ядра?", "options": ["Отсутствие записей — это отсутствие доказательства", "Паника всегда записывается в журнал, значит причина точно другая", "Журнал очищается при каждой перезагрузке", "Паника ядра пишется только в файл на диске"], "answer": 0, "explanation": "Журнал обрывается одинаково и при панике, и при мгновенной потере питания. Различить их можно, только сопоставив события контроллера управления, датчиков и ядра по времени."}, {"id": "C11-1b", "stem": "Чем внезапная потеря питания выглядит в журнале так же, как паника ядра?", "options": ["Обе фиксируются датчиками контроллера управления", "Обе оставляют одинаковую запись об отключении", "Обе пишут дамп памяти в одно и то же место", "Обе обрывают журнал на последней записи"], "answer": 3, "explanation": "Отсутствие записей — это отсутствие доказательства. Различить случаи можно только сопоставив события контроллера, датчиков ков. Что означает состояние degraded?", "options": ["Данные повреждены и требуют восстановления из копии", "Массив продолжает работу с пониженной скоростью, избыточность сохранена", "Массив собран из дисков разного объёма", "Массив доступен по оставшемуся участнику, но больше не выдержит его отказа"], "answer": 3, "explanation": "У зеркала RAID1 с двумя участниками после отказа одного остаётся одна доступная копия. Состояние degraded указывает на потерю запаса; целостность данных и восстановление проверяют отдельно."}, {"id": "C13-0b", "stem": "Массив mdraid показывает degraded. Что нужно сделать в первую очередь?", "options": ["Остановить работу: данные уже недоступны", "Ничего: состояние нормальное для работы", "Восстановить избыточность, не откладывая", "Пересоздать массив из уцелевших дисков"], "answer": 2, "explanation": "Degraded означает потерю части участников. Массив может оставаться доступным, но запас отказоустойчивости уменьшен; сколько отказов ещё допустимо, зависит от уровня RAID и расположения отказов. Избыточность восстанавливают без промедления и проверяют данные."}], [{"id": "C13-1", "stem": "Логический том расширен, а свободного места в файловой системе не прибавилось. Почему?", "options": ["Расширение вступает в силу только после перезагрузки", "Слои независимы: расширение тома увеличило блочное устройство", "Место занято журналом файловой системы", "Группа томов не имела свободных экстентов"], "answer": 1, "explanation": "Обратный случай с тем же корнем: df показывает свободное место, а запись не идёт — это обычно исчерпание inode либо удалённый, но всё ещё открытый файл."}, {"id": "C13-1b", "stem": "df -h показывает свободные блоки, а df -i — 100% занятых inode. Почему не создаётся новый файл?", "options": ["Переполнение кеша контроллера хранения", "Нехватка прав у пользователя на каталог", "Расхождение размеров тома и файловой системы", "Исчерпаны inode: новых файлов не создать, хотя блоки ещё свободны"], "answer": 3, "explanation": "Файловой
