бует, чтобы вся инициализация была одной фазой"], "answer": 1, "explanation": "В распространённой модели PI фаза PEI подготавливает постоянную память и передаёт найденные сведения фазе DXE через HOB. UEFI как интерфейс не предписывает всем прошивкам именно такую внутреннюю реализацию.", "reason": {"options": ["HOB создаёт только драйвер операционной системы", "PI описывает внутренние фазы; HOB служит передачей сведений между ними", "PEI и DXE — два названия одной и той же фазы"], "answer": 1}}, {"id": "R27", "module": 27, "kind": "calculation", "stem": "EFI-приложение размером 1 966 080 B помещено в firmware volume объёмом 2 MiB и запускается в OVMF. Сколько KiB остаётся свободно в этой области и какова заполненность в процентах? Составьте три уровня вывода — сборка, виртуальный запуск и реальное оборудование — и укажите факты для каждого.", "explanation": "2·2²⁰−1 966 080=131 072 B=128 KiB свободно, заполнено 1 966 080/2 097 152=93,75%. Запас в 128 KiB съедается первым же обновлением с новой зависимостью, поэтому заполненность области — такой же контролируемый показатель, как и успех сборки. Уровни вывода: сборка — точные исходники, набор инструментов сборки, журнал и хеш; виртуальный запуск — манифест OVMF/QEMU, команда запуска и ожидаемый вывод; оборудование — совместимая платформа с путём восстановления и матрица тестов, привязанная к SHA. Первые два не подменяют третий: OVMF не воспроизводит ни таймингов реального PEI, ни поведения при потере питания.", "fields": [{"label": "Свободно в region, KiB", "answer": 128}, {"label": "Заполненность, %", "answer": 93.75}]}, {"id": "M28-0", "module": 28, "kind": "concept", "stem": "Что фаза PEI передаёт фазе DXE?", "options": ["Драйверы файловых систем, нужные для монтирования корневого тома", "Найденные ресурсы и состояние платформы блоками передачи, включая карту памяти", "Таблицу маршрутизации сетевого стека операционной системы", "Готовый список загрузочных записей операционной системы и их порядок"], "answer": 1, "explanation": "Ранняя фаза доводит платформу до состояния с инициализированной памятью и передаёт найденное дальше. Выбор загрузочной записи и работа драйверов относятся к более поздним фазам.", "reason": {"options": ["Ранняя фаза доводит платформу до состояния с работающей памятью", "Драйверы устройств работают уже на ранней фазе, иначе память не была бы инициализирована", "Ранняя фаза передаёт готовый список загрузочных записей, поскольку уже прочитала настройки"], "answer": 0}}, {"id": "M28-1", "module": 28, "kind": "concept", "stem": "Устройство перечислено в конфигурационном пространстве, но драйвер сообщает о недоступных ресурсах. Какой слой становится главным?", "options": ["Политика резервного копирования виртуальной машины и расписание её заданий", "Целостность корневой файловой системы и её журнала после загрузки", "Выделение ресурсов платформой: адресные окна, разделение линий слота, ПЗУ расширения", "Разрешение имён на узле и доступность серверов имён платформы"], "answer": 2, "explanation": "Перечисление и выделение ресурсов — разные шаги. Видимость оконечного устройства доказана, поэтому проверяются окна MMIO, настройки слота и порядок выполнения ПЗУ расширения.", "reason": {"options": ["Видимость устройства в конфигурационном пространстве и выделение ему окон", "Недоступность ресурсов означает физическую неисправность устройства", "Раз устройство перечислено, ресурсы ему уже выделены"], "answer": 0}}, {"id": "M28-2", "module": 28, "kind": "concept", "stem": "Почему код ранней фазы прошивки не может просто использовать обычную оперативную память для всех структур?", "options": ["Оперативная память ещё не инициализирована; сначала нужна ограниченная временная среда", "DXE запрещает хранить данные в памяти", "PCIe выделяет всю оперативную память до запуска прошивки", "Операционная система уже владеет этой памятью"], "answer": 0, "explanation": "Самый ранний код выполняется до инициализации DRAM, используя регистры и кэш как временное хранилище. Его задача — подготовить память и передать данные следующей фазе.", "reason": {"options": ["Ранний код всегда исполняется после загрузки ядра", "Любая фаза прошивки обязана хранить всё в NVRAM", "Временное хранилище и контракт передачи нужны из-за ещё недоступной DRAM"], "answer": 2}}, {"id": "R28", "module": 28, "kind": "calculation", "stem": "Окно под 64-битные BAR составляет 64 GiB. Три устройства запрашивают 8, 16 и 16 GiB. Сколько останется свободно и сколько ещё устройств по 16 GiB поместится?", "explanation": "8+16+16=40 GiB, свободно 64−40=24 GiB, помещается floor(24/16)=1 устройство. Расчёт не учитывает выравнивание окон по степени двойки и резервы платформы, которые уменьшают практический результат.", "fields": [{"label": "Свободно, GiB", "answer": 24}, {"label": "Ещё устройств по 16 GiB", "answer": 1}]}, {"id": "M29-0", "module": 29, "kind": "concept", "stem": "Значение в Setup переживает перезагрузку. Что ещё нужно, чтобы считать функцию рабочей?", "options": ["Никаких дополнительных проверок, кроме успешной загрузки узла", "Снимок экрана со значением Enabled и запись о нём в журнале обслуживания", "Подтверждённый потребитель настройки и ожидаемый эффект в соответствующем сценарии", "Одинаковое имя файла прошивки и совпадение его размера на узлах"], "answer": 2, "explanation": "Сохранность значения и аппаратный эффект проверяются раздельно.", "reason": {"options": ["Значение, пережившее перезагрузку, доказывает, что настройка применена оборудованием", "Значение, уцелевшее в энергонезависимой памяти", "Отображения значения в интерфейсе достаточно, поскольку интерфейс читает его из оборудования"], "answer": 1}}, {"id": "M29-1", "module": 29, "kind": "concept", "stem": "Канареечный узел после обновления прошивки теряет HBA. Как поступить?", "options": ["Продолжить развёртывание на всех узлах, поскольку операционная система загрузилась", "Объявить успех по номеру версии прошивки на всех обновлённых узлах", "Стереть базовые данные узла, чтобы они не мешали повторной установке", "Остановить развёртывание, сохранить факты и проверить совместимость и путь восстановления"], "answer": 3, "explanation": "Успешная загрузка не компенсирует потерю устройства и невыполнение требований эксплуатации.", "reason": {"options": ["Загрузившаяся система означает удачное обновление", "Успешная загрузка проверяет лишь часть требований", "Номер версии подтверждает результат обновления"], "answer": 1}}, {"id": "M29-2", "module": 29, "kind": "concept", "stem": "В таблицах ACPI устройство объявлено, но ОС его не использует. Какой вывод обоснован?", "options": ["Таблица ACPI автоматически привязала драйвер и выделила ресурсы", "Объявление устройства ещё не доказывает доступность ресурсов и привязку драйвера", "Отсутствие драйвера всегда означает повреждение таблицы", "Обновление BIOS гарантированно исправит устройство"], "answer": 1, "explanation": "ACPI описывает ресурсы и методы для ОС, но ОС отдельно перечисляет устройство, выделяет ресурсы и привязывает драйвер. Проверять нужно каждый этап.", "reason": {"options": ["Описание и фактическое использование ресурса — разные состояния", "Таблица ACPI выполняет работу драйвера устройства", "ОС игнорирует все аппаратные описания прошивки"], "answer": 0}}, {"id": "R29", "module": 29, "kind": "calculation", "stem": "После обновления BIOS значение в Setup сохранилось, но канал PCIe стал x4 вместо x16 (Gen3, 8 GT/s на линию, кодирование 128b/130b). Найдите теоретическую полосу x4 в десятичных GB/s и во сколько раз она ниже прежней. Какие данные связывают регрессию с образом и настройкой и каков критерий остановки кампании?", "explanation": "На линию 8·10⁹·(128/130)/8=0,98462·10⁹ B/s; x4 даёт 3,938 GB/s против 15,754 GB/s у x16 — ровно вчетверо меньше, и это потолок, а не измеренная скорость. Регрессию связывают с образом и настройкой через хеш образа до и после, топологию «платформа — райзер — слот», экспорт настроек, пару LnkCap/LnkSta и профиль нагрузки. Критерий остановки: остановить развёртывание при непредусмотренном снижении параметров канала, потере устройства или невыполнении критериев — сохранив факты по канареечной партии, а не откатив её молча.", "fields": [{"label": "Полоса x4, десятичные GB/s", "answer": 3.9384615385}, {"label": "Отношение x16/x4", "answer": 4}]}, {"id": "M30-0", "module": 30, "kind": "concept", "stem": "Диск сервера зашифрован LUKS. Сервер работает, злоумышленник получил учётную запись с sudo. Что защищает шифрование в этот момент?", "options": ["Все файлы на томе, потому что раздел помечен как зашифрованный при установке", "Только файлы других пользователей, чьи ключи не загружены в память", "Ничего: том уже разблокирован, и ключ лежит в памяти ядра", "Данные, записанные до первой перезагрузки узла после включения шифрования"], "answer": 2, "explanation": "Шифрование покоящихся данных снимает угрозу изъятия носителя, а не компрометации работающей системы.", "reason": {"options": ["Шифрование действует на уровне отдельных файлов", "Шифрование покоящихся данных снимает угрозу доступа к носителю", "Ключ хранится в оборудовании, поэтому чтение данных требует его повторного подтверждения"], "answer": 1}}, {"id": "M30-1", "module": 30, "kind": "concept", "stem": "Секрет службы лежит в переменной окружения systemd-юнита. Какое утверждение верно?", "options": ["Значение видно в /proc/PID/environ и попадает в дампы и отчёты об ошибках", "Значение шифруется systemd автоматически", "Переменные окружения недоступны другим процессам, это безопасный способ", "Секрет исчезает после запуска процесса"], "answer": 0, "explanation": "Окружение процесса читается вместе с его состоянием и легко утекает в диагностические артефакты.", "reason": {"options": ["Значение существует лишь до запуска процесса", "Окружение доступно только самому процессу", "Окружение процесса читается вместе с его состоянием"], "answer": 2}}, {"id": "M30-2", "module": 30, "kind": "concept", "stem": "Клиент доверяет сертификату сервера, но соединение отклонено с ошибкой имени. Что произошло?", "options": ["Сертификат просрочен, и клиент сообщает об этом неточно", "Цепочка проверена, но имя, к которому обратился клиент, не указано в сертификате", "Клиент не получил промежуточный сертификат", "На сервере включён устаревший протокол шифрования"], "answer": 1, "explanation": "Проверка состоит из двух независимых частей: цепочка доверия и соответствие имени. Сертификат может быть выпущен доверенным центром и при этом не покрывать использованное имя — тогда отказ приходит именно по имени, а не по доверию.", "reason": {"options": ["Отсутствие промежуточного сертификата даёт ошибку имени", "Доверие к издателю и пригодность для имени проверяются отдельно", "Ошибки срока действия сообщаются как ошибки имени"], "answer": 1}}, {"id": "R30", "module": 30, "kind": "calculation", "stem": "Пароль составлен из 5 слов случайного словаря на 8192 слова. Найдите энтропию в битах и время полного перебора при 10¹⁰ проверок в секунду (в годах, год = 3,156·10⁷ с). Что изменится, если словарь известен нападающему?", "explanation": "log₂(8192)=13 бит на слово, 5·13=65 бит. Пространство 2⁶⁵≈3,689·10¹⁹; при 10¹⁰ проверок/с полный перебор занимает 3,689·10⁹ с ≈ 116,9 года, средний — вдвое меньше. Известность словаря ничего не меняет: энтропия считается в предположении, что схема известна, секретен только выбор. Уменьшить её может лишь неслучайный выбор слов человеком.", "fields": [{"label": "Энтропия, бит", "answer": 65}, {"label": "Полный перебор, лет", "answer": 116.9}]}, {"id": "M31-0", "module": 31, "kind": "concept", "stem": "В журнале узла A запись об ошибке имеет метку 12:00:03, на узле B ответ на неё — 12:00:01. Что проверить в первую очередь?", "options": ["Считать, что ответ действительно пришёл раньше запроса, и искать причину в приложении", "Переписать метки времени вручную до совпадения порядка событий", "Расхождение часов: сравнить смещения обоих узлов относительно общего источника на момент событий", "Отключить журналирование на узле B и собрать хронологию по одному узлу"], "answer": 2, "explanation": "Пока не доказана синхронность часов, порядок записей из разных узлов не является порядком событий.", "reason": {"options": ["Обратный порядок в журналах означает ошибку приложения, поскольку часы синхронизируются автоматически", "Порядок записей из разных источников — это порядок их часов", "Метки времени приводятся к единой шкале при записи"], "answer": 1}}, {"id": "M31-1", "module": 31, "kind": "concept", "stem": "Для измерения длительности операции внутри программы какие часы корректны?", "options": ["Часы файловой системы", "Любые, разница всё равно одинаковая", "Часы календарного времени, потому что их значение понятно человеку", "Монотонные: они не прыгают при коррекции времени и не идут назад"], "answer": 3, "explanation": "Календарные часы корректируются и могут скакнуть, дав отрицательную или завышенную длительность.", "reason": {"options": ["Календарные часы предпочтительнее, так как позволяют сопоставить результат с журналом", "Разность двух календарных отсчётов от коррекций не зависит, поскольку они применяются к обоим", "Длительность измеряют часами, которые не корректируются"], "answer": 2}}, {"id": "M31-2", "module": 31, "kind": "concept", "stem": "Два события произошли ближе друг к другу, чем суммарная погрешность часов узлов. Что поможет установить причинный порядок?", "options": ["Сравнить только округлённые метки UTC", "Передавать логические отметки вместе с сообщениями", "Увеличить число знаков после запятой в журнале", "Считать часы одного узла эталоном без измерения погрешности"], "answer": 1, "explanation": "Физические метки в пределах погрешности не задают достоверный порядок. Логические часы передают причинную связь через сообщения.", "reason": {"options": ["Физическая точность всегда достаточна при синхронизации NTP", "Чем длиннее запись времени, тем меньше погрешность источника", "Счётчик в сообщениях фиксирует причинный порядок."], "answer": 2}}, {"id": "R31", "module": 31, "kind": "calculation", "stem": "Часы узла уходят на 45 ppm. Синхронизация выполняется раз в 6 часов. Найдите максимальное накопленное расхождение к моменту следующей сверки в миллисекундах и требуемый интервал сверки в минутах, чтобы удержать расхождение в пределах 50 мс.", "explanation": "45 ppm = 45·10⁻⁶ с на секунду. За 6 ч = 21 600 с накапливается 21 600·45·10⁻⁶ = 0,972 с = 972 мс. Для порога 50 мс: 0,05/45·10⁻⁶ = 1111,1 с ≈ 18,5 мин. Это оценка сверху при постоянном дрейфе; реальный дрейф зависит от температуры, поэтому запас берут кратный.", "fields": [{"label": "Расхождение за 6 ч, мс", "answer": 972}, {"label": "Интервал сверки, мин", "answer": 18.5}]}, {"id": "M32-0", "module": 32, "kind": "concept", "stem": "База сообщила «транзакция зафиксирована», сервер потерял питание, после включения этой записи нет. Где искать причину?", "options": ["В версии клиентской библиотеки, которой приложение обращается к базе данных, и в её настройках повторов", "В количестве оперативной памяти узла и настройках её распределения между базой данных и страничным кэшем", "В цепочке подтверждения записи между приложением и носителем", "В планировщике задач операционной системы и в приоритетах, с которыми он запускает фоновые записи на диск"], "answer": 2, "explanation": "Долговечность держится на честном подтверждении записи на всём пути от базы до энергонезависимого носителя.", "reason": {"options": ["Потеря записи объясняется нехваткой памяти под буферы на момент отказа", "Подтверждение фиксации выдаётся только после ответа носителя", "Долговечность держится на честности подтверждения на всём пути"], "answer": 2}}, {"id": "M32-1", "module": 32, "kind": "concept", "stem": "Резервное копирование выполняется каждую ночь, восстановление ни разу не проверялось. Что известно про RPO и RTO?", "options": ["RTO равен длительности задания копирования, а RPO — интервалу между двумя соседними заданиями", "Оба соблюдены, раз задание резервного копирования завершается успешно каждую ночь по расписанию", "Ни то, ни другое: непроверенная копия не даёт ни того, ни другого", "RPO равен суткам, RTO неизвестен, и обе величины подтверждены журналом заданий"], "answer": 2, "explanation": "Успешное завершение задания доказывает запись файлов, а не пригодность данных к восстановлению.", "reason": {"options": ["Успешное создание копии доказывает запись файлов", "Время возврата определяется объёмом копии и известно из её размера", "Расписание копирования задаёт точку восстановления"], "answer": 0}}, {"id": "M32-2", "module": 32, "kind": "concept", "stem": "База подтвердила транзакцию после записи журнала, но контроллер держал блоки только в незащищённом кэше. Что под угрозой?", "options": ["Только порядок отображения строк в запросе", "Долговечность подтверждённой транзакции при потере питания", "Только скорость чтения старых страниц", "Изолированность всех будущих транзакций"], "answer": 1, "explanation": "Подтверждение должно опираться на устойчивую запись журнала. Если нижний слой лжёт о завершении записи и держит данные в незащищённой памяти, питание может уничтожить уже подтверждённую транзакцию.", "reason": {"options": ["Кэш всегда является устойчивым носителем", "Долговечность зависит от фактической устойчивости записи на нижнем слое", "Журнал нужен только для сортировки записей"], "answer": 1}}, {"id": "R32", "module": 32, "kind": "calculation", "stem": "Полная копия делается раз в сутки в 01:00, журнал транзакций отгружается каждые 15 минут. Отказ произошёл в 12:07, последняя успешная отгрузка журнала — в 12:00. Найдите фактический RPO в минутах и максимальный RPO схемы. Что нужно доказать, чтобы называть эти числа гарантией?", "explanation": "Фактический RPO = 12:07 − 12:00 = 7 мин. Максимальный RPO схемы равен интервалу отгрузки, 15 мин, — отказ мог случиться прямо перед следующей отгрузкой. Гарантией числа станут только после проверки: журналы читаются, восстановление до точки во времени выполняется, а хранилище копий не разделяет с базой одну область отказа.", "fields": [{"label": "Фактический RPO, мин", "answer": 7}, {"label": "Максимальный RPO, мин", "answer": 15}]}, {"id": "M33-0", "module": 33, "kind": "concept", "stem": "Два блока питания сервера подключены к одному распределительному щиту. Как это влияет на расчёт доступности?", "options": ["Влияет только на потребление энергии", "Не влияет, блоков всё равно два", "Резервирование не независимо: щит остаётся общей точкой отказа", "Доступность возводится в квадрат, как для независимых элементов"], "answer": 2, "explanation": "Формулы независимых отказов применимы, только когда у элементов нет общего домена отказа.", "reason": {"options": ["Перемножать вероятности можно только для элементов без общих зависимостей", "Общий ввод влияет на потребление", "Наличия двух элементов достаточно для расчёта по формуле независимого резервирования"], "answer": 0}}, {"id": "M33-1", "module": 33, "kind": "concept", "stem": "Один из двух узлов кластера вышел из строя, сервис доступен. Почему это состояние срочное?", "options": ["Нужно дождаться планового окна работ в любом случае", "Запас исчерпан: следующий отказ того же класса приводит к полной недоступности", "Оно не срочное, пока пользователи не жалуются", "Срочность зависит только от времени суток и наличия дежурного на смене"], "answer": 1, "explanation": "Деградация — это не работающее состояние, а исчерпанный запас: длительность её и определяет вероятность аварии.", "reason": {"options": ["Срочность определяется числом затронутых пользователей", "Работа без резерва — не то же, что работа в норме", "Пока сервис доступен, риск не изменился"], "answer": 1}}, {"id": "M33-2", "module": 33, "kind": "concept", "stem": "Сервис из четырёх последовательных компонентов по 99,9% каждый. Что известно о его доступности?", "options": ["Она равна 99,9%: слабое звено определяет результат", "Она ниже 99,9%: отказы последовательных компонентов складываются", "Она выше 99,9%: часть отказов совпадает по времени", "Она не определена, пока не измерена на практике"], "answer": 1, "explanation": "Для последовательной цепочки независимых обязательных компонентов доступности перемножаются: четыре по 99,9% дают 0,999⁴≈99,6006%, то есть примерно вчетверо больше долю простоя, чем один компонент. Общие причины отказа требуют отдельной модели.", "reason": {"options": ["Расчётная оценка не имеет смысла без измерений", "Совпадение отказов улучшает суммарную доступность", "Отказ любого элемента последовательной цепочки — отказ всей цепочки"], "answer": 2}}, {"id": "R33", "module": 33, "kind": "calculation", "stem": "Сервис состоит из трёх последовательно необходимых компонентов с доступностью 99,9 %, 99,95 % и 99,99 %. Найдите доступность сервиса в процентах и допустимую недоступность в минутах за 30 суток.", "explanation": "Последовательное соединение перемножает доступности: 0,999·0,9995·0,9999 = 0,9984005…, то есть 99,84 %. За 30 суток = 43 200 мин недоступность равна 43 200·(1 − 0,9984005) = 69,1 мин. Слабейшее звено определяет порядок величины: улучшать сначала компонент с 99,9 %.", "fields": [{"label": "Доступность сервиса, %", "answer": 99.84}, {"label": "Недоступность за 30 суток, мин", "answer": 69.1}]}, {"id": "M34-0", "module": 34, "kind": "concept", "stem": "Во время инцидента два инженера одновременно меняют настройки на одном узле. Чем это опасно помимо конфликта правок?", "options": ["Только повышенной нагрузкой на узел, которая сама спадёт после окончания работ", "Опасно лишь при работе в выходные, когда рядом нет второго дежурного инженера", "Теряется причинность: изменение поведения не связать с действием", "Ничем, если оба участника хорошо знают систему и согласовали действия между собой"], "answer": 2, "explanation": "Расследование опирается на связь «одно действие — одно наблюдение»; параллельные правки её разрушают.", "reason": {"options": ["Вывод о причине опирается на связь одного действия с одним наблюдением", "Одновременная работа ускоряет восстановление", "Опасность ограничивается конфликтом правок и решается согласованием порядка"], "answer": 0}}, {"id": "M34-1", "module": 34, "kind": "concept", "stem": "Разбор инцидента завершился выводом «инженер ошибся при вводе команды». Почему такой разбор неполон?", "options": ["Он неполон только без указания времени ошибки", "Не хватает лишь подписи руководителя", "Он полон, причина названа однозначно", "Он останавливается на исполнителе вместо условий"], "answer": 3, "explanation": "Разбор ищет свойства системы, которые сделали ошибку возможной и разрушительной, а не виновного.", "reason": {"options": ["Разбор ищет свойства системы, сделавшие ошибку возможной и необратимой", "Названная причина конкретна и проверяема", "Разбор неполон только из-за отсутствия точного времени и последовательности действий"], "answer": 0}}, {"id": "M34-2", "module": 34, "kind": "concept", "stem": "В разборе инцидента записано: «причина — ошибка администратора». Что не так с таким выводом?", "options": ["Он называет виновного вместо условий, которые сделали ошибку возможной и незаметной", "Он не указывает время и точную последовательность действий", "Он не содержит оценки ущерба", "Он должен быть согласован с самим администратором до публикации"], "answer": 0, "explanation": "Разбор нужен, чтобы уменьшить вероятность повторения, а человек повторяем ровно настолько, насколько повторяема система вокруг него. Полезные вопросы: почему опасное действие было доступно без подтверждения, почему ошибка не была видна сразу, что вернуло бы систему за минуту.", "reason": {"options": ["Разбор должен согласовываться со всеми участниками", "Вывод, не ведущий к изменению системы, не меняет вероятность повторения", "Без оценки ущерба разбор нельзя считать завершённым"], "answer": 1}}, {"id": "R34", "module": 34, "kind": "calculation", "stem": "Отказ начался в 03:12, оповещение сработало в 03:41, дежурный приступил в 03:47, сервис восстановлен в 04:20. Найдите время обнаружения и полное время недоступности в минутах. Какая часть сокращается дешевле всего?", "explanation": "Время обнаружения = 03:41 − 03:12 = 29 мин. Полная недоступность = 04:20 − 03:12 = 68 мин, из них 29 мин обнаружение, 6 мин реакция, 33 мин восстановление. Дешевле всего сокращается обнаружение: оно решается порогами и проверками пользовательского пути, а не переделкой архитектуры.", "fields": [{"label": "Время обнаружения, мин", "answer": 29}, {"label": "Полная недоступность, мин", "answer": 68}]}, {"id": "M35-0", "module": 35, "kind": "concept", "stem": "Миграция схемы базы удаляет колонку одновременно с выкладкой нового кода. Что здесь нарушено?", "options": ["Ничего, если миграция и код выкладываются одной командой", "Обратимость: откат кода вернёт запросы к уже удалённой колонке", "Только порядок перезапуска служб", "Нарушено лишь оформление скрипта миграции"], "answer": 1, "explanation": "Совместимая последовательность разделяет добавление, переключение и удаление, чтобы откат оставался возможен на каждом шаге.", "reason": {"options": ["Нарушен только порядок перезапуска служб", "Одновременность применения гарантирует согласованность", "Вернуться можно, только если предыдущая версия остаётся работоспособной"], "answer": 2}}, {"id": "M35-1", "module": 35, "kind": "concept", "stem": "Служба помечена как неиспользуемая и её собираются выключить. Какое доказательство подходит лучше всего?", "options": ["Тот факт, что документация на службу не найдена ни в одном из известных мест", "Мнение, что о ней никто не спрашивал за последние несколько кварталов работы сервиса", "Отсутствие обращений за период, покрывающий редкие сценарии", "Отсутствие записей в журнале обращений за последний час наблюдения за службой в рабочее время"], "answer": 2, "explanation": "Вывод из эксплуатации доказывают наблюдением за представительный период и обратимым шагом перед необратимым.", "reason": {"options": ["Отсутствие документации указывает на то, что служба не используется", "Отсутствия записей за короткий период достаточно, поскольку активная служба оставляет следы постоянно", "Неиспользуемость доказывают наблюдением достаточной длины, чтобы в него попали и нечастые случаи"], "answer": 2}}, {"id": "M35-2", "module": 35, "kind": "concept", "stem": "Изменение объявлено обратимым, потому что «есть снимок». Когда это утверждение перестаёт быть верным?", "options": ["Когда снимок старше суток", "Когда после изменения появились новые данные, которые откат уничтожит", "Когда снимок хранится на том же узле", "Когда изменение затронуло больше одного сервиса"], "answer": 1, "explanation": "Обратимость измеряется не наличием снимка, а тем, что теряется при возврате. Как только система приняла данные после изменения, откат перестаёт быть нейтральным действием и сам становится потерей — это и есть точка невозврата, которую называют до начала работ.", "reason": {"options": ["Откат безопасен, пока снимок физически доступен", "Возврат к прежнему состоянию отменяет и всё, что произошло после него", "Обратимость зависит от числа затронутых сервисов"], "answer": 1}}, {"id": "R35", "module": 35, "kind": "calculation", "stem": "Выкладка идёт долями: 1 %, затем 10 %, затем 100 % трафика. Дефект даёт ошибку у 4 % запросов затронутой доли. Всего 500 000 запросов в час. Найдите число ошибочных запросов за час на доле 1 % и на доле 10 %. Во сколько раз ранняя остановка дешевле?", "explanation": "На доле 1 %: 500 000·0,01·0,04 = 200 запросов в час. На доле 10 %: 500 000·0,10·0,04 = 2000 запросов в час. Разница ровно в 10 раз — она и есть цена одного пропущенного порога остановки; на 100 % было бы 20 000. Смысл долей в том, что критерий остановки задан заранее и проверяется до расширения.", "fields": [{"label": "Ошибок на 1 %, запросов/ч", "answer": 200}, {"label": "Ошибок на 10 %, запросов/ч", "answer": 2000}]}, {"id": "M36-0", "module": 36, "kind": "concept", "stem": "Резервная копия на другом хосте доступна для удаления тому же root в production. Какой риск остаётся?", "options": ["Отсутствует только чётность RAID", "Общий домен компрометации учётных данных", "Резервная копия автоматически неизменяемая", "Полная независимость от любых действий root уже обеспечена"], "answer": 1, "explanation": "Физическое разделение и разделение полномочий — разные свойства.", "reason": {"options": ["Копия защищена от удаления, поскольку создаётся автоматически", "Разнесение по узлам разделяет отказ оборудования, но не отказ доверия", "Размещение копии на другом узле обеспечивает независимость от любых действий в исходной системе"], "answer": 1}}, {"id": "M36-1", "module": 36, "kind": "concept", "stem": "Как оценить исправление после инцидента с несколькими неисправностями?", "options": ["Остановиться после первого успешного ping до восстановленного узла", "Проверить пользовательский путь, данные, резервирование и смежные слои", "Считать любой успешный перезапуск службы доказательством найденной первопричины", "Проверить только один изменённый файл настроек и закрыть инцидент"], "answer": 1, "explanation": "Восстановление одного симптома не доказывает устранение остальных неисправностей.", "reason": {"options": ["Восстановление одного симптома не доказывает устранения остальных", "Достаточно проверить изменённое, поскольку остального не касались", "Работающий пользовательский путь подтверждает устранение всех неисправностей, поскольку проходит через все слои"], "answer": 0}}, {"id": "M36-2", "module": 36, "kind": "concept", "stem": "Один симптом — «сайт медленный» — и три подозреваемых слоя. Что делает поиск причины конечным?", "options": ["Проверка всех трёх слоёв параллельно разными людьми", "Каждый шаг должен отсекать часть гипотез независимо от исхода", "Начинать всегда с самого нижнего слоя", "Сначала исключить самый частый случай по опыту"], "answer": 1, "explanation": "Диагностика конечна, когда каждая проверка делит пространство гипотез, а не подтверждает одну. Измерение, дающее один и тот же результат при разных причинах, не продвигает поиск — сколько бы людей его ни выполняло и с какого бы слоя оно ни начиналось.", "reason": {"opti
