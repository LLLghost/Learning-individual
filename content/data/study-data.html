<script type="application/json" id="study-data">{"items": [{"id": "M00-0", "module": 0, "kind": "concept", "stem": "После одновременного обновления ядра и замены SSD задержка снизилась. Какой вывод обоснован?", "options": ["Ядро доказанно было единственной причиной", "Улучшение доказывает отсутствие других узких мест", "SSD доказанно был единственной причиной", "Совместное изменение связано с улучшением"], "answer": 3, "explanation": "Нужно разделить факторы или ограничить вывод. Одно наблюдение не устанавливает вклад двух изменений.", "reason": {"options": ["Совпадение изменения и улучшения по времени достаточно для причинного вывода", "Одно наблюдение при двух одновременно изменённых факторах не разделяет их вклад", "Вклад факторов считается равным, пока не показано обратное"], "answer": 1}}, {"id": "M00-1", "module": 0, "kind": "concept", "stem": "Нужно объединить p99 двух серверов с разным числом запросов. Что делать?", "options": ["Взять максимум: он всегда равен общему p99", "Объединить наблюдения или совместимые корзины гистограммы и затем вычислить квантиль", "Взвесить p99 по числу CPU", "Взять среднее двух p99 и взвесить его по числу запросов на каждом сервере"], "answer": 1, "explanation": "Квантиль нелинеен; даже взвешенное среднее отдельных p99 не даёт общего p99.", "reason": {"options": ["Квантиль — нелинейная функция распределения", "Любую метрику можно объединить взвешенным средним", "Общий квантиль всегда лежит между квантилями частей"], "answer": 0}}, {"id": "M00-2", "module": 0, "kind": "concept", "stem": "Две машины показывают 40k и 12k IOPS на «одном и том же тесте». Что делает сравнение осмысленным?", "options": ["Повторить измерение на каждой машине по три раза и взять лучший результат", "Привести обе к одной точке измерения, одному размеру блока и одному режиму кэша", "Пересчитать IOPS в мегабайты в секунду и сравнить их", "Выбрать машину с большей частотой процессора как эталон"], "answer": 1, "explanation": "Число без определения величины несопоставимо. Пока не совпадают точка снятия, размер операции и режим кэширования, две цифры описывают разные эксперименты, и любое их отношение — артефакт постановки, а не свойство машин.", "reason": {"options": ["Повторение снижает случайный разброс и этим делает величины сопоставимыми", "Сравнивать можно только величины с одинаковым определением, включая условия снятия", "Перевод в другие единицы устраняет разницу условий"], "answer": 1}}, {"id": "R00", "module": 0, "kind": "calculation", "stem": "Образ 24 GiB передаётся по 2 Gbit/s с полезной эффективностью 75%. Найдите нижнюю оценку времени и объясните два неучтённых фактора.", "explanation": "24·2³⁰·8/(2·10⁹·0,75)=137,439 с. Не учтены отдельные простои, запись и старт; эффективность должна иметь измеренное определение.", "fields": [{"label": "Время, с", "answer": 137.438953472}]}, {"id": "M01-0", "module": 1, "kind": "concept", "stem": "Драйвер передал устройству адрес буфера. Какое уточнение обязательно?", "options": ["Любой виртуальный адрес процесса пригоден для DMA", "Наличие IOMMU отменяет требования к времени жизни буфера", "Адрес должен быть получен по контракту отображения DMA", "Физический адрес и адрес DMA всегда численно равны"], "answer": 2, "explanation": "Виртуальный адрес CPU, физический адрес и адрес DMA — разные пространства; отображение и время жизни обязательны.", "reason": {"options": ["Адрес, которым устройство обращается к памяти, живёт в отдельном адресном пространстве", "Устройство обращается к памяти теми же адресами, что и процесс", "Наличие блока управления памятью устройств снимает требования к отображению и времени жизни буфера"], "answer": 0}}, {"id": "M01-1", "module": 1, "kind": "concept", "stem": "Два потока изменяют разные счётчики в одной строке кэша. Почему возможно замедление?", "options": ["Разные переменные обязательно занимают разные строки кэша процессора", "False sharing создаёт трафик когерентности даже без логического конфликта счётчиков", "Когерентность кэшей автоматически блокирует любой второй поток, пишущий рядом", "Буфер трансляции адресов запрещает двум потокам читать одну страницу"], "answer": 1, "explanation": "Протокол когерентности работает со строками кэша, а не с именами переменных.", "reason": {"options": ["Единица работы протокола когерентности — строка кэша целиком", "Замедление объясняется промахами трансляции адресов, поскольку потоки работают с одной страницей", "Когерентность отслеживает отдельные переменные"], "answer": 0}}, {"id": "M01-2", "module": 1, "kind": "concept", "stem": "Драйвер читает регистр MMIO как обычную переменную памяти. Чем это опасно?", "options": ["MMIO всегда хранит инструкции ядра вместо данных устройства", "Чтение регистра устройства может иметь побочный эффект", "CPU обязательно переключает процесс после каждого чтения", "IOMMU отключает устройство при обращении к любому регистру"], "answer": 1, "explanation": "MMIO отображает регистры устройства в адресное пространство. Чтение и запись там могут иметь побочный эффект и требуют правил доступа к устройству; обращаться к ним как к обычной RAM нельзя.", "reason": {"options": ["MMIO обслуживает только дисковые операции ввода-вывода", "Побочный эффект возможен только при записи в обычную RAM", "MMIO — регистры устройства, а не обычная RAM"], "answer": 2}}, {"id": "R01", "module": 1, "kind": "calculation", "stem": "Кэш: hit 2 нс, miss 4%, дополнительный штраф 120 нс. Найдите AMAT и результат при miss 1%. Можно ли обещать такое же ускорение всего приложения?", "explanation": "2+0,04·120=6,8 нс; при 1% — 3,2 нс. AMAT ускоряется в 2,125 раза, но полная нагрузка зависит от доли простоев на памяти и остальных ресурсов.", "fields": [{"label": "AMAT при 4%, нс", "answer": 6.8}, {"label": "AMAT при 1%, нс", "answer": 3.2}]}, {"id": "M02-0", "module": 2, "kind": "concept", "stem": "Load average высок, CPU в основном простаивает, много задач в состоянии D. Что проверять первым?", "options": ["Частоту CPU как уже доказанную первопричину", "Сосчитать процессы в состоянии зомби и сравнить их число с базовым замером", "Непрерываемые ожидания и путь ввода-вывода с сопоставлением wchan, PSI и устройств", "Увеличивать число потоков до исчезновения D"], "answer": 2, "explanation": "Load average в Linux включает часть непрерываемых ожиданий. Он не равен загрузке CPU.", "reason": {"options": ["Показатель средней нагрузки считает и часть задач, ожидающих ввода-вывода", "Средняя нагрузка — это доля времени занятости процессора, усреднённая по интервалу", "Задачи в непрерываемом ожидании из подсчёта исключаются"], "answer": 0}}, {"id": "M02-1", "module": 2, "kind": "concept", "stem": "Писатель в конвейере ждёт, хотя CPU свободен. Что объясняет ожидание?", "options": ["Планировщик останавливает каждый процесс после записи в pipe", "Стандартный вывод автоматически стал файлом на диске", "fork() удалил адресное пространство пишущего процесса", "Буфер pipe заполнен, пока потребитель не читает"], "answer": 3, "explanation": "У pipe конечная ёмкость. Когда потребитель не читает, писатель блокируется в ожидании места в канале; свободный процессор этого не меняет.", "reason": {"options": ["Пустой буфер блокирует только чтение из канала", "Свободный CPU исключает ожидание ввода-вывода", "У канала конечная ёмкость; писатель ждёт свободного места"], "answer": 2}}, {"id": "M02-2", "module": 2, "kind": "concept", "stem": "Процесс в состоянии D не снимается по SIGKILL. Почему и что это говорит о системе?", "options": ["Процесс защищён правами и требует другого пользователя для снятия", "Сигнал потерян планировщиком и его нужно отправить повторно", "Процесс ждёт завершения операции ядра и не может обработать сигнал до её конца", "Процесс уже завершился, а в таблице осталась только запись"], "answer": 2, "explanation": "Непрерываемый сон — это ожидание внутри ядра, чаще всего ввода-вывода. Сигнал будет доставлен, когда операция завершится или отвалится по таймауту; поэтому вопрос не «как убить», а «что именно не отвечает — диск, сеть, сетевая файловая система».", "reason": {"options": ["Обработка сигнала возможна только при возврате в пространство пользователя", "Ядро отменяет сигналы для системных процессов", "Состояние процесса не влияет на доставку сигналов"], "answer": 0}}, {"id": "R02", "module": 2, "kind": "calculation", "stem": "Последовательная доля 15%, исполнителей 12. Найдите предел ускорения и объясните, почему увеличение потоков не даёт линейного результата.", "explanation": "1/(0,15+0,85/12)=4,5283. Последовательная часть и накладные расходы ограничивают масштабирование.", "fields": [{"label": "Предел ускорения", "answer": 4.528301887}]}, {"id": "M03-0", "module": 3, "kind": "concept", "stem": "write() вернул успех. Какая гарантия ещё не получена автоматически?", "options": ["Возможность последующего writeback", "Приём переданных байтов по контракту конкретного успешного вызова write()", "Долговечность записи при внезапной потере питания всего пути хранения", "Возможность того, что данные находятся в page cache"], "answer": 2, "explanation": "Буферизованная запись может завершиться задолго до устойчивой записи на носитель.", "reason": {"options": ["Долговечность обеспечивает журнал файловой системы", "Успех вызова означает принятие байтов подсистемой", "Ядро подтверждает вызов только после ответа носителя"], "answer": 1}}, {"id": "M03-1", "module": 3, "kind": "concept", "stem": "df заметно больше du. Какой тест распознаёт удалённый, но открытый файл?", "options": ["Сопоставление lsof +L1 или /proc/PID/fd с inode и размером", "Сравнение только скорости NIC", "Чтение вывода free -m и сравнение свободной памяти с началом прогона", "Повторное удаление уже отсутствующего имени"], "answer": 0, "explanation": "Открытый дескриптор удерживает inode после unlink. Другие причины расхождения df и du также возможны.", "reason": {"options": ["Удаление имени не освобождает пространство, пока открыт дескриптор", "Расхождение объясняется блоками, зарезервированными для суперпользователя", "Отчёт о занятости считает то же, что обход дерева"], "answer": 0}}, {"id": "M03-2", "module": 3, "kind": "concept", "stem": "Файл удалён, а место на файловой системе не освободилось. Что происходит?", "options": ["Файловая система кэширует удаление и освободит место при следующей записи", "Запись каталога удалена, но файл держит открытый дескриптор процесса", "Место занято журналом файловой системы и вернётся после его очистки", "Удаление не выполнено из-за прав доступа, ошибка была подавлена"], "answer": 1, "explanation": "Удаление убирает имя из каталога, а не данные. Пока хотя бы один процесс держит открытый дескриптор, inode жив и блоки заняты; освобождение происходит при закрытии дескриптора или завершении процесса. Найти виновника можно через lsof.", "reason": {"options": ["Журнал файловой системы удерживает содержимое до контрольной точки", "Данные освобождаются, когда исчезает последняя ссылка на них, включая открытые дескрипторы", "Ошибки прав всегда приводят к молчаливому отказу"], "answer": 1}}, {"id": "R03", "module": 3, "kind": "calculation", "stem": "У трёх процессов по 40 MiB уникальной и 120 MiB общей памяти. Найдите RSS каждого, сумму RSS, общий физический расход и PSS каждого в упрощённой модели.", "explanation": "RSS=160 MiB каждый; сумма=480; физически=3·40+120=240; PSS=40+120/3=80 MiB каждый. Учёт упрощён, без дополнительных разделяемых и анонимных областей.", "fields": [{"label": "RSS каждого, MiB", "answer": 160}, {"label": "Сумма RSS, MiB", "answer": 480}, {"label": "Физически, MiB", "answer": 240}, {"label": "PSS каждого, MiB", "answer": 80}]}, {"id": "M04-0", "module": 4, "kind": "concept", "stem": "Unit содержит After=db.service. Что это означает?", "options": ["Порядок относительно db при участии обоих в запуске", "База уже готова принимать SQL", "База всегда автоматически запускается", "Все ошибки db автоматически исправляются"], "answer": 0, "explanation": "Порядок запуска, требование зависимости и готовность — разные контракты.", "reason": {"options": ["Служба считается запущенной, только когда начала принимать запросы", "Указание порядка автоматически втягивает зависимость в транзакцию запуска", "Порядок запуска, зависимость и готовность службы задаются разными директивами"], "answer": 2}}, {"id": "M04-1", "module": 4, "kind": "concept", "stem": "Система вошла в оболочку initramfs, корневой LV не найден. Что уже подтверждено?", "options": ["Готовность прикладных служб принимать запросы от клиентов", "Исправность всех записей fstab и успешное монтирование томов", "Передача управления ядру и запуск раннего пользовательского пространства", "Доступность основной корневой файловой системы и её монтирование"], "answer": 2, "explanation": "Диагностика должна начинаться с границы, на которой остановилась загрузка.", "reason": {"options": ["Аварийная оболочка указывает на отказ последней из выполнявшихся подсистем, её и проверяют", "Раз система не дошла до штатного запуска, проверять надо конфигурацию прикладных служб", "Место остановки задаёт границу доказанного"], "answer": 2}}, {"id": "M04-2", "module": 4, "kind": "concept", "stem": "После перезагрузки журнал за прошлую загрузку пуст, хотя служба падала именно тогда. Что проверить первым?", "options": ["Настроен ли journald на хранение журнала на диске", "Не отключён ли вывод службы в стандартный поток", "Хватает ли прав пользователю на чтение чужих журналов", "Не переполнен ли кольцевой буфер ядра"], "answer": 0, "explanation": "Журнал переживает перезагрузку, только когда лежит в /var/log/journal. При хранении в памяти записи исчезают вместе с прошлой загрузкой, и отсутствие данных ничего не говорит о самой службе.", "reason": {"options": ["Права влияют на видимость чужих записей, но не на их существование", "Кольцевой буфер и журнал служб — один и тот же источник", "Вопрос о хранилище решается раньше вопросов о содержимом"], "answer": 2}}, {"id": "R04", "module": 4, "kind": "calculation", "stem": "Файл создаётся с запрошенным режимом 0666 и umask 0022; каталог — 0777. Найдите режимы и объясните, почему ACL и MAC могут изменить эффективный доступ.", "explanation": "0644 и 0755 через AND с инвертированной маской. ACL и MAC проверяются отдельно, проход по родительским каталогам также влияет.", "fields": [{"label": "Режим файла (восьмеричная запись)", "answer": "0644"}, {"label": "Режим каталога", "answer": "0755"}]}, {"id": "M05-0", "module": 5, "kind": "concept", "stem": "Система остановилась в аварийной оболочке initramfs. Что это уже доказывает?", "options": ["Все записи fstab проверены и корректны, тома смонтированы штатно", "Корневая файловая система смонтирована и исправна", "Прошивка, загрузчик и ядро отработали, раннее пространство пользователя запущено", "Загрузчик повреждён и подлежит переустановке с носителя восстановления"], "answer": 2, "explanation": "Оболочка initramfs работает уже под управлением ядра. Не доказана только доступность и опознание корня, поэтому проверка начинается с устройства, а не с загрузчика.", "reason": {"options": ["Раз ядро загрузилось, носитель исправен целиком", "Оболочка раннего пространства пользователя работает уже под управлением ядра", "Появление аварийной оболочки указывает на повреждение загрузчика, поскольку штатная цепочка прервалась"], "answer": 1}}, {"id": "M05-1", "module": 5, "kind": "concept", "stem": "После замены контроллера хранения система уходит в аварийную оболочку, хотя прошивка диск видит. Что проверяют первым?", "options": ["Не переполнен ли журнал systemd на корневой файловой системе узла", "Есть ли в собранном initramfs модуль нового контроллера для текущего ядра", "Не сменился ли часовой пояс системы", "Не устарел ли пакет с прикладным программным обеспечением"], "answer": 1, "explanation": "Ядро загрузилось, значит носитель читается загрузчиком. Раннее пространство пользователя должно уметь работать с новым контроллером, а работающая до замены система об этом ничего не сообщала.", "reason": {"options": ["Загрузчик читает носитель средствами прошивки, а раннее пространство пользователя", "Набор модулей раннего образа собирается при каждой загрузке", "Если прошивка видит диск, все последующие слои получают к нему доступ теми же средствами"], "answer": 0}}, {"id": "M05-2", "module": 5, "kind": "concept", "stem": "Система не загружается после правки /etc/fstab. Какое свойство записи привело к остановке загрузки?", "options": ["Файловая система указана с неверным типом, и монтирование отложено", "Точка монтирования не существует, и её пришлось бы создавать", "Запись обязательна для загрузки, и её отказ переводит систему в аварийную цель", "Устройство указано по имени ядра, а не по идентификатору"], "answer": 2, "explanation": "Останавливает загрузку не сама ошибка, а обязательность записи: без nofail отказ монтирования делает соответствующую цель недостижимой, и systemd уходит в аварийный режим. Имя устройства и тип — частые причины отказа, но не причина остановки.", "reason": {"options": ["Отказ обязательной зависимости делает недостижимой всю цель, которая её требует", "Аварийный режим включается при любой ошибке в конфигурации", "Монтирование по имени ядра запрещено systemd"], "answer": 0}}, {"id": "R05", "module": 5, "kind": "calculation", "stem": "Раздел /boot имеет 512 MiB. Один комплект — ядро 14 MiB и образ initramfs 42 MiB. Сколько комплектов помещается и сколько места останется свободным?", "explanation": "На комплект уходит 14+42=56 MiB. floor(512/56)=9 комплектов, остаток 512−9·56=8 MiB. Расчёт не учитывает служебные структуры файловой системы и временный образ, который создаётся во время обновления.", "fields": [{"label": "Комплектов помещается", "answer": 9}, {"label": "Остаток, MiB", "answer": 8}]}, {"id": "M06-0", "module": 6, "kind": "concept", "stem": "Хост отправляет пакет за пределы локальной подсети через обычный шлюз. Для кого выполняется ARP?", "options": ["Для каждого авторитетного сервера DNS", "Для удалённого IP через все маршрутизаторы", "Всегда для адреса самого отправителя", "Для шлюза — следующего узла — на локальном сегменте"], "answer": 3, "explanation": "Кадр L2 доставляется соседу, который продолжит IP-маршрутизацию.", "reason": {"options": ["Разрешение адреса выполняется для конечного получателя", "Кадр адресуется соседу в сегменте, адрес назначения сетевого уровня не меняется", "Для адресов за пределами подсети канальный адрес не нужен"], "answer": 1}}, {"id": "M06-1", "module": 6, "kind": "concept", "stem": "Есть маршруты /16 и /24 в одной применимой таблице; оба совпали. Какой принцип выбора?", "options": ["Наиболее длинный префикс /24, затем применимые дополнительные правила", "Всегда меньшая метрика независимо от префикса", "Всегда маршрут с большим MTU, поскольку он пропускает крупные пакеты", "Всегда первый добавленный маршрут"], "answer": 0, "explanation": "Самое длинное совпадение префикса действует внутри выбранной таблицы; policy routing отдельно выбирает таблицу.", "reason": {"options": ["Порядок записей в таблице задаёт приоритет, как в списках правил межсетевого экрана", "Приоритет определяет метрика, а длина префикса учитывается лишь при равных метриках", "Из совпавших маршрутов одной таблицы выбирается самый специфичный"], "answer": 2}}, {"id": "M06-2", "module": 6, "kind": "concept", "stem": "Адрес и маршрут добавлены командой ip, связь работает. После перезагрузки связи нет. Что произошло?", "options": ["Ядро вернуло интерфейс в состояние по умолчанию из-за ошибки в драйвере", "Изменения касались состояния ядра, а конфигурация службы управления сетью осталась прежней", "Адрес занят другим узлом, и конфликт разрешился не в вашу пользу", "Служба сети запускается позже, и адрес появится через несколько минут"], "answer": 1, "explanation": "Команды ip меняют текущее состояние, а не файлы. После перезагрузки интерфейс настраивает та служба, которая описана в системе: ifupdown, systemd-networkd, NetworkManager или cloud-init. Проверка настройки — это перезагрузка либо перечитывание конфигурации, а не взгляд на вывод ip addr.", "reason": {"options": ["Конфликт адресов проявляется только после перезагрузки", "Состояние ядра не сохраняется само, его восстанавливает служба по своим файлам", "Сетевые службы всегда стартуют с задержкой"], "answer": 1}}, {"id": "R06", "module": 6, "kind": "calculation", "stem": "Для 10.8.3.190/26 найдите сеть, broadcast и обычный диапазон узлов. Какой MAC нужен для отправки к 10.9.0.10 через настроенный шлюз?", "explanation": "Сеть 10.8.3.128, broadcast .191, узлы .129–.190. Нужен MAC выбранного шлюза в той же сети, а не удалённого адреса назначения.", "fields": [{"label": "Сеть", "answer": "10.8.3.128"}, {"label": "Broadcast", "answer": "10.8.3.191"}]}, {"id": "M07-0", "module": 7, "kind": "concept", "stem": "Рукопожатие завершено, большие ответы зависают через туннель. Что проверить?", "options": ["Увеличить DNS TTL как доказанное исправление", "Отключить все ICMP сообщения на обеих сторонах", "Считать путь данных полностью исправным", "PMTU, ошибки ICMP и границу прохождения крупных пакетов"], "answer": 3, "explanation": "Малые пакеты рукопожатия не проверяют передачу крупных пакетов с данными.", "reason": {"options": ["Размер пакета согласуется при установлении соединения", "Раз соединение установлено, путь проверен целиком", "Установление соединения проверяется малыми пакетами"], "answer": 2}}, {"id": "M07-1", "module": 7, "kind": "concept", "stem": "Почему один recv() не обязан вернуть один полный запрос приложения?", "options": ["Каждый send соответствует одному обязательному recv", "TCP не может сегментировать данные и отправляет сообщение целиком", "TCP предоставляет поток байтов без сохранения прикладных границ сообщений", "TCP передаёт только ровно по одной строке"], "answer": 2, "explanation": "Приложению требуется разметка сообщений: длина, разделитель или протокол сообщений.", "reason": {"options": ["Транспорт доставляет поток байтов и не сохраняет границы сообщений", "Каждой операции отправки соответствует ровно одна операция приёма", "Границы сообщений сохраняются, пока сообщение помещается в один сегмент"], "answer": 0}}, {"id": "M07-2", "module": 7, "kind": "concept", "stem": "Рукопожатие TCP проходит, мелкие ответы приходят, а большой файл зависает. Какая гипотеза объясняет всё три факта сразу?", "options": ["Сервер перегружен и не успевает отдавать крупные объекты", "На пути есть участок с меньшим MTU, а сообщения ICMP о нём не доходят", "Разрешение имён работает через раз, и часть запросов теряется", "Клиент и сервер согласовали разные версии протокола"], "answer": 1, "explanation": "Соединение устанавливается мелкими сегментами и проходит; крупные сегменты с запретом фрагментации отбрасываются на узком участке, а уведомление об этом теряется. Симптом «соединение есть, передачи нет» — почти всегда про MTU и потерянный ICMP, и проверяется пингом с флагом DF по возрастанию размера.", "reason": {"options": ["Разрешение имён участвует только до установления соединения", "Версии протокола согласуются до передачи данных", "Перегрузка проявлялась бы и на мелких ответах, а не только на крупных"], "answer": 2}}, {"id": "R07", "module": 7, "kind": "calculation", "stem": "Канал 25 Gbit/s, RTT 8 мс, фактический MTU 1400. Найдите BDP в MB и MSS для IPv4/TCP без опций. Почему рукопожатия недостаточно для проверки PMTU?", "explanation": "BDP=25 MB; MSS=1360 B. Большой пакет с данными может не проходить при успешном обмене малыми пакетами рукопожатия.", "fields": [{"label": "BDP, десятичные MB", "answer": 25}, {"label": "MSS, B", "answer": 1360}]}, {"id": "M08-0", "module": 8, "kind": "concept", "stem": "Две NIC объединены LACP и подключены к одному коммутатору. Что гарантируется не автоматически?", "options": ["Наличие согласованного агрегата при верной настройке партнёров", "Возможность распределять разные потоки по каналам", "Продолжение работы при полном отказе этого коммутатора", "Сохранение порядка обычного потока через хеширование"], "answer": 2, "explanation": "Общий коммутатор остаётся единым доменом отказа.", "reason": {"options": ["Объединение каналов резервирует линии и порты, но не само устройство", "Объединение каналов создаёт резерв на всех уровнях, поскольку трафик идёт по независимым линиям", "Отказ коммутатора обрабатывает протокол согласования, перенося агрегат на соседнее устройство"], "answer": 0}}, {"id": "M08-1", "module": 8, "kind": "concept", "stem": "Какое утверждение о NAT правильно?", "options": ["NAT меняет адреса и порты, но правила доступа требуют отдельного анализа", "Трансляция адресов исключает необходимость обратного пути в таблице маршрутов", "Трансляция адресов сама по себе пропускает только авторизованных пользователей", "Любая ошибка маршрутизации исправляется добавлением masquerade на границе"], "answer": 0, "explanation": "Трансляция адреса не равна авторизации и не устраняет логику маршрутизации.", "reason": {"options": ["Трансляция адресов и портов — преобразование заголовков", "Подмена адреса источника обеспечивает обратный путь сама по себе", "Трансляция выполняется после проверки правил доступа"], "answer": 0}}, {"id": "M08-2", "module": 8, "kind": "concept", "stem": "Два узла в разных VLAN одного коммутатора не видят друг друга. Что это означает?", "options": ["Неисправен коммутатор: VLAN не должны мешать связи внутри одного устройства", "Так и должно быть: разделение на втором уровне требует маршрутизации для связи", "Нужно добавить адреса из одной подсети — тогда связь появится", "Проблема в неправильных PVID на портах, их нужно выровнять"], "answer": 1, "explanation": "VLAN — это отдельные домены широковещания. Связь между ними возможна только через устройство третьего уровня с маршрутом и политикой. Одинаковая подсеть по обе стороны делает ситуацию хуже: адреса выглядят локальными, а кадры до соседа не доходят.", "reason": {"options": ["Связь между разными доменами второго уровня требует явного шага третьего уровня", "Коммутатор обязан пересылать кадры между любыми своими портами", "PVID определяет, попадут ли кадры в нужный VLAN, и этого достаточно"], "answer": 0}}, {"id": "R08", "module": 8, "kind": "calculation", "stem": "Четыре линии 10GbE в LACP. Оцените предел одного обычного хешируемого потока и множества потоков. Укажите два оставшихся домена отказа.", "explanation": "Один поток обычно ≤10 Gbit/s, сумма множества идеализированно ≤40 до накладных расходов и дисбаланса. Общий коммутатор, питание, вышестоящий канал и конфигурация остаются общими.", "fields": [{"label": "Один поток, Gbit/s", "answer": 10}, {"label": "Сумма идеальная, Gbit/s", "answer": 40}]}, {"id": "M09-0", "module": 9, "kind": "concept", "stem": "На 64 логических CPU один последовательный поток насыщен. Почему общий CPU% может быть низким?", "options": ["SMT гарантирует линейное ускорение одного потока", "Низкий процент загрузки CPU исключает любое узкое место по CPU", "Поток автоматически использует все процессорные сокеты", "Агрегированный показатель усредняет по множеству CPU"], "answer": 3, "explanation": "Нужны наблюдения по потокам и по отдельным CPU и модель последовательной части.", "reason": {"options": ["Одиночный поток распределяется планировщиком по всем ядрам", "Низкая общая загрузка исключает узкое место по процессору, значит причина в другой подсистеме", "Общий показатель усредняется по всем процессорам"], "answer": 2}}, {"id": "M09-1", "module": 9, "kind": "concept", "stem": "Число исправленных ошибок ECC растёт в одном канале. Как действовать?", "options": ["Немедленно заменить все диски", "Объявить DIMM единственной причиной без других данных", "Игнорировать, поскольку исправленная ошибка гарантирует вечную исправность", "Сопоставить тренд, DIMM, слот и канал, RAS и условия"], "answer": 3, "explanation": "Источник может быть DIMM, слот, контроллер или внешние условия; важны тренд и локальность.", "reason": {"options": ["Раз ошибка исправлена, данные не пострадали", "Исправленное событие — сигнал о состоянии канала", "Рост числа исправленных ошибок однозначно указывает на неисправность модуля памяти"], "answer": 1}}, {"id": "M09-2", "module": 9, "kind": "concept", "stem": "Приложение работает вдвое медленнее на машине с большим числом ядер. Какое объяснение проверяется первым?", "options": ["Память выделена на одном узле NUMA, а потоки исполняются на другом", "Большее число ядер всегда означает меньшую частоту каждого", "Приложение не умеет использовать больше одного ядра", "Включено энергосбережение и процессор работает на пониженной частоте"], "answer": 0, "explanation": "Доступ к памяти чужого узла дороже локального, и на многосокетной машине это даёт устойчивое замедление при формально большем числе ядер. Проверяется привязкой потоков и памяти к одному узлу и сравнением двух прогонов; остальные версии тоже возможны, но объясняют не «хуже на большей машине», а «медленно вообще».", "reason": {"options": ["Частота и энергосбережение влияют одинаково на обеих машинах", "Расположение памяти относительно исполняющего ядра меняет стоимость доступа", "Однопоточное приложение не зависит от числа ядер"], "answer": 1}}, {"id": "R09", "module": 9, "kind": "calculation", "stem": "60% обращений к памяти по 85 нс, 40% по 155 нс. Найдите среднюю задержку; что должно быть измерено до решения о закреплении потоков?", "explanation": "0,6·85+0,4·155=113 нс. Измеряют фактическую локальность, IRQ и рабочие потоки, давление на память и задержку под нагрузкой; среднее по обращениям не равно времени запроса.", "fields": [{"label": "Средняя задержка, нс", "answer": 113}]}, {"id": "M10-0", "module": 10, "kind": "concept", "stem": "В lspci есть Kernel modules, но нет Kernel driver in use. Что доказано?", "options": ["Полностью работающий сетевой путь данных", "Физическая неисправность оконечного устройства", "Перечисление и наличие кандидата модуля", "Отсутствие оконечного устройства в конфигурационном пространстве"], "answer": 2, "explanation": "Возможный модуль и активный драйвер — разные строки с разной доказательной силой.", "reason": {"options": ["Отсутствие строки об используемом драйвере означает, что устройство не отвечает на обращения", "Раз устройство перечислено и модуль найден, драйвер загружен", "Перечисление устройства, найденный для него код и состоявшаяся связка с ядром"], "answer": 2}}, {"id": "M10-1", "module": 10, "kind": "concept", "stem": "LnkCap x16, LnkSta x4. Что нужно до вывода о регрессе?", "options": ["Переустановить приложение и повторить измерение пропускной способности", "Считать любое подключение по четырём линиям физической поломкой слота", "Сложить ширину x16 и x4 и записать текущую ширину канала как x20 линий", "Разводка слота, возможности вышестоящего порта, райзер и требования нагрузки"], "answer": 3, "explanation": "Capability у оконечного устройства не равна обеспеченной топологии платформы.", "reason": {"options": ["Текущая ширина складывается из значений, объявленных обоими концами канала", "Расхождение заявленной и текущей ширины всегда означает физическую неисправность канала", "Заявленная возможность устройства не равна тому, что обеспечила платформа"], "answer": 2}}, {"id": "M10-2", "module": 10, "kind": "concept", "stem": "Плата видна в lspci, но драйвер к ней не привязан. Что это значит для диагностики?", "options": ["Устройство неисправно и требует замены", "Перечисление PCIe прошло, а сопоставление драйвера — нет: это разные этапы", "Слот работает на пониженной скорости, и ядро отказалось от устройства", "Устройство отключено в прошивке и его не должно быть видно"], "answer": 1, "explanation": "«Видно» и «работает» разделены: прошивка и ядро перечисляют устройство, драйвер привязывается отдельно по идентификаторам. Строка Kernel driver in use пуста, когда модуля нет, он не загружен или идентификатор не поддерживается — и это чинится совсем не так, как неисправность платы.", "reason": {"options": ["Неисправное устройство не появляется в выводе lspci", "Скорость линии определяет, будет ли загружен драйвер", "Перечисление подтверждает наличие устройства, но не наличие драйвера"], "answer": 2}}, {"id": "R10", "module": 10, "kind": "calculation", "stem": "Рассчитайте полосу Gen3 x8 при 8 GT/s и кодировании 128/130. Почему приложение получит меньше?", "explanation": "8·10⁹·128/130·8/8≈7,8769·10⁹ B/s=7,877 GB/s. Заголовки, flow control, размер транзакции и остальные узкие места уменьшают результат.", "fields": [{"label": "Полоса, десятичные GB/s", "answer": 7.8769230769}]}, {"id": "M11-0", "module": 11, "kind": "concept", "stem": "Журнал ОС обрывается без последовательности выключения, в журнале контроллера есть событие потери входного напряжения. Какой вывод обоснован?", "options": ["Отказ вызван ошибкой ядра, раз журнал оборвался", "Первопричина доказана, можно закрывать инцидент", "Гипотеза о питании стала сильнее", "Событие контроллера не относится к делу, поскольку его нет в журнале ОС"], "answer": 2, "explanation": "Две плоскости ведут независимые линии времени с собственными часами. Совпадение по смыслу ещё не совпадение по времени, а резервирование проверяется схемой ввода, а не наличием второго блока.", "reason": {"options": ["Запись в журнале контроллера относится к другой подсистеме и на выводы об операционной системе не влияет", "Обрыв журнала без последовательности выключения сам по себе указывает на отказ программной части", "Две плоскости ведут независимые линии времени"], "answer": 2}}, {"id": "M11-1", "module": 11, "kind": "concept", "stem": "Обороты вентиляторов в норме, температура на входе в норме, процессор троттлит. Где искать разрыв?", "options": ["В политике резервного копирования узла и расписании её выполнения", "В версии прикладного пакета, который создаёт нагрузку на этот узел", "В настройках разрешения имён на узле и его сетевой конфигурации в целом", "Между воздухом и кристаллом: путь воздуха и контакт радиатора"], "answer": 3, "explanation": "Тепловой контур — цепочка звеньев. Исправные вентиляторы и нормальный вход исключают начало цепочки, поэтому разрыв находится дальше: заглушки отсеков, воздуховод, прижим радиатора, состояние теплопроводящего материала.", "reason": {"options": ["Снижение частоты при исправных вентиляторах вызывается ограничением по питанию", "Нормальная температура на входе означает достаточное охлаждение", "Тепловой путь — цепочка звеньев от воздуха до кристалла"], "answer": 2}}, {"id": "M11-2", "module": 11, "kind": "concept", "stem": "Сервер не отвечает по сети, но BMC доступен и показывает, что питание включено. Что уже известно?", "options": ["Проблема точно в сетевом коммутаторе", "Питание и дежурное управление работают, отказ лежит выше — в ОС, сети данных или загрузке", "Отказала материнская плата, раз основная система молчит", "Достаточно перезагрузить сервер, причина выяснится сама"], "answer": 1, "explanation": "BMC питается отдельно и живёт своей жизнью: его доступность подтверждает питание и дежурную плоскость управления, но ничего не говорит об операционной системе. Следующий шаг — консоль через BMC: она отделяет «не загрузилась» от «загрузилась, но недоступна по сети».", "reason": {"options": ["Управляющая плоскость независима от плоскости данных, и их отказы надо различать", "Ответ BMC доказывает исправность всей машины", "Перезагрузка — самый быстрый способ узнать причину"], "answer": 0}}, {"id": "R11", "module": 11, "kind": "calculation", "stem": "Узел потребляет 640 Вт и питается от двух блоков по 800 Вт в режиме 1+1. Найдите загрузку одного блока при потере второго и запас до его предела.", "explanation": "640/800=80% загрузки оставшегося блока, запас 800−640=160 Вт. Расчёт описывает установившийся режим: пусковые токи, потери преобразования и снижение допустимой мощности при высокой температуре считаются отдельно.", "fields": [{"label": "Загрузка оставшегося блока, %", "answer": 80}, {"label": "Запас до предела, Вт", "answer": 160}]}, {"id": "M12-0", "module": 12, "kind": "concept", "stem": "Что означает namespace NVMe?", "options": ["Логическое адресное пространство, которое делится с другими", "Обязательно отдельный физический накопитель со своим контроллером", "Каталог в файловой системе, к которому обращается драйвер устройства", "Всегда независимый домен питания со своим блоком и собственной платой"], "answer": 0, "explanation": "Логические устройства не следует автоматически считать физически независимыми.", "reason": {"options": ["Логическое разделение адресного пространства не создаёт независимости по носителю, контроллеру и питанию", "Логическое пространство — это способ разметки внутри файловой системы устройства", "Каждое логическое пространство обслуживает собственный контроллер"], "answer": 0}}, {"id": "M12-1", "module": 12, "kind": "concept", "stem": "Почему замер по sparse-файлу может вводить в заблуждение?", "options": ["Скорость такого чтения всегда равна скорости NAND", "Sparse-файл всегда медленнее любых реальных нагрузок", "Разрежённый файл отключает все кэши контроллера при чтении дыр", "Чтение дыр может возвращать нули без чтения ожидаемого объёма с носителя"], "answer": 3, "explanation": "Для сопоставимого теста нужен реально подготовленный набор данных и понятный путь ввода-вывода.", "reason": {"options": ["Чтение неразмещённых областей обслуживается без обращения к носителю", "Прямой режим ввода-вывода исключает влияние разрежённости", "Разрежённый файл читается медленнее обычного из-за дополнительных обращений к метаданным"], "answer": 0}}, {"id": "M12-2", "module": 12, "kind": "concept", "stem": "После перезагрузки скрипт стёр не тот диск: имя /dev/sdb досталось другому устройству. Как этого избежать?", "options": ["Всегда перечитывать вывод lsblk перед запуском скрипта", "Обращаться к устройству по устойчивому идентификатору, а не по букве", "Закрепить порядок дисков в настройках прошивки", "Выполнять скрипт только сразу после загрузки системы"], "answer": 1, "explanation": "Буквы выдаются в порядке обнаружения и между загрузками меняются. Устойчивы имена в /dev/disk/by-id — по серийному номеру или WWN — и идентификаторы файловых систем. Ручная проверка помогает человеку, но не скрипту, который выполнится в следующий раз без него.", "reason": {"options": ["Настройки прошивки определяют имена устройств в Linux", "Порядок обнаружения устройств не является свойством самого устройства", "Скрипт безопасен, если запускать его в определённое время"], "answer": 1}}, {"id": "R12", "module": 12, "kind": "calculation", "stem": "32 000 IOPS по 16 KiB, средняя задержка 1,5 мс. Найдите MiB/s и среднее число запросов в системе при согласованной границе.", "explanation": "500 MiB/s; L=32000·0,0015=48. В расчёте среднее, не p99; одна согласованная граница наблюдения.", "fields": [{"label": "MiB/s", "answer": 500}, {"label": "L, запросов", "answer": 48}]}, {"id": "M13-0", "module": 13, "kind": "concept", "stem": "LV вырос, FS нет. Следующий шаг?", "options": ["Повторно выполнить mkfs на логическом томе и смонтировать его заново", "Подтвердить источник монтирования, тип и состояние файловой системы", "Немедленно пересоздать таблицу разделов GPT и повторить монтирование", "Считать свободное место в группе томов уже доступным приложению внутри ФС"], "answer": 1, "explanation": "LV и ФС — разные слои. Создание новой ФС разрушает прежние метаданные.", "reason": {"options": ["Логический том и файловая система на нём", "Свободное место группы томов доступно приложению сразу после расширения тома", "Файловая система читает размер устройства при каждом обращении"], "answer": 0}}, {"id": "M13-1", "module": 13, "kind": "concept", "stem": "Почему журналируемая FS не гарантирует завершённость транзакции БД?", "options": ["FS восстанавливает свои структуры", "Любая журналируемая ФС запрещает WAL", "Журналирование всегда хранит только пользовательские пароли", "Согласованность после сбоя тождественна согласованности приложения"], "answer": 0, "explanation": "Согласованность нижнего слоя не определяет логические инварианты приложения.", "reason": {"options": ["Нижний слой после сбоя приводит в порядок собственные метаданные", "Согласованность после сбоя на нижнем слое означает согласованность на всех верхних", "Журнал файловой системы и журнал упреждающей записи делают одну работу"], "answer": 0}}, {"id": "M13-2", "module": 13, "kind": "concept", "stem": "Логический том расширен, lvs показывает новый размер, df — прежний. Что осталось сделать и почему это отдельный шаг?", "options": ["Перемонтировать файловую систему: размер обновится при монтировании", "Расширить файловую систему: она не отслеживает размер устройства под собой", "Пересоздать файловую систему поверх увеличенного тома", "Обновить кэш LVM, из-за которого df показывает старое значение"], "answer": 1, "explanation": "Это два независимых слоя: LVM управляет ёмкостью, файловая система — своей структурой поверх неё. Расширение тома не меняет суперблок и таблицы размещения; их обновляет resize2fs или xfs_growfs. Перемонтирование ничего не добавит, а пересоздание уничтожит данные.", "reason": {"options": ["Данные о размере кэшируются и обновляются при монтировании", "Файловая система узнаёт о новом размере при первой записи", "Каждый слой хранит собственные метаданные и меняется собственной командой"], "answer": 2}}, {"id": "R13", "module": 13, "kind": "calculation", "stem": "VG имеет PE=4 MiB и 10 240 свободных extents. Можно ли увеличить LV на 48 GiB? Найдите дефицит.", "explanation": "Свободно 40 GiB. Нужно 12 288 extents, дефицит 2048 extents=8 GiB; расширение на 48 сейчас невозможно.", "fields": [{"label": "Дефицит, GiB", "answer": 8}, {"label": "Дефицит extents", "answer": 2048}]}, {"id": "M14-0", "module": 14, "kind": "concept", "stem": "RAID10 из двух зеркал потерял оба диска одного зеркала. Что верно?", "options": ["RAID10 автоматически переходит в RAID6", "Обычная парная схема не гарантирует доступность массива", "Любые два отказа всегда допустимы", "Два оставшихся диска обязательно содержат всё"], "answer": 1, "explanation": "Устойчивость зависит от расположения отказов по зеркальным парам.", "reason": {"options": ["Схема выдерживает отказ половины дисков", "Устойчивость определяется тем, как отказы распределены по зеркальным парам", "Оставшиеся диски содержат полную копию данных, так как чередование дублируется"], "answer": 1}}, {"id": "M14-1", "module": 14, "kind": "concept", "stem": "Все накопители одной полки пропали одновременно. Какая проверка наиболее информативна?", "options": ["Смена сервера имён на узле и повторная проверка доступности дисков", "Замена каждого накопителя как доказанно неисправного", "Общий экспандер, питание и вышестоящий путь с сопоставлением времени", "Очистка всех сигнатур RAID"], "answer": 2, "explanation": "Коррелированный отказ ветви усиливает гипотезу общего домена отказа.", "reason": {"options": ["Пропажа устройств из системы означает потерю разметки, которую нужно восстановить", "Одновременный отказ нескольких накопителей объясняется общей партией и одинаковым износом", "Одновременность отказа группы устройств указывает на общий для них элемент"], "answer": 2}}, {"id": "M14-2", "module": 14, "kind": "concept", "stem": "Массив RAID1 деградирован: один участник отказал. Что это меняет прямо сейчас?", "options": ["Данные уже частично потеряны, и нужна копия", "Данные доступны, но избыточности нет: следующий отказ станет потерей", "Массив недоступен до замены участника", "Производительность чтения удваивается за счёт освободившегося устройства"], "answer": 1, "explanation": "Деградация — это состояние без запаса, а не состояние потери. Смысл резерва в том, что он тратится: массив продолжает работать на одном участнике, и всё время до восстановления вы работаете без права на вторую ошибку.", "reason": {"options": ["Избыточность — это запас на следующий отказ, а не защита от уже случившегося", "Отказ участника всегда сопровождается повреждением данных", "Недоступность массива — обычное следствие деградации"], "answer": 0}}, {"id": "R14", "module": 14, "kind": "calculation", "stem": "Девять дисков по 8 TB, один hot spare, остальные RAID6. Найдите номинальную полезную ёмкость в TB и TiB; оцените rebuild одного диска 8 TB при 200 MB/s.", "explanation": "В массиве 8 дисков: (8−2)·8=48 TB≈43,656 TiB до накладных расходов. Rebuild ≥40000 с≈11,11 ч при устойчивых 200 MB/s.", "fields": [{"label": "Полезная ёмкость, TB", "answer": 48}, {"label": "Полезная ёмкость, TiB", "answer": 43.6557456851}, {"label": "Rebuild, часы", "answer": 11.1111111111}]}, {"id": "M15-0", "module": 15, "kind": "concept", "stem": "Четыре /dev/sdX имеют один подтверждённый WWID LUN. На чём создавать верхний слой?", "options": ["На объединении путей RAID0 для четырёхкратной ёмкости", "На произвольном первом пути, не глядя на общий mapper устройства", "На согласованном устройстве multipath для этого LUN после проверки идентичности", "На каждом пути по отдельности, считая их четырьмя независимыми дисками"], "answer": 2, "explanation": "Пути ведут к одним блокам; раздельная инициализация не создаёт независимые данные.", "reason": {"options": ["Каждый путь предоставляет независимую копию данных, которую можно использовать отдельно", "Несколько путей ведут к одним и тем же блокам", "Объединение путей увеличивает доступную ёмкость пропорционально их числу"], "answer": 1}}, {"id": "M15-1", "module": 15, "kind": "concept", "stem": "Почему два хоста не должны независимо монтировать общий ext4 на запись?", "options": ["ext4 может читать только один процесс в каждый момент времени работы", "Multipath запрещает любое общее хранилище для двух хостов одновременно", "Обычная ФС не координирует метаданные и кэши двух хостов", "TCP автоматически упорядочивает все метаданные ФС между хостами"], "answer": 2, "explanation": "Доступность блока и распределённая согласованность FS — разные задачи.", "reason": {"options": ["Доступность блочного устройства с двух узлов сама по себе даёт согласованный доступ к файловой системе", "Протокол транспорта упорядочивает операции", "Разметка на диске рассчитана на единственного владельца"], "answer": 2}}, {"id": "M15-2", "module": 15, "kind": "concept", "stem": "Один LUN виден операционной системе как два устройства. Что будет, если смонтировать оба?", "options": ["Ничего особенного: это две копии одних данных", "Повреждение данных: два независимых пути пишут на одно устройство без согласования", "Второе монтирование завершится отказом по занятости", "Скорость вырастет за счёт распределения нагрузки по путям"], "answer": 1, "explanation": "Без multipath операционная система считает пути разными устройствами и не согласует кэши и блокировки. Одновременная запись по двум путям разрушает файловую систему. Правильное решение — собрать пути в одно устройство multipath и работать только с ним.", "reason": {"options": ["Файловая система сама обнаруживает повторное монтирование", "Два пути к одному устройству требуют слоя, который согласует доступ", "Распределение по путям выполняется ядром автоматически"], "answer": 1}}, {"id": "R15", "module": 15, "kind": "calculation", "stem": "Четыре пути показывают один WWID и 5 TiB каждый. Сколько уникальной ёмкости доказано? Приложение ждёт 20 с, переключение на резерв занимает 35 с: оцените результат.", "explanation": "Доказано не более представления одного LUN на 5 TiB при подтверждённой уникальности WWID; нужна проверка топологии. Пауза 35>20 с нарушает терпимость приложения, даже если данные сохранны.", "fields": [{"label": "Уникальная ёмкость, TiB", "answer": 5}, {"label": "Превышение timeout, с", "answer": 15}]}, {"id": "M16-0", "module": 16, "kind": "concept", "stem": "Зачем нужен scrub?", "options": ["Заменить учебное восстановление приложения", "Гарантировать отсутствие всех будущих отказов", "Проверить данные и при возможности восстановить по корректной избыточности", "Создать независимую копию вне площадки и проверить её восстановлением"], "answer": 2, "explanation": "Проверка и исправление текущих блоков не создаёт независимую резервную копию.", "reason": {"options": ["Регулярная проверка целостности заменяет резервное копирование, поскольку повреждения исправляются", "Проверка гарантирует отсутствие отказов в будущем, поскольку выявляет деградацию заранее", "Проверка и восстановление по избыточности работают в том же хранилище"], "answer": 2}}, {"id": "M16-1", "module": 16, "kind": "concept", "stem": "Для чего нужен SLOG в соответствующей ZFS-конфигурации?", "options": ["Для отдельного размещения intent log синхронных операций", "Для хранения всех блоков кэша чтения вместо ARC", "Для общего ускорения любых асинхронных записей без условий", "Для превращения любого однодискового пула в зеркало"], "answer": 0, "explanation": "SLOG и общий кэш записи или чтения — разные механизмы.", "reason": {"options": ["Отдельное устройство журнала ускоряет любые записи, поскольку принимает их раньше основного пула", "Журнал намерений хранит блоки для чтения, разгружая оперативную память", "Отдельное устройство журнала намерений обслуживает синхронные записи"], "answer": 2}}, {"id": "M16-2", "module": 16, "kind": "concept", "stem": "К зеркальному пулу ZFS добавили одиночный верхнеуровневый vdev. Как изменился риск потери всего пула?", "options": ["Риск не изменился: зеркало автоматически защищает новый vdev", "Отказ единственного диска нового vdev может вывести из строя весь пул", "Новый vdev только ускоряет чтение и не хранит данные", "ZFS запретит запись, пока новый vdev не станет зеркалом"], "answer": 1, "explanation": "Избыточность задаётся внутри каждого vdev. Пул распределяет блоки между верхнеуровневыми vdev, поэтому одиночный диск среди них становится общей точкой отказа.", "reason": {"options": ["ZFS проверяет только контрольные суммы и не использует избыточность", "Снимки автоматически копируют данные между всеми vdev", "Пул зависит от каждого vdev; зеркало защищает лишь свой."], "answer": 2}}, {"id": "R16", "module": 16, "kind": "calculation", "stem": "Изменения на исходном пуле идут 80 GiB/час, канал репликации даёт 25 MiB/s полезных. Сможет ли он догнать отставание 100 GiB при продолжающейся нагрузке? Найдите идеальное время.", "explanation": "25·3600/1024=87,890625 GiB/ч. Чистая скорость догоняния=7,890625 GiB/ч; 100/7,890625≈12,673 ч. Это идеальная оценка без нового роста нагрузки и накладных расходов.", "fields": [{"label": "Время догоняния, часы", "answer": 12.6732673267}]}, {"id": "M17-0", "module": 17, "kind": "concept", "stem": "Пять голосующих узлов разделились 3+2. Кто может иметь большинство?", "options": ["Сторона с двумя мониторами, если она держит больше копий данных", "Никто, потому что нужен всегда полный состав", "Сторона с тремя при соблюдении протокола и остальных условий", "Обе стороны независимо"], "answer": 2, "explanation": "Большинство=3; пересечение большинств помогает избежать конфликтующих решений.", "reason": {"options": ["Решение принимает сторона, набравшая большинство голосов", "Решает сторона, сохранившая связь с внешней сетью, независимо от числа голосов", "Для решения требуется полный состав"], "answer": 0}}, {"id": "M17-1", "module": 17, "kind": "concept", "stem": "Три MON Ceph работают. Что это не доказывает?", "options": ["Наличие трёх доступных копий каждого объекта и готовность плоскости данных", "Различие MON и OSD функций", "Наличие наблюдаемого кворума плоскости управления при соответствующем здоровье", "Возможность читать карты кластера при исправной плоскости управления"], "answer": 0, "explanation": "Кворум MON и размещение с доступностью данных OSD проверяются отдельно.", "reason": {"options": ["Кворум плоскости управления и доступность данных проверяются отдельно", "Работающая плоскость управления означает доступность данных, поскольку она отслеживает их состояние", "Число узлов управления задаёт число копий каждого объекта"], "answer": 0}}, {"id": "M17-2", "module": 17, "kind": "concept", "stem": "Узел Ceph перестал отвечать вовремя. Почему тайм-аут сам по себе не доказывает, что узел погиб?", "options": ["Тайм-аут означает только переполнение журнала", "Медленный или сетево изолированный узел выглядит так же, как отказавший", "Ceph не использует тайм-ауты при проверке узлов", "При отказе узел всегда присылает отдельное сообщение"], "answer": 1, "explanation": "В распределённой системе отсутствие ответа не отличает смерть узла от задержки или разрыва связи. Решение об отказе принимают по правилам кворума и состоянию системы.", "reason": {"options": ["Тайм-аут не доказывает смерть: ответ мог задержаться.", "Репликация гарантирует, что любой узел отвечает без задержки", "Большинство узлов нужно только для повышения скорости чтения"], "answer": 0}}, {"id": "R17", "module": 17, "kind": "calculation", "stem": "5 хостов по 18 TiB сырой ёмкости, размер реплики 3, плановый предел заполнения 70%. Оцените полезную ёмкость до дополнительных резервов. Сколько голосов нужно для большинства из 5?", "explanation": "90·0,7/3=21 TiB до дополнительных резервов. Большинство=3. Отдельно проверяют размещение после потери хоста, не только нормальную ёмкость.", "fields": [{"label": "Полезная ёмкость, TiB", "answer": 21}, {"label": "Большинство", "answer": 3}]}, {"id": "M18-0", "module": 18, "kind": "concept", "stem": "В формулу L=λW подставляют задержку HTTP p99 и IOPS диска. Что неверно?", "options": ["Нужно заменить IOPS на число CPU и всё исправится", "HTTP и диск имеют одинаковую границу по определению", "Закон требует всегда p99 вместо среднего", "Нужны средние и одинаковая граница учёта"], "answer": 3, "explanation": "Закон Литтла связывает согласованные средние величины стабильной системы.", "reason": {"options": ["Соотношение связывает средние величины одной системы с общей границей учёта", "Ошибка только в единицах измерения", "Формула применима к любым согласованным по времени показателям, включая процентили"], "answer": 0}}, {"id": "M18-1", "module": 18, "kind": "concept", "stem": "Вариант A быстрее по среднему, B лучше по p99. Как выбрать?", "options": ["Всегда по максимальному IOPS, полученному в любом из прогонов", "По количеству знаков после запятой", "По заданной нагрузке и SLO и цене компромисса, сохранив оба показателя", "Всегда по минимальному среднему независимо от требований"], "answer": 2, "explanation": "Выбор требует требований, а не универсального победителя одной метрики.", "reason": {"options": ["Победителя определяет требование к сервису", "Хвост распределения важнее среднего в любой системе", "Среднее полнее описывает поведение системы"], "answer": 0}}, {"id": "M18-2", "module": 18, "kind": "concept", "stem": "Две версии сервиса сравнили на разных наборах запросов и объявили ускорение. Как проверить вывод?", "options": ["Сравнить только максимальную загрузку процессора", "Повторить измерение на одинаковой нагрузке и одинаковой границе учёта", "Взять лучший прогон каждой версии", "Сравнить число потоков без измерения задержек"], "answer": 1, "explanation": "Эксперимент требует одинаковой нагрузки, условий и границы измерения. Иначе изменение результата нельзя приписать версии сервиса.", "reason": {"options": ["Любой прирост пропускной способности доказывает ускорение", "Без одинаковых условий эффект версии не измерен.", "Среднее время ответа достаточно при разных смесях запросов"], "answer": 1}}, {"id": "R18", "module": 18, "kind": "calculation", "stem": "В M/M/1 интенсивность обслуживания 2000/с. Сравните среднее W при λ=1000, 1800 и 1980/с. Назовите два предположения модели.", "explanation": "1 мс, 5 мс, 50 мс. Предположения: пуассоновский поток заявок, экспоненциальное обслуживание, один сервер, стационарность и λ<μ; реальные системы могут им не соответствовать.", "fields": [{"label": "W при 1000, мс", "answer": 1}, {"label": "W при 1800, мс", "answer": 5}, {"label": "W при 1980, мс", "answer": 50}]}, {"id": "M19-0", "module": 19, "kind": "concept", "stem": "Что не доказывает успешный снимок VM?", "options": ["Возможность наличия crash-consistent точки", "Фиксацию состояния по контракту конкретной технологии снимков", "Зависимость части снимков от исходного хранилища", "Восстановление после потери того же физического хранилища"], "answer": 3, "explanation": "Независимость резервной копии проверяется по сценарию отказа и реальному восстановлению.", "reason": {"options": ["Снимок фиксирует состояние в пределах того же хранилища", "Снимок — это полная копия, по определению независимая от исходного хранилища", "Снимок обеспечивает согласованность приложения, поскольку выполняется мгновенно"], "answer": 0}}, {"id": "M19-1", "module": 19, "kind": "concept", "stem": "Почему увеличение vCPU с 2 до 16 может ухудшить задержку?", "options": ["Больше виртуальных процессоров всегда уменьшает задержку отклика приложения", "Могут вырасти конкуренция в планировщике и накладные расходы и нарушиться локальность", "Число виртуальных процессоров не может влиять ни на что, кроме счёта", "Виртуальные процессоры автоматически создают новые физические ядра"], "answer": 1, "explanation": "Размер конфигурации согласуют с параллелизмом и ресурсами хоста.", "reason": {"options": ["Увеличение числа виртуальных процессоров всегда сокращает задержку за счёт параллелизма", "Виртуальные процессоры не создают физических ядер", "Виртуальные процессоры закрепляются за физическими ядрами"], "answer": 1}}, {"id": "M19-2", "module": 19, "kind": "concept", "stem": "Виртуальная машина простаивает по собственным счётчикам CPU, но задержка выросла при одновременной нагрузке соседних VM. Где искать причину?", "options": ["Только в файловой системе гостя", "В ожидании планирования vCPU на перегруженном хосте", "В длине имени виртуальной машины", "В сетевом адресе гостя, независимо от хоста"], "answer": 1, "explanation": "vCPU выполняется на физических ресурсах хоста. При переподписке и одновременном спросе гость может ждать планирования, даже если его собственная работа мала.", "reason": {"options": ["Гость всегда видит всю конкуренцию хоста как загрузку своих процессов", "Виртуализация отменяет планирование физических процессоров", "Время гостя зависит от доступности физического CPU и конкуренции соседних VM"], "answer": 2}}, {"id": "R19", "module": 19, "kind": "calculation", "stem": "Хост 96 GiB, резерв 12 GiB, VM по 7 GiB. Найдите максимум без переподписки памяти. Почему это ещё не итоговый расчёт конфигурации?", "explanation": "floor((96−12)/7)=12 VM до дополнительных накладных расходов. Ещё нужны CPU, диски, сеть, пиковый рабочий набор и ёмкость при отказе.", "fields": [{"label": "Количество VM", "answer": 12}]}, {"id": "M20-0", "module": 20, "kind": "concept", "stem": "SLO задан долей успешных запросов. Как вычислить бюджет ошибок?", "options": ["Сложить p99 всех серверов и разделить на их количество", "Использовать только exporter доступности", "Всегда взять 43,2 минуты независимо от запроса", "Число допустимых запросов умножить на разрешённую долю ошибок"], "answer": 3, "explanation": "Бюджет на основе доли запросов не переводится автоматически во время простоя.", "reason": {"options": ["Долю успешных запросов достаточно умножить на длительность периода", "Бюджет ошибок всегда выражается временем недоступности за период", "Бюджет, заданный долей запросов, считается от их количества"], "answer": 2}}, {"id": "M20-1", "module": 20, "kind": "concept", "stem": "Задание резервного копирования зелёное. Какое доказательство необходимо для RTO?", "options": ["Размер исходного каталога, делённый на скорость восстановления", "Наличие снимка VM на том же диске", "Только код завершения копирования", "Полное измеренное восстановление сервиса с проверкой и зависимостями"], "answer": 3, "explanation": "RTO включает путь до снова работоспособного сервиса, а не только копирование.", "reason": {"options": ["Время возврата равно длительности копирования, поскольку восстановление симметрично", "Успешное завершение задания копирования доказывает пригодность копии к восстановлению", "Время возврата измеряется по всему пути до снова работающего сервиса"], "answer": 2}}, {"id": "M20-2", "module": 20, "kind": "concept", "stem": "CPU выше 80% ночью, но пользовательский сервис исправен. Как улучшить оповещение?", "options": ["Отключить все метрики CPU", "Связать сигнал с пользовательским результатом и скоростью расхода бюджета ошибок", "Считать любое высокое значение CPU инцидентом", "Увеличить интервал опроса до суток"], "answer": 1, "explanation": "Сигнал о загрузке ресурса полезен как диагностический контекст. Оповещение об инциденте привязывают к SLO и пользовательскому результату, чтобы не будить дежурного без воздействия на сервис.", "reason": {"options": ["Порог без цели качества даёт ложные сигналы.", "Одна метрика ресурса всегда точнее измерения сервиса", "Все ночные события можно безопасно игнорировать"], "answer": 0}}, {"id": "R20", "module": 20, "kind": "calculation", "stem": "За 30 суток было 3 млн допустимых запросов; SLO 99,95%. Найдите бюджет ошибок и расход бюджета при 1800 ошибках. Не переводите ответ во время простоя без дополнительной модели.", "explanation": "1500 ошибок; 1800/1500=120% бюджета. SLO на основе доли запросов не определяет минуты простоя напрямую.", "fields": [{"label": "Бюджет ошибок", "answer": 1500}, {"label": "Расход бюджета, %", "answer": 120}]}, {"id": "M21-0", "module": 21, "kind": "concept", "stem": "Как передать переменное число аргументов без повторного разбора оболочкой?", "options": ["Убрать все кавычки для удобства", "Передать вывод ls через подстановку команды", "Склеить строку и выполнить eval", "Использовать массив Bash и раскрытие \"${args[@]}\""], "answer": 3, "explanation": "Массив сохраняет границы аргументов; eval вводит новый уровень интерпретации.", "reason": {"options": ["Повторный разбор строки безопасен", "Массив сохраняет границы аргументов при раскрытии", "Кавычки при раскрытии мешают разделению аргументов"], "answer": 1}}, {"id": "M21-1", "module": 21, "kind": "concept", "stem": "grep вернул 1. Что следует заключить?", "options": ["Код возврата не имеет значения, если вывод команды не пустой", "Любая команда с 1 аварийно испортила данные", "Совпадений нет по контракту grep, это не то же самое, что ошибка чтения", "Совпадение обязательно найдено"], "answer": 2, "explanation": "Ожидаемые ненулевые статусы обрабатывают явно; grep 2 — ошибка.", "reason": {"options": ["Ненулевой код возврата входит в контракт команды", "Любой ненулевой код завершения означает ошибку выполнения", "Код завершения отражает только наличие вывода в стандартный поток"], "answer": 0}}, {"id": "M21-2", "module": 21, "kind": "concept", "stem": "Скрипт обработки файлов ломается на именах с пробелами. Что в нём исправить в первую очередь?", "options": ["Запретить пробелы в именах на уровне соглашения", "Взять подстановки переменных в кавычки и не разбирать вывод ls", "Перевести скрипт на Python, где проблемы нет", "Добавить экранирование пробелов при создании файлов"], "answer": 1, "explanation": "Разделение слов в оболочке происходит после подстановки: без кавычек одно имя превращается в несколько аргументов. Кавычки и обход через find -print0 или глоб решают это в самой оболочке; смена языка и запреты на имена — обход проблемы, а не её понимание.", "reason": {"options": ["Оболочка не приспособлена к обработке файлов вовсе", "Подстановка без кавычек проходит разделение слов и раскрытие шаблонов", "Имена файлов должны подчиняться соглашениям проекта"], "answer": 1}}, {"id": "R21", "module": 21, "kind": "calculation", "stem": "Функция оболочки печатает `$1`, выполняет `shift`, затем вызывает `timeout 15 \"$@\"`. Её вызывают как `run printf '%s\\n' hello`. Сколько элементов останется в `\"$@\"` после shift? Исправьте передачу аргументов и назовите код возврата исправленного вызова GNU timeout, если команда не уложится в лимит.", "explanation": "В функцию пришло три элемента: printf, строка формата и hello. После shift их два, и первым аргументом timeout становится строка формата — её он попробует исполнить как программу. Истечение лимита GNU coreutils timeout по умолчанию даёт код 124. Для журнала можно напечатать команду через `printf \"%q \" \"$@\"; printf \"\\n\"`, а для запуска передать исходный массив аргументов без shift: `timeout 15 \"$@\"`. Код завершения сохраняют явно.", "fields": [{"label": "Количество элементов в \"$@\" после shift", "answer": 2}, {"label": "Код возврата timeout при истечении лимита", "answer": 124}]}, {"id": "M22-0", "module": 22, "kind": "concept", "stem": "Запрос POST на создание VM завершился по timeout. Что безопаснее?", "options": ["Удалить все виртуальные машины с похожим именем и создать одну заново", "Считать виртуальную машину точно не созданной и повторить запрос", "Повторять новые запросы POST до появления ответа с кодом успеха от сервера", "Проверить идентификатор операции или ключ идемпотентности"], "answer": 3, "explanation": "Результат операции неизвестен; ответ мог потеряться после применения.", "reason": {"options": ["Отсутствие ответа означает, что операция не выполнена", "Повторный запрос безопасен всегда, поскольку сервер отбрасывает дубликаты", "Истечение времени ожидания ничего не говорит о судьбе операции"], "answer": 2}}, {"id": "M22-1", "module": 22, "kind": "concept", "stem": "Почему capture_output=True недостаточно для ограниченного сборщика?", "options": ["Он автоматически делает дочерний процесс работающим только на чтение", "Он может накопить неограниченный объём до завершения", "Он всегда ограничивает stdout 1 KiB", "Он отключает stderr"], "answer": 1, "explanation": "Timeout ограничивает время, но не автоматически объём памяти.", "reason": {"options": ["Ограничение по времени прерывает процесс раньше, чем объём вывода станет заметным", "Захват вывода ограничивает его фиксированным буфером", "Ограничение по времени не ограничивает объём"], "answer": 2}}, {"id": "M22-2", "module": 22, "kind": "concept", "stem": "Скрипт на Python запускает системную команду и молча продолжает работу при её отказе. Что изменить?", "options": ["Перенаправить вывод команды в журнал и читать его вручную", "Проверять код возврата и решать по нему, а не по наличию вывода", "Запускать команду через оболочку, чтобы ошибки попадали в вывод", "Добавить повтор запуска на случай временного отказа"], "answer": 1, "explanation": "Код возврата — единственный формальный признак успеха; вывод бывает пустым и при удаче, и при провале. Повторы и журналирование полезны, но они не заменяют проверку, из-за отсутствия которой ошибка и осталась незамеченной.", "reason": {"options": ["Запуск через оболочку делает ошибки видимыми", "Повтор запроса устраняет большинство отказов", "Успех команды определяется её кодом возврата, а не содержимым вывода"], "answer": 2}}, {"id": "R22", "module": 22, "kind": "calculation", "stem": "API выдаёт 75 объектов на страницу, всего 302. Сколько страниц нужно? POST закончился timeout: сформулируйте безопасную последовательность вместо безусловного повторного создания.", "explanation": "5 страниц: 75+75+75+75+2. При timeout проверить идентификатор операции или созданный ресурс либо повторить запрос по документированному ключу идемпотентности; не выдавать новый независимый запрос на создание.", "fields": [{"label": "Количество страниц", "answer": 5}]}, {"id": "M23-0", "module": 23, "kind": "concept", "stem": "Как доказывают идемпотентность playbook?", "options": ["Одним успешным первым запуском без повторного применения роли", "Повторным применением к достигнутому состоянию", "Добавлением ignore_errors ко всем задачам роли и повторным её применением", "Наличием расширения .yml у файла роли и её успешной загрузкой"], "answer": 1, "explanation": "Сходимость и отсутствие повторных побочных эффектов — наблюдаемые свойства.", "reason": {"options": ["Идемпотентность обеспечивает сам инструмент", "Идемпотентность — наблюдаемое свойство", "Успешный первый запуск доказывает идемпотентность, поскольку состояние достигнуто"], "answer": 1}}, {"id": "M23-1", "module": 23, "kind": "concept", "stem": "Что ограничивает check mode?", "options": ["Он заменяет канареечную партию независимо от системы и её зависимостей", "Он всегда проверяет здоровье всех зависимостей перед применением", "Поддержка модулей, условные зависимости и невыполнение части эффектов", "Он гарантирует любые реальные побочные эффекты применённых ролей"], "answer": 2, "explanation": "Симуляция — часть цепочки проверки, не полная квалификация.", "reason": {"options": ["Режим проверки воспроизводит все побочные эффекты, не сохраняя их", "Режим проверки заменяет постепенную выкладку, поскольку показывает итоговое состояние", "Симуляция ограничена поддержкой модулей и эффектов не выполняет"], "answer": 2}}, {"id": "M23-2", "module": 23, "kind": "concept", "stem": "Шаблон конфигурации Ansible не изменился, но обработчик перезапуска службы всё равно сработал. Что проверить?", "options": ["Увеличить число forks", "Какая задача отправляет notify и почему она сообщает changed без изменения состояния", "Удалить все обработчики из playbook", "Запускать playbook только один раз"], "answer": 1, "explanation": "Обработчик запускается по уведомлению задачи, которая сообщила changed. На повторном прогоне неизменная конфигурация должна сходиться к ok, иначе перезапуск становится ложным эффектом.", "reason": {"options": ["Срабатывание определяется сообщением changed у уведомившей задачи", "Обработчик запускается по расписанию независимо от задач", "Повторный запуск всегда обязан перезапускать сервис"], "answer": 0}}, {"id": "R23", "module": 23, "kind": "calculation", "stem": "Playbook применяется к 30 узлам при forks=5, один узел обрабатывается 12 с. Сколько волн выполнения и сколько секунд займёт прогон? На втором запуске он сообщает changed=0, но HTTP отвечает 503: какое свойство подтверждено частично, какое нет?", "explanation": "30/5=6 волн по 12 с=72 с без учёта сбора фактов и разброса времени узлов. changed=0 частично подтверждает сходимость выбранных задач, но не здоровье сервиса: playbook описывает только то, что в нём написано. Проверить хеш конфигурации и фактическую привязку, журналы сервиса и зависимостей, сквозной запрос и данные.", "fields": [{"label": "Количество волн по forks", "answer": 6}, {"label": "Время прогона, с", "answer": 72}]}, {"id": "M24-0", "module": 24, "kind": "concept", "stem": "Контейнер видит 127.0.0.1. К чему обычно относится адрес?", "options": ["К шлюзу по умолчанию контейнера", "К любой БД в Compose по умолчанию", "Всегда к физическому хосту, на котором запущен этот контейнер", "К его сетевому namespace, если namespace не разделён специально"], "answer": 3, "explanation": "Loopback принадлежит конкретному сетевому namespace.", "reason": {"options": ["Внутри контейнера петлевой адрес перенаправляется на шлюз по умолчанию", "Петлевой адрес принадлежит конкретному сетевому пространству имён", "Петлевой адрес всегда указывает на хост, поскольку принадлежит физическому интерфейсу"], "answer": 1}}, {"id": "M24-1", "module": 24, "kind": "concept", "stem": "Образ контейнера закреплён digest. Что ещё нужно для восстановления БД?", "options": ["Состояние тома и копии, ключи, совместимость схемы и проверка восстановления", "Повторно скачать тот же образ и запустить контейнер с чистого состояния", "Считать образ полной копией текущих пользовательских данных", "Удалить все тома перед запуском и дать приложению создать их заново"], "answer": 0, "explanation": "Образ фиксирует программу и начальный слой, а не текущие данные БД.", "reason": {"options": ["Образ фиксирует программу и начальное содержимое слоёв", "Закрепление образа по контрольной сумме фиксирует и данные, поскольку слои неизменяемы", "Данные восстанавливаются повторным запуском того же образа, который создаёт их заново"], "answer": 0}}, {"id": "M24-2", "module": 24, "kind": "concept", "stem": "Контейнер пересоздан, и данные приложения исчезли. Что было сделано неверно?", "options": ["Образ собран без слоя с данными", "Данные лежали в слое контейнера, а не в томе или примонтированном каталоге", "Контейнер остановили, не сохранив его состояние", "Не был задан перезапуск контейнера при отказе"], "answer": 1, "explanation": "Записываемый слой живёт ровно столько, сколько сам контейнер. Переживает пересоздание только то, что лежит вне его: именованный том или каталог хоста. Это не свойство конкретного движка, а следствие модели образов и слоёв.", "reason": {"options": ["Образ должен содержать данные приложения", "Время жизни данных определяется тем, где они лежат, а не как остановлен контейнер", "Политика перезапуска сохраняет состояние контейнера"], "answer": 1}}, {"id": "R24", "module": 24, "kind": "calculation", "stem": "Контейнер имеет cpu.max 150000/100000 и memory.max 512 MiB. Что означает CPU-квота? Может ли он получить OOM при 10 GiB свободной памяти хоста?", "explanation": "1,5 CPU-времени на период в среднем, а не физическое закрепление. OOM возможен по memory cgroup; нужны memory.events и контекст ошибки.", "fields": [{"label": "Средний лимит CPU-времени, CPU", "answer": 1.5}]}, {"id": "M25-0", "module": 25, "kind": "concept", "stem": "Что важно при переносе артефакта из тестовой среды в рабочую?", "options": ["Проверять только одинаковое имя файла", "Удалять манифест после теста", "Всегда пересобирать с новейшими зависимостями", "Продвигать тот же digest, отделяя параметры среды"], "answer": 3, "explanation": "Квалификация привязана к конкретному артефакту.", "reason": {"options": ["Совпадения имени и версии достаточно, чтобы считать артефакт тем же", "Пересборка из тех же исходников даёт эквивалентный артефакт", "Проверки относятся к конкретному собранному артефакту"], "answer": 2}}, {"id": "M25-1", "module": 25, "kind": "concept", "stem": "Почему Terraform plan не вечная гарантия apply?", "options": ["Внешнее состояние и зависимости могут измениться после расчёта", "Любой drift автоматически безопасен", "Расчёт плана уже выполнил все изменения в целевой инфраструктуре", "State не связан с реальными объектами"], "answer": 0, "explanation": "План относится к снимку наблюдаемого состояния; результат применения проверяют отдельно.", "reason": {"options": ["План закрепляет изменения, поэтому их применение уже предопределено", "Файл состояния не связан с реальными объектами", "План — это разница со снимком, сделанным в момент его построения"], "answer": 2}}, {"id": "M25-2", "module": 25, "kind": "concept", "stem": "Образ подписан доверенным издателем. Что эта подпись не доказывает?", "options": ["Что артефакт связан с издателем", "Что код в образе не содержит ошибок и безопасен при выполнении", "Что можно проверить неизменность подписанных байтов", "Что образ имеет определённый дайджест"], "answer": 1, "explanation": "Подпись связывает издателя и артефакт, но не доказывает корректность или безопасность кода. Нужны отдельные тесты и проверки зависимостей.", "reason": {"options": ["Подпись выполняет все проверки конвейера автоматически", "Дайджест меняется при каждом скачивании образа", "Происхождение артефакта и правильность его поведения — разные утверждения"], "answer": 2}}, {"id": "R25", "module": 25, "kind": "calculation", "stem": "Конвейер пересобирает образ на каждом из трёх стендов (dev, staging, production) из одного и того же commit: staging квалифицировал digest A, production получил B. Сколько различных артефактов подлежит независимой квалификации при такой схеме и сколько при build-once? Спроектируйте изменение конвейера.", "explanation": "При сборке на каждом стенде это три разных артефакта — по одному digest на стенд, и квалификация каждого не переносится на остальные. При build-once артефакт один: его собирают, квалифицируют и продвигают неизменным. Один и тот же commit не гарантирует одинаковый digest: различаются базовые образы, версии инструментов и временные метки. Собрать один раз, сохранить digest и происхождение, развернуть A; B квалифицировать отдельно, если он вообще нужен.", "fields": [{"label": "Количество артефактов при сборке на каждом стенде", "answer": 3}, {"label": "Количество артефактов при build-once", "answer": 1}]}, {"id": "M26-0", "module": 26, "kind": "concept", "stem": "Pod Running, Service без endpoints. Где искать?", "options": ["Namespace, селектор и метки, готовность и согласование EndpointSlice", "Считать Service исправным из-за Running", "Только в настройках прошивки узла, где запущен этот кластер", "Только в fsck корневой файловой системы"], "answer": 0, "explanation": "Фаза Pod не гарантирует, что он стал конечной точкой Service.", "reason": {"options": ["Фаза жизненного цикла и участие в наборе адресов сервиса", "Запущенный экземпляр включается в сервис автоматически", "Отсутствие адресов означает, что экземпляр не запустился, несмотря на показанную фазу"], "answer": 0}}, {"id": "M26-1", "module": 26, "kind": "concept", "stem": "Что планировщик обычно использует для размещения по ресурсам?", "options": ["Текущее значение из вывода top на узле кластера", "Только размер образа контейнера", "Число строк в манифесте YAML", "Requests и ограничения вместе с allocatable"], "answer": 3, "explanation": "Requests влияют на допуск и размещение, limits — на исполнение; это разные функции.", "reason": {"options": ["Заявленные потребности и ограничения", "Планировщик выбирает узел по наименьшей текущей загрузке процессора", "Размещение считается по заявленным потребностям и доступному объёму узла"], "answer": 2}}, {"id": "M26-2", "module": 26, "kind": "concept", "stem": "API Kubernetes принял новое желаемое состояние Deployment. Что можно утверждать сразу после ответа API?", "options": ["Объект принят, а контроллеры ещё могут выполнять изменение асинхронно", "Все новые Pods уже готовы к трафику", "Старая версия уже удалена со всех узлов", "Планировщик подтвердил работоспособность приложения"], "answer": 0, "explanation": "Контроллеры Kubernetes согласуют наблюдаемое состояние с желаемым асинхронно. Принятый объект не означает завершённый развёртывание или готовность приложения.", "reason": {"options": ["Контроллеры асинхронны; готовность проверяют отдельно.", "Ответ API всегда означает, что проверка готовности пройдена", "etcd хранит только уже работающие Pods"], "answer": 0}}, {"id": "R26", "module": 26, "kind": "calculation", "stem": "Узел имеет 7,5 CPU allocatable, Pod request 2 CPU. Сколько таких Pods размещается по CPU? Для работающих Pods Service имеет пустые EndpointSlices: какие три факта проверяются?", "explanation": "3 Pod по CPU, остаётся 1,5 CPU. Проверить namespace, селектор и метки, готовность и согласование EndpointSlice; после появления конечных точек проверить targetPort и слушающий сокет.", "fields": [{"label": "Количество Pods", "answer": 3}]}, {"id": "M27-0", "module": 27, "kind": "concept", "stem": "Как связаны UEFI и PI?", "options": ["UEFI — это только графическая программа настройки", "UEFI задаёт внешний контракт, PI", "PI — протокол передачи Ethernet кадров", "Каждая UEFI реализация обязана иметь точно тот же внутренний код EDK2"], "answer": 1, "explanation": "Не следует объявлять внутренние SEC/PEI/DXE обязательной реализацией любого UEFI.", "reason": {"options": ["Внешний контракт описывает только интерфейс настройки для человека", "Внешний контракт для операционной системы и внутренняя модель инициализации", "Соответствие внешнему контракту требует именно этой внутренней реализации"], "answer": 1}}, {"id": "M27-1", "module": 27, "kind": "concept", "stem": "Что даёт measured boot само по себе?", "options": ["Шифрование всех дисков", "Гарантированное отсутствие уязвимостей", "Измерения и факты для оценки состояния", "Полную замену политики Secure Boot"], "answer": 2, "explanation": "Измерение, аттестация и применение политики допуска — разные шаги.", "reason": {"options": ["Измерение останавливает запуск кода, не совпавшего с ожидаемым значением", "Измерение фиксирует, что было запущено", "Измерение заменяет проверку подписи, поскольку значение зависит от содержимого"], "answer": 1}}, {"id": "M27-2", "module": 27, "kind": "concept", "stem": "В реализации EDK2 и PI память ещё не подготовлена. Какая фаза передаёт сведения об обнаруженном оборудовании к DXE?", "options": ["BDS выбирает загрузочную запись до подготовки памяти", "PEI готовит ранние ресурсы и передаёт сведения через HOB", "Операционная система публикует HOB после запуска", "UEFI тре
