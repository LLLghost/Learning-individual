<script type="application/json" id="lab-code-data">"#!/usr/bin/env python3\n\"\"\"Работы практикума: подготовка, сбор фактов, откат. Python 3.9+, стандартная библиотека.\n\nВАЖНО. Для работ с внесением инцидента init МЕНЯЕТ настройки учебного стенда.\nСкрипт отказывается работать без метки учебного стенда, никогда не трогает\nуправляющую сеть и умеет вернуть изменённое (restore).\n\nОтчёт не содержит вердикта: сверяет факты учебник. Файл отчёта лежит на вашей\nмашине и может быть отредактирован — это инструмент честной самопроверки.\n\n    python3 course_lab.py list\n    python3 course_lab.py init L13B ./work\n    # решаете задачу, заполняете ./work/answer.json\n    python3 course_lab.py collect L13B ./work\n\"\"\"\nimport argparse\nimport datetime as dt\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport statistics\nimport subprocess\nimport sys\n\nVERSION = '2'\nMARKER = Path('/etc/course-lab-stand')\n# Номер стенда подставляет учебник при скачивании. Пустой — скрипт работает на\n# любой машине, где метка заведена; заполненный — только на своём стенде.\nSTAND_ID = ''\nREPORT = 'lab-report.json'\nANSWER = 'answer.json'\nSTATE = 'lab-state.json'\n\n\n# ---------- общее ----------\n\ndef run(command, timeout=15):\n    \"\"\"Читающая команда. Ошибка не исключение: отсутствующая утилита должна\n    отличаться от неудачной проверки, иначе обе выглядят как «не получилось».\"\"\"\n    try:\n        done = subprocess.run(command, capture_output=True, text=True, timeout=timeout, check=False)\n        return {'cmd': ' '.join(command), 'rc': done.returncode, 'out': done.stdout + done.stderr}\n    except FileNotFoundError:\n        return {'cmd': ' '.join(command), 'rc': None, 'out': 'утилита не найдена'}\n    except subprocess.TimeoutExpired:\n        return {'cmd': ' '.join(command), 'rc': None, 'out': f'превышено время {timeout} с'}\n\n\ndef evidence(result, pattern=None, limit=3):\n    lines = [line for line in result['out'].splitlines() if line.strip()]\n    if pattern:\n        lines = [line for line in lines if re.search(pattern, line)] or lines[:1]\n    return {'cmd': result['cmd'], 'rc': result['rc'],\n            'sha256': hashlib.sha256(result['out'].encode()).hexdigest(),\n            'excerpt': ' / '.join(lines[:limit])[:300]}\n\n\ndef load_json(result):\n    try:\n        return json.loads(result['out'])\n    except (ValueError, TypeError):\n        return None\n\n\ndef pairs(text):\n    \"\"\"Вывод вида KEY=value: systemctl show, mdadm --export, timedatectl show.\"\"\"\n    found = {}\n    for line in text.splitlines():\n        if '=' in line:\n            key, _, value = line.partition('=')\n            found[key.strip()] = value.strip()\n    return found\n\n\ndef nearest_rank(values, percent):\n    ordered = sorted(values)\n    index = max(1, -(-len(ordered) * percent // 100))\n    return ordered[int(index) - 1]\n\n\ndef sha256_file(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\ndef stand_guard(require_root=True):\n    if not MARKER.exists():\n        raise SystemExit(f'Нет метки учебного стенда {MARKER}. Скрипт не работает на чужой машине.')\n    # Метка одна на всех и лежит по известному пути: сама по себе она отличает\n    # стенд только от машины, где её забыли завести. Номер кладёт в гостей\n    # скрипт сборки стенда, а сюда — учебник при скачивании. Это защита от\n    # ошибки, а не от намерения: проверку в своём файле сотрёт кто угодно.\n    if STAND_ID:\n        here = MARKER.read_text(encoding='utf-8', errors='replace').strip()\n        if here != STAND_ID:\n            raise SystemExit(\n                f'Скрипт выпущен для стенда {STAND_ID}, а на этой машине '\n                f'{here or \"номера нет\"}. Сверьте: cat {MARKER}. Если стенд '\n                f'тот самый, перевыпустите скрипт в кабинете.')\n    if require_root and hasattr(os, 'geteuid') and os.geteuid() != 0:\n        raise SystemExit('Для внесения и отката инцидента нужны права root.')\n\n\ndef link_names():\n    \"\"\"Все интерфейсы, кроме петлевого.\"\"\"\n    data = load_json(run(['ip', '-j', 'link'])) or []\n    return [entry.get('ifname') for entry in data if entry.get('ifname') and entry.get('ifname') != 'lo']\n\n\ndef iface_of_address(address):\n    data = load_json(run(['ip', '-j', '-4', 'addr'])) or []\n    for entry in data:\n        for info in entry.get('addr_info') or []:\n            if info.get('local') == address:\n                return entry.get('ifname')\n    return None\n\n\ndef default_route_iface():\n    data = load_json(run(['ip', '-j', 'route', 'show', 'default'])) or []\n    for entry in data:\n        if entry.get('dev'):\n            return entry['dev']\n    return None\n\n\ndef resolve_ifaces(args, strict=True):\n    \"\"\"Имя интерфейса не зашивается в умолчания. Прежние 'eth1' и 'eth0' взяты\n    с машины о двух интерфейсах, а на стенде главы 0 у гостей он один и зовётся\n    eth0: preflight отвечал «Интерфейс eth1 не найден», а на честное --iface eth0\n    — «указан интерфейс управляющей сети». Обе стендовые работы не запускались\n    вовсе. Адрес узла задан планом главы и от имён интерфейсов не зависит, по\n    нему и ищем.\"\"\"\n    names = link_names()\n    mgmt = args.mgmt or default_route_iface()\n    iface = args.iface\n    if iface and iface not in names:\n        raise SystemExit(f'Интерфейс {iface} не найден. Есть: {\", \".join(names) or \"ни одного\"}.')\n    if not iface:\n        iface = iface_of_address(args.local)\n    if not iface and len(names) == 1:\n        iface = names[0]\n    if not iface:\n        if not strict:\n            return None, mgmt\n        raise SystemExit(\n            f'Не удалось определить интерфейс стенда: адреса {args.local} нет ни на одном. '\n            f'Укажите --iface явно, есть: {\", \".join(names) or \"ни одного\"}.')\n    return iface, mgmt\n\n\ndef guard_iface(iface, mgmt):\n    \"\"\"Управляющий интерфейс защищается только тогда, когда он отдельный. У\n    гостя с единственным интерфейсом защищать нечего: отказ там означал бы, что\n    работу нельзя выполнить нигде.\"\"\"\n    names = link_names()\n    if iface == mgmt and len(names) > 1:\n        raise SystemExit('Указан интерфейс управляющей сети. Работы его не трогают.')\n    if iface == mgmt:\n        print(f'Интерфейс {iface} единственный, через него же идёт ваш доступ. '\n              f'Работа его не разрывает, откат возвращает исходное состояние.')\n    else:\n        print(f'Интерфейс {iface} есть, управляющий {mgmt or \"не определён\"} не затрагивается.')\n\n\ndef hand_back(folder):\n    \"\"\"init стендовой работы идёт под root, а заполняет ответ и собирает отчёт\n    обычный пользователь. Без возврата владельца answer.json оказывался закрыт\n    на запись ровно тому, кому предназначен: «Permission denied» на первом же\n    шаге после внесения инцидента.\"\"\"\n    uid, gid = os.environ.get('SUDO_UID'), os.environ.get('SUDO_GID')\n    if uid is None or gid is None or not hasattr(os, 'chown'):\n        return\n    for path in [folder, *folder.iterdir()]:\n        try:\n            os.chown(path, int(uid), int(gid))\n        except OSError:\n            pass\n\n\ndef seed_variant(seed, count):\n    return int(hashlib.sha256(seed.encode()).hexdigest(), 16) % count\n\n\n# ---------- наборы данных ----------\n\ndef _timings():\n    \"\"\"Один и тот же замер в двух единицах: файл A в секундах, файл B в\n    миллисекундах. Несопоставимость надо заметить до сравнения, а не после.\"\"\"\n    base = [31, 33, 30, 44, 32, 35, 31, 58, 34, 33, 30, 36, 31, 41, 32,\n            33, 30, 39, 34, 31, 37, 32, 30, 52, 33, 31, 35, 30, 38, 32]\n    a = '\\n'.join(f'{value / 1000:.3f}' for value in base) + '\\n'\n    b = '\\n'.join(f'{value + 2}.0' for value in base) + '\\n'\n    return a, b\n\n\nDATASETS = {\n    'L00B': lambda: {\n        'run-a.txt': _timings()[0],\n        'run-b.txt': _timings()[1],\n        'README.txt': 'Два файла с временами одного и того же запроса, снятые разными людьми.\\n'\n                      'Единицы записать забыли. Определите, какой файл в миллисекундах,\\n'\n                      'приведите оба к одной шкале и посчитайте p90 методом ближайшего ранга\\n'\n                      'по всем 60 значениям (в миллисекундах, один знак после запятой).\\n'\n                      'ms_file — буква файла в миллисекундах: a или b.\\n'\n                      'comparable_as_is — сопоставимы ли файлы без приведения (true/false).\\n',\n    },\n    'L01A': lambda: {\n        'README.txt': 'Стенд не нужен. Вычислите на Python:\\n'\n                      '  shifted = (0xB4 >> 2) & 7\\n'\n                      \"  data = bytes.fromhex('78563412')\\n\"\n                      \"  little = int.from_bytes(data, 'little')\\n\"\n                      \"  big    = int.from_bytes(data, 'big')\\n\"\n                      'Значения little и big запишите строкой вида 0x12345678.\\n',\n    },\n    'L09B': lambda: {\n        'numa.txt': 'Замеры задержки доступа к памяти, наносекунды, одна и та же нагрузка.\\n'\n                    'node0 -> node0   82.4\\n'\n                    'node0 -> node1  139.6\\n'\n                    'node1 -> node1   83.1\\n'\n                    'node1 -> node0  141.2\\n'\n                    'Процесс закреплён на node0, память выделена на node1.\\n',\n        'README.txt': 'Процесс закреплён на node0, память выделена на node1.\\n'\n                      'remote_ns — задержка именно этого доступа, числом из файла.\\n'\n                      'ratio — во сколько раз он дороже локального для node0, один знак.\\n'\n                      'idle_means_free — можно ли по низкой средней загрузке процессора\\n'\n                      'заключить, что машина недогружена (true/false).\\n',\n    },\n    'L10B': lambda: {\n        'os.log': '2026-03-14T02:11:03Z kernel: nvme nvme0: I/O 12 QID 3 timeout, aborting\\n'\n                  '2026-03-14T02:11:09Z kernel: nvme nvme0: Abort status: 0x371\\n'\n                  '2026-03-14T02:11:14Z kernel: EXT4-fs (nvme0n1p2): remounting filesystem read-only\\n'\n                  '2026-03-14T02:11:21Z systemd[1]: app.service: Main process exited, status=1/FAILURE\\n'\n                  '2026-03-14T02:11:45Z kernel: Kernel panic - not syncing: hung task in D state\\n',\n        'bmc.log': '2026-03-14T02:12:45Z PSU1 Power Supply: Predictive Failure - asserted\\n'\n                   '2026-03-14T02:13:15Z SYS  System Restart: initiated by watchdog\\n'\n                   '2026-03-14T02:13:31Z SYS  Power Cycle: chassis control command\\n',\n        'README.txt': 'Часы контроллера управления и часы системы идут по-разному.\\n'\n                      'Приведите журналы к одной шкале и решите, доказан ли блок питания\\n'\n                      'как первопричина. psu_after_seconds — на сколько секунд сигнал питания\\n'\n                      'позже первой записи ОС об отказе после приведения к одной шкале.\\n',\n    },\n    'L17A': lambda: {\n        'ceph-status.txt': '  cluster:\\n    health: HEALTH_WARN\\n            Degraded data redundancy: 118/354 objects degraded\\n'\n                           '  services:\\n    mon: 3 daemons, quorum mon-a,mon-b (age 12m), out of quorum: mon-c\\n'\n                           '    mgr: mon-a(active)\\n    osd: 6 osds: 5 up, 6 in\\n',\n        'ceph-pool.txt': \"pool 'app' replicated size 3 min_size 2 crush_rule 0 pg_num 128\\n\"\n                         'rule 0: step chooseleaf firstn 0 type host\\n',\n        'osd-tree.txt': 'ID CLASS WEIGHT  TYPE NAME\\n-1       6.00000 root default\\n'\n                        '-3       2.00000     host ceph-1\\n 0   hdd 1.00000         osd.0   up\\n 1   hdd 1.00000         osd.1   up\\n'\n                        '-5       2.00000     host ceph-2\\n 2   hdd 1.00000         osd.2   up\\n 3   hdd 1.00000         osd.3   up\\n'\n                        '-7       2.00000     host ceph-3\\n 4   hdd 1.00000         osd.4   up\\n 5   hdd 1.00000       osd.5 down\\n',\n        'README.txt': 'mon_quorum — сколько мониторов сейчас в кворуме (не сколько запущено).\\n'\n                      'replica_size, min_size — из параметров пула.\\n'\n                      'failure_domain — тип домена отказа из правила CRUSH, одним словом.\\n',\n    },\n    'L29B': lambda: {\n        'firmware-matrix.txt': 'настройка            до      после   потребитель      тёплая  холодная\\n'\n                               'SR-IOV               off     on      драйвер vf       да      да\\n'\n                               'Above 4G Decoding    on      on      перечисление     да      да\\n'\n                               'C-states             C6      C1      планировщик      да      нет\\n'\n                               'Secure Boot          on      on      загрузчик        да      да\\n',\n        'README.txt': 'unproven_setting — настройка, изменение которой не переживает холодную\\n'\n                      'перезагрузку: именно она объясняет «после перезапуска стенда всё\\n'\n                      'вернулось». Имя возьмите из первой колонки как есть.\\n'\n                      'survives_cold_boot — сохраняется ли она (true/false).\\n',\n    },\n    'L33A': lambda: {\n        'chain.txt': 'Цепочка зависимостей учебного сервиса, доступность каждого звена:\\n'\n                     'коммутатор доступа   0.9990\\n'\n                     'маршрутизатор        0.9995\\n'\n                     'узел приложения      0.9950\\n'\n                     'СХД                  0.9999\\n'\n                     'Звенья последовательны: отказ любого роняет сервис.\\n',\n        'README.txt': 'chain_availability — доступность всей цепочки, четыре знака после запятой.\\n'\n                      'weakest_link — слабое звено одним словом из файла: коммутатор,\\n'\n                      'маршрутизатор, узел или СХД.\\n',\n    },\n    'L02B': lambda: {\n        'vmstat.txt': 'procs -----------memory---------- ---system-- ------cpu-----\\n'\n                      ' r  b   swpd   free   buff  cache   in    cs  us sy id wa\\n'\n                      ' 1  3      0 812344  18240 921044  1204  2210   4  2 61 33\\n'\n                      ' 0  4      0 811920  18240 921180  1180  2154   3  2 60 35\\n'\n                      ' 1  4      0 811644  18244 921320  1211  2199   4  2 59 35\\n',\n        'ps.txt': '  PID  PPID STAT WCHAN            CMD\\n'\n                  ' 2411  2410 S    pipe_read        producer.py\\n'\n                  ' 2412  2410 D    wait_on_page_bit consumer.py\\n'\n                  ' 2418  2410 D    wait_on_page_bit writer.py\\n'\n                  ' 2420  2410 D    io_schedule      flusher.py\\n'\n                  ' 2431     1 S    hrtimer_nanosle  sleep\\n',\n        'README.txt': 'Производитель остановился, загрузка процессора низкая.\\n'\n                      'blocked — сколько задач в колонке b по последней строке vmstat.\\n'\n                      'producer_state — буква состояния процесса producer.py из ps.txt.\\n'\n                      'cpu_is_bottleneck — упирается ли система в процессор (true/false).\\n',\n    },\n    'L03B': lambda: {\n        'smaps.txt': 'Три процесса одного приложения, значения в MiB:\\n'\n                     'PID   RSS   PSS   Shared_Clean  Private\\n'\n                     '3101  300   180   240           60\\n'\n                     '3102  300   180   240           60\\n'\n                     '3103  300   180   240           60\\n'\n                     'Все три делят один и тот же набор разделяемых страниц.\\n',\n        'README.txt': 'rss_sum_mib — сумма RSS трёх процессов, целое число.\\n'\n                      'physical_mib — сколько физической памяти занято на самом деле, целое.\\n'\n                      'rss_sum_is_usage — можно ли считать сумму RSS расходом памяти (true/false).\\n',\n    },\n    'L05B': lambda: {\n        'cmdline.txt': 'BOOT_IMAGE=/vmlinuz-6.1.0 root=UUID=6f1b2c3d-1111-4aaa-9bbb-0123456789ab ro quiet\\n',\n        'blkid.txt': '/dev/vda2: UUID=\"6f1b2c3d-1111-4aaa-9bbb-0123 onds': None, 'open_fds': None, 'state_shows_cpu_use': None},\n    'L03A': {'size_mib': None, 'links_after_unlink': None, 'freed_mib': None, 'df_changed_on_unlink': None, 'frees_space': None},\n    'L04B': {'failing_mount': None, 'boot_stage': None, 'grub_at_fault': None, 'fix_option': None},\n    'L05A': {'root_uuid': None, 'cmdline_names_uuid': None, 'same_object': None, 'stable_identifier': None},\n    'L06A': {'arp_target': None, 'next_hop_mac': None, 'ping_dst_ip': None, 'arp_for_destination': None},\n    'L07A': {'client_port': None, 'server_port': None, 'data_segment_number': None, 'bytes_missing': None, 'ok_means_intact': None},\n    'L08A': {'reachable_pairs': None, 'pvid_linux3': None, 'crossvlan_works': None, 'needs_for_crossvlan': None},\n    'L09A': {'logical_cpus': None, 'physical_cores': None, 'sibling_of_cpu2': None, 'slowdown': None, 'machine_is_limited': None},\n    'L10A': {'driver': None, 'numa_node': None, 'numa_known': None, 'link_speed_known': None, 'enumeration_proves_function': None},\n    'L11B': {'guest_has_shutdown_record': None, 'gap_seconds': None, 'initiator': None, 'proves_psu_failure': None},\n    'L12B': {'serial_sdb_before': None, 'name_after': None, 'sdb_is_same_disk': None, 'stable_key': None},\n    'L13A': {'lv_size_mib': None, 'df_size_mib': None, 'overhead_mib': None, 'vg_free_gib': None, 'df_shows_lv_size': None},\n    'L14A': {'members': None, 'spares': None, 'array_size_gib': None, 'raw_sum_gib': None, 'mirror_adds_capacity': None},\n    'L15B': {'pause_seconds': None, 'decided_by': None, 'data_lost': None, 'app_saw_error': None},\n    'L16A': {'snapshot_name': None, 'used_by_snapshot_mib': None, 'refer_changed': None, 'freed_by_delete': None},\n    'L17B': {'quorum_needed': None, 'parts_with_quorum_2_1': None, 'parts_with_quorum_1_1_1': None, 'writes_possible_2_1': None, 'lowering_min_size_helps': None},\n    'L18A': {'best_iops_depth': None, 'latency_growth': None, 'iops_growth': None, 'depth32_is_better': None},\n    'L19B': {'same_mac': None, 'safe_to_join_network': None, 'survives_storage_loss': None, 'checks_failed': None},\n    'L20B': {'detection_minutes': None, 'total_minutes': None, 'rto_met': None, 'data_lost_minutes': None, 'rpo_met': None},\n    'L21B': {'probes_done': None, 'runaway_probe': None, 'output_gib': None, 'report_usable': None, 'silent_permission_loss': None},\n    'L22A': {'ok_probes': None, 'missing_tool': None, 'nonzero_probe': None, 'truncated_bytes': None, 'partial_is_failure': None},\n    'L23B': {'converged_hosts': None, 'unchecked_hosts': None, 'drift_detected': None, 'template_applied': None, 'zero_changes_means_healthy': None},\n    'L24B': {'survived_path': None, 'lost_path': None, 'writable_layer_persists': None, 'oom_cause': None, 'host_memory_was_low': None},\n    'L25B': {'replaced_count': None, 'in_place_count': None, 'data_at_risk': None, 'replacement_is_safe_update': None, 'marker': None},\n    'L26A': {'endpoints_count': None, 'ready_pods': None, 'selector_value': None, 'label_value': None, 'readiness_is_the_cause': None},\n    'L27A': {'arch': None, 'module_type': None, 'entry_point': None, 'sha_prefix': None, 'build_proves_run': None},\n    'L28B': {'changed_step': None, 'unchanged_bdf': None, 'driver_changed': None, 'window_kib': None, 'proves_real_board': None},\n    'L29A': {'tables_from_this_boot': None, 'stale_table': None, 'cpus_match': None, 'numa_nodes': None, 'decompile_means_execute': None},\n    'L30A': {'changed_claim': None, 'cipher_changed': None, 'was_encrypted_before': None, 'proves_server_not_compromised': None, 'proves_right_server': None},\n    'L31B': {'offset_seconds': None, 'network_ms': None, 'offset_precision_ms': None, 'order_established': None},\n    'L32B': {'breaking_rate': None, 'restore_minutes': None, 'point_gap_minutes': None, 'lag_seconds_is_data': None},\n    'L33B': {'switch_seconds': None, 'target_met': None, 'shared_element': None, 'branches_independent': None, 'redundancy_returned': None},\n    'L34B': {'lost_fact': None, 'downtime_minutes': None, 'checkable_actions': None, 'restart_helped': None},\n    'L35B': {'sum_matches': None, 'old_service_share_percent': None, 'operations_lost': None, 'id_collision_risk': None, 'first_step': None},\n    'L36A': {'criteria_met': None, 'broken_criterion_numbers': None, 'metrics_age_minutes': None, 'ready_to_start': None},\n}\n\nHINTS = {\n    'L04A': 'exit_status — числовой статус, с которым юнит упал из-за несуществующего WorkingDirectory.',\n    'L06B': 'wrong_prefix — длина префикса, из-за которой удалённый адрес считался локальным.',\n    'L07B': 'path_mtu — найденный MTU участка.',\n    'L12A': 'device — имя вида sdb, serial — его серийный номер из lsblk.',\n    'L13B': 'lv_size_mib — размер логического тома после расширения, gap_seen — видели ли вы расхождение LV и FS. '\n            'Контрольный файл — control.bin в точке монтирования: его сумма снимается до работы и сверяется после.',\n    'L14B': 'failed_member — устройство, помеченное отказавшим (например /dev/sdc1).',\n    'L16B': 'snapshot — полное имя снимка в исходном пуле (tank/app@before); '\n            'received — полное имя того же снимка в принимающем пуле; '\n            'restored_file — путь к файлу, восстановленному в принимающем пуле.',\n    'L30B': 'error_without_root — текст ошибки openssl, пока корень не добавлен в хранилище.',\n    'L31A': 'drift_ppm — измеренный собственный дрейф в ppm, знак сохраните.',\n}\n\n\n# ---------- сбор фактов со стенда ----------\n\n# Идентификаторы сообщений systemd о юните. Журнал спрашивается по ним, а не по\n# тексту: текст переводится на язык системы, идентификатор — нет.\nUNIT_STARTING = '7d4958e842da4a758f6c1cdc7b36dcc5'\nUNIT_STARTED = '39f53479d3a045ac8e11786248231fbf'\nUNIT_FAILURE = 'be02cf6855d2428ba40df7e9d022f03d'\n\n\ndef journal_ids(unit):\n    \"\"\"Идентификаторы сообщений о юните за эту загрузку.\"\"\"\n    out = run(['journalctl', '-u', unit, '-b', '-o', 'json', '--no-pager'], timeout=30)\n    found = []\n    for line in out['out'].splitlines():\n        try:\n            found.append(json.loads(line).get('MESSAGE_ID'))\n        except ValueError:\n            continue\n    return found, out\n\n\ndef probe_L04A(state, answer):\n    unit = state.get('unit', 'course-report.service')\n    verify = run(['systemd-analyze', 'verify', f'/etc/systemd/system/{unit}'])\n    show = run(['systemctl', 'show', '-p', 'ActiveState,SubState,Result,ExecMainStatus,DropInPaths,WorkingDirectory', unit])\n    values = pairs(show['out'])\n    # Состояние выполнения берётся из журнала, а не из systemctl show. Юнит типа\n    # oneshot после завершения выгружается, и show отвечает про него значениями\n    # по умолчанию: Result=success и нулевой статус — у того, кто ни разу не\n    # запускался, ровно те же. Проверено на стенде.\n    ids, log = journal_ids(unit)\n    facts = {\n        'verify_rc': verify['rc'],\n        'active_state': values.get('ActiveState'),\n        'result': values.get('Result'),\n        'has_dropin': bool(values.get('DropInPaths')),\n        'ran': UNIT_STARTING in ids,\n        'succeeded': UNIT_STARTED in ids,\n        'failure_seen': UNIT_FAILURE in ids,\n    }\n    return facts, [evidence(verify), evidence(show, r'ActiveState|Result|DropInPaths'),\n                   {'cmd': f'journalctl -u {unit} -b -o json', 'rc': log['rc'],\n                    'sha256': hashlib.sha256(log['out'].encode()).hexdigest(),\n                    'excerpt': ' / '.join(x for x in ids if x)[:200]}]\n\n\ndef probe_L06B(state, answer):\n    peer = state['peer']\n    route = run(['ip', '-j', 'route', 'get', peer])\n    neigh = run(['ip', '-j', 'neigh'])\n    route_data = load_json(route) or []\n    neigh_data = load_json(neigh) or []\n    # Запись FAILED — след прошлых попыток разрешения, а не текущее поведение:\n    # она остаётся в таблице и после того, как маршрут снова пошёл через шлюз,\n    # и по ней работа, сделанная правильно, выглядела несделанной.\n    alive = [entry for entry in neigh_data\n             if entry.get('dst') == peer and 'FAILED' not in (entry.get('state') or [])]\n    facts = {\n        'route_via_gateway': bool(route_data and route_data[0].get('gateway')),\n        'arp_for_remote': bool(alive),\n    }\n    return facts, [evidence(route), evidence(neigh, re.escape(peer))]\n\n\ndef probe_L07B(state, answer):\n    iface, peer = state['iface'], state['peer']\n    link = run(['ip', '-j', 'link', 'show', 'dev', iface])\n    link_data = load_json(link) or []\n    trace = run(['tracepath', '-n', peer], timeout=40)\n    payload = probe_df_payload(peer)\n    fetch = run(['curl', '-sS', '--max-time', '20', '-o', '/dev/null', '-w', '%{http_code}',\n                 f'http://{peer}:8080/probe.bin'], timeout=25)\n    facts = {\n        'path_mtu': link_data[0].get('mtu') if link_data else None,\n        'df_max_payload': payload,\n        'handshake_ok': fetch['rc'] == 0,\n        'transfer_ok': fetch['out'].strip().endswith('200'),\n    }\n    return facts, [evidence(link, r'mtu'), evidence(trace, r'pmtu|hops'),\n                   {'cmd': f'ping -M do -s N {peer}', 'rc': 0,\n                    'sha256': hashlib.sha256(str(payload).encode()).hexdigest(),\n                    'excerpt': f'наибольшая прошедшая нагрузка: {payload}'}]\n\n\ndef probe_df_payload(peer, low=1000, high=1500):\n    \"\"\"Двоичный поиск, а не перебор: на стенде каждый пробник — это ожидание.\"\"\"\n    best = None\n    while low <= high:\n        middle = (low + high) // 2\n        done = run(['ping', '-M', 'do', '-c', '1', '-W', '2', '-s', str(middle), peer], timeout=6)\n        if done['rc'] == 0:\n            best, low = middle, middle + 1\n        else:\n            high = middle - 1\n    return best\n\n\ndef probe_L12A(state, answer):\n    listing = run(['lsblk', '-J', '-o', 'NAME,TYPE,SIZE,MODEL,SERIAL,WWN,FSTYPE,MOUNTPOINTS'])\n    data = load_json(listing) or {}\n    claimed = str(answer.get('device', '')).replace('/dev/', '')\n    found, system = None, False\n    for disk in data.get('blockdevices', []):\n        if disk.get('name') == claimed:\n            found = disk\n        if any((point or '') == '/' for point in (disk.get('mountpoints') or [])) or any(\n                (point or '') == '/' for child in disk.get('children', []) for point in (child.get('mountpoints') or [])):\n            system = system or disk.get('name') == claimed\n    facts = {\n        'serial_of_claimed': (found or {}).get('serial'),\n        'claimed_is_system_disk': system,\n        'claimed_exists': found is not None,\n    }\n    return facts, [evidence(listing, claimed or r'NAME')]\n\n\ndef lv_size_mib(volume):\n    \"\"\"Размер логического тома в МиБ по данным lvs.\"\"\"\n    lvs = run(['sudo', '-n', 'lvs', '--reportformat', 'json', '--units', 'm', '-o', 'lv_path,lv_size'])\n    data = load_json(lvs) or {}\n    for report in data.get('report', []):\n        for row in report.get('lv', []):\n            if row.get('lv_path') == volume:\n                return round(float(str(row.get('lv_size', '0')).rstrip('mM'))), lvs\n    return None, lvs\n\n\ndef fs_size_mib(volume, mount):\n    \"\"\"Размер файловой системы в МиБ — её собственный, а не пригодное место.\n    df показывает место за вычетом метаданных: у ext4 на томе в гигабайт это\n    на 33 МиБ меньше самого тома, и сравнение «догнала ли ФС том» не сходилось\n    даже после честного resize2fs. Число блоков ФС с их размером даёт ровно\n    размер устройства.\"\"\"\n    info = run(['sudo', '-n', 'tune2fs', '-l', volume])\n    if info['rc'] == 0:\n        values = {}\n        for line in info['out'].splitlines():\n            if ':' in line:\n                key, _, value = line.partition(':')\n                values[key.strip()] = value.strip()\n        try:\n            return round(int(values['Block count']) * int(values['Block size']) / 1048576), info\n        except (KeyError, ValueError):\n            pass\n    xfs = run(['xfs_info', mount])\n    found = re.search(r'blocks=(\\d+),\\s*imaxpct', xfs['out'])\n    size = re.search(r'bsize=(\\d+)', xfs['out'])\n    if found and size:\n        return round(int(found.group(1)) * int(size.group(1)) / 1048576), xfs\n    space = run(['df', '-B', '1M', '--output=size', mount])\n    numbers = [int(x) for x in re.findall(r'\\b(\\d+)\\b', space['out'])]\n    return (numbers[-1] if numbers else None), space\n\n\ndef probe_L13B(state, answer):\n    volume = state.get('volume', '/dev/course/lvdata')\n    mount = state.get('mount', '/mnt/course-lvm')\n    size_mib, lvs = lv_size_mib(volume)\n    fs_mib, fs_source = fs_size_mib(volume, mount)\n    control = state.get('control_file') or answer.get('control_file') or f'{mount}/control.bin'\n    checksum = sha256_file(control) if Path(control).exists() else None\n    before_lv = state.get('lv_size_mib_before')\n    before_fs = state.get('fs_size_mib_before')\n    facts = {\n        'lv_size_mib': size_mib,\n        'fs_size_mib': fs_mib,\n        'sizes_match': size_mib is not None and fs_mib is not None and abs(size_mib - fs_mib) <= 8,\n        # Рост доказывается базовой линией, снятой до работы: размеры сходятся и\n        # у тома, который никто не расширял.\n        'lv_grew': bool(before_lv) and bool(size_mib) and size_mib > before_lv,\n        'fs_grew': bool(before_fs) and bool(fs_mib) and fs_mib > before_fs,\n        # Сумма сверяется с той, что снята до расширения, а не с той, которую\n        # читатель вписал сам: своя же сумма совпадает с собой всегда.\n        'checksum_same': bool(checksum) and checksum == state.get('control_sha256_before'),\n    }\n    return facts, [evidence(lvs, r'lv_size|lv_path'), evidence(fs_source),\n                   {'cmd': f'sha256sum {control}', 'rc': 0,\n                    'sha256': checksum or '',\n                    'excerpt': f'было {before_lv} МиБ / стало {size_mib} МиБ'}]\n\n\ndef kernel_log_since(since):\n    \"\"\"Сообщения ядра с отметки, снятой до работы. Журнал ядра не переводится,\n    поэтому искать в нём по тексту можно.\"\"\"\n    command = ['journalctl', '-k', '--no-pager']\n    if since:\n        command += ['--since', since]\n    return run(command, timeout=30)\n\n\ndef probe_L14B(state, answer):\n    array = str(state.get('array', 'md127')).replace('/dev/', '')\n    degraded = Path(f'/sys/block/{array}/md/degraded')\n    action = Path(f'/sys/block/{array}/md/sync_action')\n    detail = run(['sudo', '-n', 'mdadm', '--detail', '--export', f'/dev/{array}'])\n    values = pairs(detail['out'])\n    # Целый массив выглядит одинаково и после восстановления, и до всякой\n    # аварии: degraded=0, sync_action=idle, уровень и число участников те же.\n    # Отличает их только след в журнале ядра — и только он доказывает, что\n    # работа была сделана, а не массив просто собран.\n    log = kernel_log_since(state.get('started_at'))\n    lines = [line for line in log['out'].splitlines() if array in line]\n    claimed = str(answer.get('failed_member') or '').strip()\n    short = claimed.replace('/dev/', '')\n    members = [value for key, value in values.items() if key.endswith('_DEV')]\n    facts = {\n        'degraded': degraded.read_text().strip() if degraded.exists() else None,\n        'sync_action': action.read_text().strip() if action.exists() else None,\n        'level': values.get('MD_LEVEL'),\n        'members': values.get('MD_DEVICES'),\n        'failure_logged': any('Disk failure' in line for line in lines),\n        'recovery_logged': any('recovery of RAID array' in line for line in lines)\n                           and any('recovery done' in line for line in lines),\n        'claimed_member_back': bool(short) and claimed in members,\n    }\n    return facts, [evidence(detail, r'MD_LEVEL|MD_DEVICES'),\n                   {'cmd': f'/sys/block/{array}/md/degraded', 'rc': 0,\n                    'sha256': hashlib.sha256(str(facts['degraded']).encode()).hexdigest(),\n                    'excerpt': f'degraded={facts[\"degraded\"]} sync_action={facts[\"sync_action\"]}'},\n                   {'cmd': 'journalctl -k (события массива)', 'rc': log['rc'],\n                    'sha256': hashlib.sha256('\\n'.join(lines).encode()).hexdigest(),\n                    'excerpt': ' / '.join(line.split(': ', 1)[-1] for line in lines[-3:])[:300]}]\n\n\ndef snapshot_named(name, pool, known):\n    \"\"\"Полное имя снимка нужного пула, а не вхождение подстроки. Проверка\n    вхождением принимала пустое поле (пустая строка входит в любой текст) и\n    неполное имя: «tank/app» входит в «tank/app@before».\"\"\"\n    text = name.strip() if isinstance(name, str) else ''\n    dataset, separator, label = text.partition('@')\n    if not (separator and label):\n        return False\n    if not (dataset == pool or dataset.startswith(pool + '/')):\n        return False\n    return text in known\n\n\ndef scan_line(status):\n    \"\"\"Строка «scan:» из zpool status — по ней видно, что проверка целостности\n    запускалась заново, а не когда-то раньше.\"\"\"\n    for line in status['out'].splitlines():\n        if 'scan:' in line:\n            return line.strip()\n    return ''\n\n\ndef dataset_of(path, mounts):\n    \"\"\"Набор данных, на котором лежит путь: самая длинная совпавшая точка\n    монтирования. Нужен, чтобы отличить восстановленный файл от исходного.\"\"\"\n    target, best = str(path), ''\n    for mount, dataset in mounts.items():\n        if (target == mount or target.startswith(mount.rstrip('/') + '/')) and len(mount) > len(best):\n            best = mount\n    return mounts.get(best)\n\n\ndef probe_L16B(state, answer):\n    pool = state.get('pool', 'tank')\n    target = state.get('target_pool', 'backup')\n    health = run(['zpool', 'get', '-H', '-o', 'value', 'health', pool])\n    status = run(['zpool', 'status', pool], timeout=30)\n    snapshots = run(['zfs', 'list', '-H', '-t', 'snapshot', '-o', 'name'])\n    listing = run(['zfs', 'list', '-H', '-o', 'name,mountpoint'])\n    # Ошибка команды не должна выглядеть как «ничего не нашлось»: пустой ответ\n    # от упавшей утилиты — отсутствие сведений, а не отсутствие снимка.\n    known = {line.strip() for line in snapshots['out'].splitlines() if line.strip()} if snapshots['rc'] == 0 else set()\n    mounts = {}\n    if listing['rc'] == 0:\n        for line in listing['out'].splitlines():\n            parts = line.split('\\t')\n            if len(parts) == 2 and parts[1].startswith('/'):\n                mounts[parts[1]] = parts[0]\n    restored = answer.get('restored_file')\n    restored_path = Path(restored.strip()) if isinstance(restored, str) and restored.strip() else None\n    readable = bool(restored_path and restored_path.is_file())\n    restored_pool = (dataset_of(restored_path, mounts) or '').split('/')[0] if readable else None\n    facts = {\n        'health': health['out'].strip() if health['rc'] == 0 else None,\n        'scrub_finished': status['rc'] == 0 and 'scrub repaired' in status['out'],\n        'scrub_is_new': bool(scan_line(status)) and scan_line(status) != state.get('scan_before'),\n        'errors_zero': status['rc'] == 0 and 'with 0 errors' in status['out'],\n        'snapshot_present': snapshot_named(answer.get('snapshot'), pool, known),\n        'received_present': snapshot_named(answer.get('received'), target, known),\n        'pools_differ': bool(pool) and bool(target) and pool != target,\n        'restored_readable': readable,\n        'restored_pool': restored_pool,\n        'restored_on_target': readable and restored_pool == target,\n        'source_sha256': state.get('source_sha256'),\n        'restored_sha256': sha256_file(restored_path) if readable else None,\n    }\n    return facts, [evidence(health), evidence(status, r'scan:|errors'), evidence(snapshots), evidence(listing)]\n\n\ndef cert_field(path, what):\n    \"\"\"Субъект или издатель сертификата одной строкой, без ярлыка openssl.\"\"\"\n    out = run(['openssl', 'x509', '-noout', '-' + what, '-in', path])['out'].strip()\n    head = what + '='\n    return out[len(head):].strip() if out.startswith(head) else out\n\n\ndef probe_L30B(state, answer):\n    root = state.get('root', 'root.pem')\n    chain = state.get('cert', 'server.pem')\n    with_root = run(['openssl', 'verify', '-CAfile', root, chain])\n    without_root = run(['openssl', 'verify', chain])\n    san = run(['openssl', 'x509', '-noout', '-ext', 'subjectAltName', '-in', chain])\n    basic = run(['openssl', 'x509', '-noout', '-ext', 'basicConstraints', '-in', root])\n    # Цепочку доверия отличает от одиночного сертификата только издатель. Один\n    # самоподписанный сертификат, поданный и корнем, и цепочкой, проходит\n    # openssl verify -CAfile и не проходит без него — то есть выглядит в фактах\n    # ровно как настоящая цепочка. Проверено на стенде.\n    server_subject = cert_field(chain, 'subject')\n    server_issuer = cert_field(chain, 'issuer')\n    root_subject = cert_field(root, 'subject')\n    facts = {\n        'verify_ok': with_root['rc'] == 0,\n        'verify_without_root': without_root['rc'] == 0,\n        'san_present': 'DNS:' in san['out'] or 'IP Address:' in san['out'],\n        'server_self_signed': bool(server_subject) and server_subject == server_issuer,\n        'issued_by_root': bool(server_issuer) and server_issuer == root_subject,\n        'root_is_ca': 'CA:TRUE' in basic['out'].replace(' ', ''),\n    }\n    return facts, [evidence(with_root), evidence(without_root), evidence(san, r'DNS|IP'),\n                   {'cmd': f'openssl x509 -noout -subject -issuer -in {chain}', 'rc': 0,\n                    'sha256': hashlib.sha256((server_subject + '|' + server_issuer).encode()).hexdigest(),\n                    'excerpt': f'субъект: {server_subject} / издатель: {server_issuer}'[:300]}]\n\n\ndef chrony_drift_file():\n    \"\"\"Файл дрейфа chrony. Путь берётся из директивы driftfile, а не зашивается:\n    в Debian 12 файл называется chrony.drift, в других сборках — drift. С зашитым\n    именем факт «дрейф из файла» оставался пустым даже на работающем chrony, и\n    работа не сдавалась никогда — проверено на стенде.\"\"\"\n    for conf in (Path('/etc/chrony/chrony.conf'), Path('/etc/chrony.conf')):\n        if conf.exists():\n            for line in conf.read_text(encoding='utf-8', errors='replace').splitlines():\n                parts = line.split()\n                if len(parts) > 1 and parts[0] == 'driftfile':\n                    return Path(parts[1])\n    for name in ('/var/lib/chrony/chrony.drift', '/var/lib/chrony/drift'):\n        if Path(name).exists():\n            return Path(name)\n    return Path('/var/lib/chrony/chrony.drift')\n\n\ndef probe_L31A(state, answer):\n    tracking = run(['chronyc', '-c', 'tracking'])\n    # Службы времени на стенде держит systemd-timesyncd, и chrony может быть не\n    # установлен вовсе. Молча собранный отчёт из одних None выглядит нормальным\n    # файлом, а в кабинете становится «не зачтено» без объяснения причины.\n    if tracking['rc'] is None or (tracking['rc'] != 0 and not tracking['out'].strip()):\n        raise SystemExit('Для этой работы нужен chrony: sudo apt install -y chrony, '\n                         'дайте ему поработать, затем повторите collect. '\n                         'systemd-timesyncd собственного дрейфа не измеряет и файла поправки не ведёт.')\n    fields = tracking['out'].strip().split(',')\n    drift = chrony_drift_file()\n    measured = None\n    drift_read = run(['sudo', '-n', 'cat', str(drift)])\n    if drift_read['rc'] != 0:\n        drift_read = run(['cat', str(drift)])\n    if drift_read['rc'] == 0:\n        first = drift_read['out'].split()\n        measured = float(first[0]) if first else None\n    # Последнее поле chronyc -c tracking — Leap status. Только оно говорит о\n    # синхронизации: на узле без источника вывод разбирается на те же поля, и\n    # признак «строка прочиталась» оставался истинным при Not synchronised.\n    facts = {\n        'stratum': int(fields[2]) if len(fields) > 2 and fields[2].isdigit() else None,\n        'source': fields[1] if len(fields) > 1 else None,\n        'drift_ppm_file': measured,\n        'synchronised': len(fields) > 13 and fields[13].strip() == 'Normal',\n    }\n    return facts, [evidence(tracking),\n                   {'cmd': f'cat {drift}', 'rc': 0,\n                    'sha256': hashlib.sha256(str(measured).encode()).hexdigest(),\n                    'excerpt': f'дрейф из файла: {measured}'}]\n\n\nPROBES = {'L04A': probe_L04A, 'L06B': probe_L06B, 'L07B': probe_L07B, 'L12A': probe_L12A,\n          'L13B': probe_L13B, 'L14B': probe_L14B, 'L16B': probe_L16B, 'L30B': probe_L30B,\n          'L31A': probe_L31A}\n\n\n# ---------- внесение инцидента ----------\n\nL07B_MTU = [1400, 1280, 1420]\nL06B_PREFIX = [8, 16, 15]\n\n\ndef inject_L07B(state, args, dry):\n    before = load_json(run(['ip', '-j', 'link', 'show', 'dev', args.iface])) or []\n    original = before[0].get('mtu') if before else None\n    if original is None:\n        raise SystemExit(f'Не удалось прочитать MTU интерфейса {args.iface}.')\n    mtu = L07B_MTU[state['variant']]\n    plan = f'ip link set dev {args.iface} mtu {mtu}  (было {original})'\n    if dry:\n        return plan, None\n    done = run(['ip', 'link', 'set', 'dev', args.iface, 'mtu', str(mtu)])\n    if done['rc'] != 0:\n        raise SystemExit(f'Не удалось изменить MTU: {done[\"out\"].strip()[:200]}')\n    return plan, {'iface': args.iface, 'mtu_before': original}\n\n\ndef restore_L07B(state):\n    return run(['ip', 'link', 'set', 'dev', state['iface'], 'mtu', str(state['mtu_before'])])\n\n\ndef inject_L06B(state, args, dry):\n    prefix = L06B_PREFIX[state['variant']]\n    address = f'{args.local}/{prefix}'\n    plan = f'ip addr add {address} dev {args.iface}  (удалённый адрес станет локальным)'\n    if dry:\n        return plan, None\n    done = run(['ip', 'addr', 'add', address, 'dev', args.iface])\n    if done['rc'] != 0:\n        raise SystemExit(f'Не удалось добавить адрес: {done[\"out\"].strip()[:200]}')\n    return plan, {'iface': args.iface, 'address': address}\n\n\ndef restore_L06B(state):\n    \"\"\"Читатель, нашедший причину, снимает неверный адрес сам — это и есть\n    решение работы. Тогда откатывать нечего, а прежний безусловный del отвечал\n    «Откат не выполнен: Cannot assign requested address» ровно тому, кто всё\n    сделал правильно.\"\"\"\n    local, _, prefix = state['address'].partition('/')\n    for entry in load_json(run(['ip', '-j', '-4', 'addr', 'show', 'dev', state['iface']])) or []:\n        for info in entry.get('addr_info') or []:\n            if info.get('local') == local and str(info.get('prefixlen')) == prefix:\n                return run(['ip', 'addr', 'del', state['address'], 'dev', state['iface']])\n    return {'cmd': 'ip addr del ' + state['address'], 'rc': 0,\n            'out': '', 'note': 'Неверный адрес уже снят — стенд в исходном состоянии.'}\n\n\nINJECTORS = {'L07B': (inject_L07B, restore_L07B, len(L07B_MTU)),\n             'L06B': (inject_L06B, restore_L06B, len(L06B_PREFIX))}\n\n\n# ---------- реестр работ ----------\n\nLABS = {\n    'L00B': {'kind': 'dataset', 'module': 0, 'title': 'Смешанные единицы измерения'},\n    'L01A': {'kind': 'dataset', 'module': 1, 'title': 'Порядок байтов'},\n    'L04A': {'kind': 'collect', 'module': 4, 'title': 'Юнит systemd и его контекст'},\n    'L06B': {'kind': 'stand', 'module': 6, 'title': 'Неверный префикс и ARP'},\n    'L07B': {'kind': 'stand', 'module': 7, 'title': 'TCP и PMTU'},\n    'L09B': {'kind': 'dataset', 'module': 9, 'title': 'Локальная и удалённая память'},\n    'L10B': {'kind': 'dataset', 'module': 10, 'title': 'Две линии времени: ОС и BMC'},\n    'L12A': {'kind': 'collect', 'module': 12, 'title': 'Идентичность блочного устройства'},\n    'L13B': {'kind': 'collect', 'module': 13, 'title': 'LVM и расширение файловой системы'},\n    'L14B': {'kind': 'collect', 'module': 14, 'title': 'Деградация и восстановление RAID'},\n    'L16B': {'kind': 'collect', 'module': 16, 'title': 'Снимок ZFS и проверка целостности'},\n    'L17A': {'kind': 'dataset', 'module': 17, 'title': 'Кворум и реплики'},\n    'L29B': {'kind': 'dataset', 'module': 29, 'title': 'Матрица прошивок и регрессия'},\n    'L30B': {'kind': 'collect', 'module': 30, 'title': 'Цепочка доверия'},\n    'L31A': {'kind': 'collect', 'module': 31, 'title': 'Дрейф часов и поправка'},\n    'L33A': {'kind': 'dataset', 'module': 33, 'title': 'Доступность цепочки'},\n    'L02B': {'kind': 'dataset', 'module': 2, 'title': 'Обратное давление и состояние D'},\n    'L03B': {'kind': 'dataset', 'module': 3, 'title': 'Сумма RSS и разделяемые страницы'},\n    'L05B': {'kind': 'dataset', 'module': 5, 'title': 'Необязательный том и аварийная цель'},\n    'L08B': {'kind': 'dataset', 'module': 8, 'title': 'Политика пересылки и входящая цепочка'},\n    'L18B': {'kind': 'dataset', 'module': 18, 'title': 'Сравнение двух отчётов fio'},\n    'L20A': {'kind': 'dataset', 'module': 20, 'title': 'Показатель качества и пропущенные измерения'},\n    'L23A': {'kind': 'dataset', 'module': 23, 'title': 'Сходимость и непроверенные хосты'},\n    'L26B': {'kind': 'dataset', 'module': 26, 'title': 'Селектор, конечные точки и планирование'},\n    'L11A': {'kind': 'dataset', 'module': 11, 'title': 'Инвентарь наблюдения за узлом'},\n    'L15A': {'kind': 'dataset', 'module': 15, 'title': 'Один LUN, два пути'},\n    'L19A': {'kind': 'dataset', 'module': 19, 'title': 'Гость и хост меряют разное'},\n    'L21A': {'kind': 'dataset', 'module': 21, 'title': 'Сборщик теряет имя команды'},\n    'L22B': {'kind': 'dataset', 'module': 22, 'title': 'Страницы, повтор и неопределённый результат'},\n    'L24A': {'kind': 'dataset', 'module': 24, 'title': 'Один процесс, два номера'},\n    'L25A': {'kind': 'dataset', 'module': 25, 'title': 'Один коммит, три артефакта'},\n    'L27B': {'kind': 'dataset', 'module': 27, 'title': 'Собралось — не значит выполнилось'},\n    'L28A': {'kind': 'dataset', 'module': 28, 'title': 'Цепочка от таблицы до драйвера'},\n    'L32A': {'kind': 'dataset', 'module': 32, 'title': 'Среднее прячет хвост'},\n    'L34A': {'kind': 'dataset', 'module': 34, 'title': 'Три оповещения и три вопроса'},\n    'L35A': {'kind': 'dataset', 'module': 35, 'title': 'Точка невозврата и хвост клиентов'},\n    'L36B': {'kind': 'dataset', 'module': 36, 'title': 'Один симптом, несколько поломок'},\n    'L00A': {'kind': 'dataset', 'module': 0, 'title': 'Тридцать замеров и три ошибки'},\n    'L01B': {'kind': 'dataset', 'module': 1, 'title': 'Что именно измерил ваш замер'},\n    'L02A': {'kind': 'dataset', 'module': 2, 'title': 'Состояние процесса и потраченное время'},\n    'L03A': {'kind': 'dataset', 'module': 3, 'title': 'Имя удалено, место занято'},\n    'L04B': {'kind': 'dataset', 'module': 4, 'title': 'Загрузка встала не там, где кажется'},\n    'L05A': {'kind': 'dataset', 'module': 5, 'title': 'Три записи об одном корне'},\n    'L06A': {'kind': 'dataset', 'module': 6, 'title': 'Кого спрашивает ARP'},\n    'L07A': {'kind': 'dataset', 'module': 7, 'title': 'Соединение установлено — это не «файл получен»'},\n    'L08A': {'kind': 'dataset', 'module': 8, 'title': 'Матрица достижимости двух VLAN'},\n    'L09A': {'kind': 'dataset', 'module': 9, 'title': 'Восемь процессоров, четыре ядра'},\n    'L10A': {'kind': 'dataset', 'module': 10, 'title': 'Видно, привязано, работает'},\n    'L11B': {'kind': 'dataset', 'module': 11, 'title': 'Кто остановил узел'},\n    'L12B': {'kind': 'dataset', 'module': 12, 'title': 'После перестановки sdb — другой диск'},\n    'L13A': {'kind': 'dataset', 'module': 13, 'title': 'Пять слоёв над одним разделом'},\n    'L14A': {'kind': 'dataset', 'module': 14, 'title': 'Карта участников до аварии'},\n    'L15B': {'kind': 'dataset', 'module': 15, 'title': 'Пауза, а не потеря'},\n    'L16A': {'kind': 'dataset', 'module': 16, 'title': 'Снимок, набор данных и занятое место'},\n    'L17B': {'kind': 'dataset', 'module': 17, 'title': 'Кворум при двух разделениях'},\n    'L18A': {'kind': 'dataset', 'module': 18, 'title': 'Три глубины очереди одного диска'},\n    'L19B': {'kind': 'dataset', 'module': 19, 'title': 'Восстановлено или клонировано'},\n    'L20B': {'kind': 'dataset', 'module': 20, 'title': 'Что именно укладывается в RTO'},\n    'L21B': {'kind': 'dataset', 'module': 21, 'title': 'Сборщик, который не остановился'},\n    'L22A': {'kind': 'dataset', 'module': 22, 'title': 'Нет программы или ненулевой код'},\n    'L23B': {'kind': 'dataset', 'module': 23, 'title': 'Ноль изменений не значит «всё хорошо»'},\n    'L24B': {'kind': 'dataset', 'module': 24, 'title': 'Что переживёт пересоздание контейнера'},\n    'L25B': {'kind': 'dataset', 'module': 25, 'title': 'Обновление или замена'},\n    'L26A': {'kind': 'dataset', 'module': 26, 'title': 'Селектор, метка и конечная точка'},\n    'L27A': {'kind': 'dataset', 'module': 27, 'title': 'Что доказывает журнал сборки'},\n    'L28B': {'kind': 'dataset', 'module': 28, 'title': 'Что изменилось, а что осталось'},\n    'L29A': {'kind': 'dataset', 'module': 29, 'title': 'Таблицы одной загрузки'},\n    'L30A': {'kind': 'dataset', 'module': 30, 'title': 'До и после добавления корня'},\n    'L31B': {'kind': 'dataset', 'module': 31, 'title': 'Следствие раньше причины'},\n    'L32B': {'kind': 'dataset', 'module': 32, 'title': 'Отставание, которое перестало сокращаться'},\n    'L33B': {'kind': 'dataset', 'module': 33, 'title': 'Ветви, которые сходятся'},\n    'L34B': {'kind': 'dataset', 'module': 34, 'title': 'Хронология, написанная по ходу'},\n    'L35B': {'kind': 'dataset', 'module': 35, 'title': 'Записи пошли в два места'},\n    'L36A': {'kind': 'dataset', 'module': 36, 'title': 'Доказать, что было исправно'},\n}\n\n\n# ---------- базовая линия до попытки ----------\n# Работа со сбором фактов доказывает изменение, а не состояние: без снимка «как\n# было» завершённая когда-то проверка целостности и исходный файл выглядят\n# результатом текущей попытки.\n\ndef baseline_L16B(state, args):\n    status = run(['zpool', 'status', args.pool], timeout=30)\n    source = Path(args.file)\n    return {\n        'target_pool': args.target_pool,\n        'file': str(source),\n        'scan_before': scan_line(status),\n        'source_sha256': sha256_file(source) if source.is_file() else None,\n    }\n\n\ndef baseline_L13B(state, args):\n    \"\"\"Состояние тома до работы. Без него «том расширен» и «данные целы»\n    доказываются тем, что читатель сам же и вписал в ответ.\"\"\"\n    volume = args.volume\n    mount = args.mount\n    size_mib, _ = lv_size_mib(volume)\n    fs_mib, _ = fs_size_mib(volume, mount)\n    control = Path(f'{mount}/control.bin')\n    return {\n        'lv_size_mib_before': size_mib,\n        'fs_size_mib_before': fs_mib,\n        'control_file': str(control),\n        'control_sha256_before': sha256_file(control) if control.is_file() else None,\n    }\n\n\ndef baseline_L14B(state, args):\n    \"\"\"Отметка времени до работы: по ней в журнале ядра отличаются события этой\n    попытки от прошлых восстановлений и от сборки массива.\"\"\"\n    return {'started_at': dt.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n\n\nBASELINES = {'L13B': baseline_L13B, 'L14B': baseline_L14B, 'L16B': baseline_L16B}\n\n\ndef state_path(folder):\n    return folder / STATE\n\n\ndef cmd_list(args):\n    for name, lab in sorted(LABS.items()):\n        kind = {'dataset': 'без стенда', 'collect': 'сбор со стенда', 'stand': 'вносится инцидент'}[lab['kind']]\n        print(f'{name}  U{lab[\"module\"]:02d}  {lab[\"title\"]} — {kind}')\n    return 0\n\n\ndef cmd_preflight(args):\n    lab = LABS[args.lab]\n    if lab['kind'] == 'dataset':\n        print(f'{args.lab} — работа по набору данных, стенд не нужен.')\n        return 0\n    stand_guard(require_root=False)\n    print(f'Метка стенда {MARKER}: есть.')\n    if lab['kind'] == 'stand':\n        args.iface, args.mgmt = resolve_ifaces(args)\n        guard_iface(args.iface, args.mgmt)\n    print('Готово к работе.')\n    return 0\n\n\ndef cmd_init(args):\n    lab = LABS[args.lab]\n    folder = args.directory.resolve()\n    if state_path(folder).exists() and not args.dry_run:\n        raise SystemExit(f'{state_path(folder)} уже есть: сначала restore или выберите другой каталог.')\n    folder.mkdir(parents=True, exist_ok=True)\n    seed = args.seed or hashlib.sha256(os.urandom(16)).hexdigest()[:8]\n    state = {'lab': args.lab, 'seed': seed, 'variant': 0, 'kind': lab['kind']}\n\n    if lab['kind'] == 'stand':\n        stand_guard()\n        args.iface, args.mgmt = resolve_ifaces(args)\n        guard_iface(args.iface, args.mgmt)\n        _, _, variants = INJECTORS[args.lab]\n        state['variant'] = seed_variant(seed, variants)\n        state.update({'iface': args.iface, 'peer': args.peer})\n        plan, extra = INJECTORS[args.lab][0](state, args, args.dry_run)\n        if args.dry_run:\n            print('Будет выполнено:', plan)\n            return 0\n        print('Выполнено:', plan)\n        state.update(extra)\n    elif lab['kind'] == 'collect':\n        stand_guard(require_root=False)\n        args.iface, args.mgmt = resolve_ifaces(args, strict=False)\n        state.update({'iface': args.iface, 'peer': args.peer, 'unit': args.unit, 'array': args.array,\n                      'pool': args.pool, 'volume': args.volume, 'mount': args.mount,\n                      'root': args.root_cert, 'cert': args.cert})\n        if args.lab in BASELINES:\n            state.update(BASELINES[args.lab](state, args))\n        print(f'{args.lab}: инцидент не вносится, стенд не меняется. Выполните работу и заполните {ANSWER}.')\n    else:\n        for name, text in DATASETS[args.lab]().items():\n            (folder / name).write_text(text, encoding='utf-8')\n        print(f'Данные записаны в {folder}. Прочитайте README.txt.')\n\n    (folder / ANSWER).write_text(json.dumps(CLAIMS[args.lab], ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')\n    if args.lab in HINTS:\n        print('Подсказка по полям:', HINTS[args.lab])\n    state_path(folder).write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')\n    hand_back(folder)\n    print(f'Заполните {folder / ANSWER}, затем: course_lab.py collect {args.lab} {folder}')\n    if lab['kind'] == 'stand':\n        print(f'Откат: course_lab.py restore {args.lab} {folder}')\n    return 0\n\n\ndef cmd_restore(args):\n    folder = args.directory.resolve()\n    if not state_path(folder).exists():\n        raise SystemExit(f'Нет {STATE}: откатывать нечего.')\n    state = json.loads(state_path(folder).read_text(encoding='utf-8'))\n    if state['kind'] != 'stand':\n        print('Эта работа стенд не меняла: откатывать нечего.')\n        return 0\n    stand_guard()\n    done = INJECTORS[state['lab']][1](state)\n    if done['rc'] != 0:\n        raise SystemExit(f'Откат не выполнен: {done[\"out\"].strip()[:200]}')\n    print(done.get('note') or 'Внесённое изменение возвращено.')\n    return 0\n\n\ndef cmd_collect(args):\n    folder = args.directory.resolve()\n    if not state_path(folder).exists():\n        raise SystemExit(f'Нет {STATE}: сначала init. Базовая линия снимается до инцидента.')\n    state = json.loads(state_path(folder).read_text(encoding='utf-8'))\n    lab = LABS[state['lab']]\n    answer_file = folder / ANSWER\n    if not answer_file.exists():\n        raise SystemExit(f'Нет {ANSWER}: заполните его по README.txt.')\n    answer = json.loads(answer_file.read_text(encoding='utf-8'))\n    missing = [name for name, value in answer.items() if value is None]\n    if missing:\n        raise SystemExit('Не заполнены поля: ' + ', '.join(missing))\n\n    facts, proof = {}, []\n    if state['kind'] in ('stand', 'collect'):\n        stand_guard(require_root=False)\n        facts, proof = PROBES[state['lab']](state, answer)\n    else:\n        for name in sorted(DATASETS[state['lab']]()):\n            path = folder / name\n            if path.exists():\n                proof.append({'cmd': f'sha256sum {name}', 'rc': 0, 'sha256': sha256_file(path), 'excerpt': name})\n        facts = {'dataset_files': len(proof)}\n\n    report = {\n        'schema': 'course-lab-report', 'version': VERSION,\n        'lab': state['lab'], 'module': f'U{lab[\"module\"]:02d}', 'kind': state['kind'],\n        'seed': state['seed'], 'variant': state['variant'],\n        'collected_utc': dt.datetime.now(dt.timezone.utc).isoformat(),\n        'facts': facts, 'claim': answer, 'evidence': proof,\n        'collector_sha256': sha256_file(__file__),\n        'scope': 'факты с вашей машины; вердикт выносит учебник',\n    }\n    (folder / REPORT).write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')\n    print(f'Отчёт: {folder / REPORT}. Загрузите его в модуле U{lab[\"module\"]:02d} учебного кабинета.')\n    for name, value in facts.items():\n        print(f'  {name}: {value}')\n    return 0\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n    parser.add_argument('command', choices=['list', 'preflight', 'init', 'collect', 'restore'])\n    parser.add_argument('lab', nargs='?', choices=sorted(LABS), help='например L13B')\n    parser.add_argument('directory', type=Path, nargs='?', default=Path('./course-lab'))\n    parser.add_argument('--iface', help='интерфейс стенда; по умолчанию определяется по --local')\n    parser.add_argument('--mgmt', help='интерфейс управляющей сети: не трогается; по умолчанию берётся из маршрута по умолчанию')\n    parser.add_argument('--peer', default='10.10.20.12')\n    parser.add_argument('--local', default='10.10.10.11', help='свой адрес на интерфейсе стенда')\n    parser.add_argument('--unit', default='course-report.service')\n    parser.add_argument('--array', default='md127')\n    parser.add_argument('--pool', default='tank')\n    parser.add_argument('--target-pool', default='backup', help='принимающий учебный пул: не совпадает с --pool')\n    parser.add_argument('--file', default='/tank/app/control.bin', help='контрольный файл: его сумма снимается до попытки')\n    parser.add_argument('--volume', default='/dev/course/lvdata')\n    parser.add_argument('--mount', default='/mnt/course-lvm')\n    parser.add_argument('--root-cert', default='root.pem')\n    parser.add_argument('--cert', default='server.pem')\n    parser.add_argument('--seed', help='зерно варианта; по умолчанию случайное')\n    parser.add_argument('--dry-run', action='store_true', help='показать, что будет сделано')\n    args = parser.parse_args()\n    if args.command != 'list' and not args.lab:\n        raise SystemExit('Укажите работу, например: course_lab.py init L13B ./work')\n    return {'list': cmd_list, 'preflight': cmd_preflight, 'init': cmd_init,\n            'collect': cmd_collect, 'restore': cmd_restore}[args.command](args)\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\n"</script>
