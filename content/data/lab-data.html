,"df_size_mib":"4hmsrj","overhead_mib":"19ihsik","vg_free_gib":"p5zqjq"},"checks":[{"op":"hash","field":"lv_size_mib","label":"размер тома прочитан из lvs","note":"указано"},{"op":"hash","field":"df_size_mib","label":"размер по df прочитан отдельно","note":"указано"},{"op":"hash","field":"overhead_mib","label":"расхождение посчитано","note":"указано"},{"op":"hash","field":"vg_free_gib","label":"свободное место группы прочитано","note":"указано"},{"op":"claimEquals","field":"df_shows_lv_size","value":false,"label":"df не принят за размер тома","note":"указано"}],"why":{"q":"Почему df показывает 241 МиБ там, где lvs показывает 256?","options":["Потому что df считает в мегабайтах, а lvs в мебибайтах","Потому что часть тома ещё не размечена","Потому что 15 МиБ занято служебными структурами файловой системы","Потому что файл control.bin уже занял место"],"answer":2,"explanation":"Каждый слой отвечает на свой вопрос: pvs — сколько отдал раздел, lvs — сколько выделено тому, df — сколько файловая система готова отдать под файлы. Смешение этих чисел в одно «сколько места» и есть источник большинства ошибок при расширении: расширять приходится оба слоя по очереди."}},{"id":"L14A","title":"Карта участников до аварии","module":14,"kind":"dataset","salt":"l14a","intro":"Снимок здорового зеркала: состав, состояние и контрольные суммы. Эту базовую линию снимают до инцидента — после него уже не по чему отличить «так было» от «так стало».","commands":"python3 course_lab.py init L14A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L14A ./work","expect":{"members":"9dyalv","spares":"9xxhzt","array_size_gib":"ypqjcm","raw_sum_gib":"1tw5e20"},"checks":[{"op":"hash","field":"members","label":"состав массива прочитан","note":"указано"},{"op":"hash","field":"spares","label":"запасные устройства сосчитаны отдельно","note":"указано"},{"op":"hash","field":"array_size_gib","label":"полезный размер прочитан","note":"указано"},{"op":"hash","field":"raw_sum_gib","label":"суммарная сырая ёмкость посчитана","note":"указано"},{"op":"claimEquals","field":"mirror_adds_capacity","value":false,"label":"зеркало не принято за прибавку ёмкости","note":"указано"}],"why":{"q":"Зачем снимать этот снимок до аварии, а не после?","options":["Чтобы было что приложить к отчёту","Чтобы mdadm быстрее собирал массив","Чтобы знать номера устройств наизусть","Потому что после аварии состав и состояние уже изменены"],"answer":3,"explanation":"Диагностика — это сравнение с базовой линией. Сняв её заранее, вы отвечаете на вопрос «что изменилось»; без неё остаётся только «что сейчас», а этого для вывода о причине не хватает. Отдельно: [2/2] и [UU] относятся к избыточности, а не к целостности данных — её подтверждают суммы."}},{"id":"L15B","title":"Пауза, а не потеря","module":15,"kind":"dataset","salt":"l15b","intro":"Непрерывное чтение во время отключения одного пути. Приложение увидело паузу, а не ошибку — и по числам надо сказать, где эта пауза взялась и что она означает.","commands":"python3 course_lab.py init L15B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L15B ./work","expect":{"pause_seconds":"1po6wh8","decided_by":"2vm7z4"},"checks":[{"op":"hash","field":"pause_seconds","label":"длина паузы посчитана по отметкам","note":"указано"},{"op":"hash","field":"decided_by","label":"назван параметр, определивший паузу","note":"указано"},{"op":"claimEquals","field":"data_lost","value":false,"label":"целостность подтверждена суммой","note":"указано"},{"op":"claimEquals","field":"app_saw_error","value":false,"label":"пауза отличена от ошибки","note":"указано"}],"why":{"q":"Почему при no_path_retry queue приложение ждёт, а не получает ошибку?","options":["Потому что multipath переключает пути мгновенно","Потому что очередь запросов не может вернуть ошибку","Потому что queue означает «держать запросы в очереди, пока путь не найдётся»","Потому что ошибка возвращается только при записи"],"answer":2,"explanation":"Этот выбор — компромисс, а не улучшение: очередь спасает приложение от ошибки при коротком отказе, но при долгом превращает отказ в зависание, которое снаружи выглядит хуже явной ошибки. Поэтому длину ожидания задают осознанно, а не оставляют по умолчанию."}},{"id":"L16A","title":"Снимок, набор данных и занятое место","module":16,"kind":"dataset","salt":"l16a","intro":"Вывод zfs list с колонками USED, REFER и USEDSNAP до и после изменения файла. Три числа про место означают разное, и сумма их ничего не значит.","commands":"python3 course_lab.py init L16A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L16A ./work","expect":{"snapshot_name":"xjozd8","used_by_snapshot_mib":"qviy2u"},"checks":[{"op":"hash","field":"snapshot_name","label":"снимок назван полным именем","note":"указано"},{"op":"hash","field":"used_by_snapshot_mib","label":"место, удерживаемое снимком, прочитано","note":"указано"},{"op":"claimEquals","field":"refer_changed","value":false,"label":"REFER отличён от USED","note":"указано"},{"op":"claimEquals","field":"freed_by_delete","value":false,"label":"видно, что снимок держит старые блоки","note":"указано"}],"why":{"q":"Почему удаление файла не вернёт место, пока существует снимок?","options":["Потому что ZFS освобождает место с задержкой","Потому что снимок ссылается на прежние блоки","Потому что файл записан с включённым сжатием","Потому что USED считается по всему пулу"],"answer":1,"explanation":"Снимок — это не копия, а фиксация состояния: он ничего не занимает в момент создания и начинает занимать место по мере того, как данные под ним меняются. Отсюда и знакомая картина «файлы удалили, а место не вернулось»: снимки держат старые версии, и чистить надо их."}},{"id":"L17B","title":"Кворум при двух разделениях","module":17,"kind":"dataset","salt":"l17b","intro":"Политика кластера и два способа разбить его на части. Ответ считается, а не наблюдается: правило большинства не зависит от того, какая половина вам симпатичнее.","commands":"python3 course_lab.py init L17B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L17B ./work","expect":{"quorum_needed":"xyicf6","parts_with_quorum_2_1":"xej518","parts_with_quorum_1_1_1":"xoiqq7"},"checks":[{"op":"hash","field":"quorum_needed","label":"порог кворума посчитан от общего числа","note":"указано"},{"op":"hash","field":"parts_with_quorum_2_1","label":"разделение 2+1 разобрано","note":"указано"},{"op":"hash","field":"parts_with_quorum_1_1_1","label":"разделение 1+1+1 разобрано","note":"указано"},{"op":"claimEquals","field":"writes_possible_2_1","value":true,"label":"условие min_size проверено отдельно","note":"указано"},{"op":"claimEquals","field":"lowering_min_size_helps","value":false,"label":"снижение min_size не принято за решение","note":"указано"}],"why":{"q":"Что именно покупает снижение min_size с 2 до 1?","options":["Доступность записи ценой единственного экземпляра подтверждённых данных","Ускорение записи за счёт меньшего числа подтверждений","Устойчивость к разделению сети","Ничего: параметр влияет только на чтение"],"answer":0,"explanation":"min_size — это обещание долговечности: сколько копий должно существовать, чтобы запись считалась принятой. Снижая его, вы не чините кластер, а меняете обещание — и делать это надо осознанно и временно, записав, чем именно рискуете и когда вернёте прежнее значение."}},{"id":"L18A","title":"Три глубины очереди одного диска","module":18,"kind":"dataset","salt":"l18a","intro":"Три прогона чтения с одинаковыми параметрами и разной глубиной очереди. Пропускная способность, задержка и достигнутая глубина связаны законом, который виден прямо в числах.","commands":"python3 course_lab.py init L18A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L18A ./work","expect":{"best_iops_depth":"i54wte","latency_growth":"5ts24e","iops_growth":"1bia231"},"checks":[{"op":"hash","field":"best_iops_depth","label":"максимум пропускной способности найден","note":"указано"},{"op":"hash","field":"latency_growth","label":"рост задержки посчитан","note":"указано"},{"op":"hash","field":"iops_growth","label":"рост IOPS посчитан на том же переходе","note":"указано"},{"op":"claimEquals","field":"depth32_is_better","value":false,"label":"цена глубины очереди названа","note":"указано"}],"why":{"q":"Почему прогон с глубиной 32 нельзя объявить «лучшим результатом диска»?","options":["Потому что 32 — не степень двойки для этого устройства","Потому что при такой глубине падает пропускная способность","Потому что за 18% прироста IOPS заплачено трёхкратным ростом задержки","Потому что p99 не измеряется при глубине больше 8"],"answer":2,"explanation":"Глубина очереди — это не настройка диска, а описание нагрузки. Число в очереди ждёт своей очереди: устройство насыщается, и дальше растёт только время ожидания. Поэтому результаты сравнивают всегда тройкой — глубина, пропускная способность, задержка, — а одиночное «диск выдал 61 тысячу» ничего не значит."}},{"id":"L19B","title":"Восстановлено или клонировано","module":19,"kind":"dataset","salt":"l19b","intro":"Отчёт о восстановлении виртуальной машины из копии. Машина поднялась, приложение отвечает — и всё же половина проверок не пройдена, потому что восстановление проверяется не этим.","commands":"python3 course_lab.py init L19B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L19B ./work","expect":{"checks_failed":"1y3k7e0"},"checks":[{"op":"claimEquals","field":"same_mac","value":true,"label":"совпадение адресов замечено","note":"указано"},{"op":"claimEquals","field":"safe_to_join_network","value":false,"label":"конфликт в общей сети предвиден","note":"указано"},{"op":"claimEquals","field":"survives_storage_loss","value":false,"label":"снимок не принят за резервную копию","note":"указано"},{"op":"hash","field":"checks_failed","label":"невыполненные условия сосчитаны","note":"указано"}],"why":{"q":"Почему снимок на том же хранилище не является восстановлением после его потери?","options":["Потому что снимки нельзя переносить между машинами","Потому что снимок хранит только изменения","Потому что снимок живёт внутри того же объекта, отказ которого он должен был пережить","Потому что при восстановлении меняется идентификатор машины"],"answer":2,"explanation":"Копия проверяется вопросом «какой отказ она переживёт», а не «удалось ли развернуть». Снимок на том же хранилище защищает от ошибки внутри машины и не защищает от отказа хранилища; идентификатор и адрес второго уровня при этом обязаны быть новыми, иначе восстановленная машина ломает ту, ради которой её поднимали."}},{"id":"L20B","title":"Что именно укладывается в RTO","module":20,"kind":"dataset","salt":"l20b","intro":"Хронология учебного восстановления и заявленная цель. Сумма шагов и «время восстановления» — разные величины, и разница между ними решает, выполнена цель или нет.","commands":"python3 course_lab.py init L20B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L20B ./work","expect":{"detection_minutes":"17plie0","total_minutes":"9kimkk","data_lost_minutes":"9bl6h4"},"checks":[{"op":"hash","field":"detection_minutes","label":"время обнаружения отделено от восстановления","note":"указано"},{"op":"hash","field":"total_minutes","label":"общее время посчитано от отказа","note":"указано"},{"op":"claimEquals","field":"rto_met","value":false,"label":"цель по времени признана невыполненной","note":"указано"},{"op":"hash","field":"data_lost_minutes","label":"потеря данных посчитана по последней копии","note":"указано"},{"op":"claimEquals","field":"rpo_met","value":true,"label":"цель по потере данных проверена отдельно","note":"указано"}],"why":{"q":"Дежурный восстановил данные за 28 минут. Почему цель в 60 минут всё равно не выполнена?","options":["Потому что проверка целостности в RTO не входит","Потому что RTO считается от отказа","Потому что RPO важнее RTO","Потому что копия была снята в 03:05"],"answer":1,"explanation":"Пользователь считает простой от момента, когда перестало работать. Поэтому сокращать RTO обычно надо не там, где о нём думают: обнаружение и подъём дежурного часто занимают больше, чем сама процедура, и улучшаются они не скоростью восстановления, а оповещением и runbook."}},{"id":"L21B","title":"Сборщик, который не остановился","module":21,"kind":"dataset","salt":"l21b","intro":"Отчёт сборщика, у которого нет ни ограничения по времени, ни предела на объём. Одна команда на недоступном журнале сделала отчёт бесполезным — и это видно по его же цифрам.","commands":"python3 course_lab.py init L21B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L21B ./work","expect":{"probes_done":"1spzehd","runaway_probe":"1afzbj3","output_gib":"1sfzsse"},"checks":[{"op":"hash","field":"probes_done","label":"успевшие проверки сосчитаны","note":"указано"},{"op":"hash","field":"runaway_probe","label":"найдена проверка без предела","note":"указано"},{"op":"hash","field":"output_gib","label":"объём вывода переведён в гибибайты","note":"указано"},{"op":"claimEquals","field":"report_usable","value":false,"label":"непригодность отчёта зафиксирована","note":"указано"},{"op":"claimEquals","field":"silent_permission_loss","value":true,"label":"молчание о правах замечено","note":"указано"}],"why":{"q":"Почему сборщику нужен предел по объёму, а не только по времени?","options":["Потому что время измеряется неточно","Потому что команда может отдать гигабайты за секунды","Потому что журналы всегда больше других выводов","Потому что предел по объёму заменяет права доступа"],"answer":1,"explanation":"Ограничения ставят по каждой оси, по которой возможен выход за пределы: время, объём, число строк. И третье правило того же ряда — потеря прав отмечается в отчёте, а не пропускается: отсутствующий раздел, о котором не сказано, читается как «там всё в порядке»."}},{"id":"L22A","title":"Нет программы или ненулевой код","module":22,"kind":"dataset","salt":"l22a","intro":"Отчёт сборщика, в котором три проверки закончились по-разному. Две из них выглядят одинаково «неуспешными», но означают разное, и путать их нельзя.","commands":"python3 course_lab.py init L22A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L22A ./work","expect":{"ok_probes":"51ycxo","missing_tool":"10lw2zj","nonzero_probe":"albefw","truncated_bytes":"1om1bsj"},"checks":[{"op":"hash","field":"ok_probes","label":"успешные проверки сосчитаны","note":"указано"},{"op":"hash","field":"missing_tool","label":"отсутствие программы отделено","note":"указано"},{"op":"hash","field":"nonzero_probe","label":"ненулевой код отделён от отсутствия программы","note":"указано"},{"op":"hash","field":"truncated_bytes","label":"предел вывода прочитан","note":"указано"},{"op":"claimEquals","field":"partial_is_failure","value":false,"label":"частичный отчёт не принят за провал","note":"указано"}],"why":{"q":"Почему «программы нет» и «программа вернула 1» нельзя записать одним статусом?","options":["Потому что во втором случае есть код возврата, а в первом нет","Потому что это разные выводы о системе","Потому что отсутствие программы не является ошибкой","Потому что ненулевой код всегда означает нехватку прав"],"answer":1,"explanation":"Отчёт читают, чтобы принять решение, а «не получилось» решения не подсказывает. Отсутствие ZFS на машине без ZFS — нормальное состояние; ss без прав — повод перезапустить сбор иначе. Обрезка по пределу — третий случай: данные есть, но неполные, и выдавать их за полный вывод нельзя."}},{"id":"L23B","title":"Ноль изменений не значит «всё хорошо»","module":23,"kind":"dataset","salt":"l23b","intro":"Три прогона одного плейбука: обычный, после ручной правки и с испорченным шаблоном. Число изменений в итоговой строке говорит не о том, о чём его обычно спрашивают.","commands":"python3 course_lab.py init L23B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L23B ./work","expect":{"converged_hosts":"p4vea4","unchecked_hosts":"pyu7d1"},"checks":[{"op":"hash","field":"converged_hosts","label":"сошедшиеся хосты сосчитаны","note":"указано"},{"op":"hash","field":"unchecked_hosts","label":"недоступный хост не засчитан как сошедшийся","note":"указано"},{"op":"claimEquals","field":"drift_detected","value":true,"label":"расхождение обнаружено","note":"указано"},{"op":"claimEquals","field":"template_applied","value":false,"label":"проверка остановила применение","note":"указано"},{"op":"claimEquals","field":"zero_changes_means_healthy","value":false,"label":"ноль изменений не принят за доступность","note":"указано"}],"why":{"q":"Хост web-03 во всех трёх прогонах имеет changed=0 и unreachable=1. Что это значит?","options":["Что он уже в нужном состоянии","Что на нём нечего менять","Что до него ни разу не дошли: unreachable означает отсутствие связи","Что плейбук не содержит задач для его группы"],"answer":2,"explanation":"Идемпотентность отвечает на вопрос «изменилось ли что-нибудь», а не «в порядке ли всё». Недоступный хост тихо выпадает из обеих колонок, и итоговая строка выглядит спокойно. Поэтому смотрят на unreachable и failed отдельно, а результат сходимости считают по числу действительно проверенных хостов."}},{"id":"L24B","title":"Что переживёт пересоздание контейнера","module":24,"kind":"dataset","salt":"l24b","intro":"Два файла, две проверки, один результат пересоздания. Разница между томом и записываемым слоем обнаруживается ровно один раз — обычно после потери данных.","commands":"python3 course_lab.py init L24B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L24B ./work","expect":{"survived_path":"1d194vh","lost_path":"167bwmq","oom_cause":"1mwq8ki"},"checks":[{"op":"hash","field":"survived_path","label":"том опознан по пути","note":"указано"},{"op":"hash","field":"lost_path","label":"потерянный путь назван","note":"указано"},{"op":"claimEquals","field":"writable_layer_persists","value":false,"label":"записываемый слой признан временным","note":"указано"},{"op":"hash","field":"oom_cause","label":"источник остановки назван","note":"указано"},{"op":"claimEquals","field":"host_memory_was_low","value":false,"label":"память хоста снята с подозрения","note":"указано"}],"why":{"q":"Хосту хватает памяти, а контейнер убит по её нехватке. Как это возможно?","options":["Хост посчитал память неверно","Контейнер запросил больше, чем есть в системе","Предел задан для контрольной группы этого контейнера","Образ собран под другую архитектуру"],"answer":2,"explanation":"Контрольная группа — это отдельный счёт, и решение о нехватке принимается по нему. Отсюда правило читать такие отказы в паре: сначала предел группы, потом память хоста. Приложение внутри при этом видит общую память машины и о своём пределе не знает — потому и упирается в него неожиданно."}},{"id":"L25B","title":"Обновление или замена","module":25,"kind":"dataset","salt":"l25b","intro":"План изменений, в котором три ресурса меняются по-разному. Два из трёх безопасны, третий уничтожает данные — и в выводе плана это отличается одной строкой.","commands":"python3 course_lab.py init L25B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L25B ./work","expect":{"replaced_count":"14u293u","in_place_count":"14k2nev","data_at_risk":"1kj8lkm","marker":"42ewvh"},"checks":[{"op":"hash","field":"replaced_count","label":"замены сосчитаны","note":"указано"},{"op":"hash","field":"in_place_count","label":"изменения на месте отделены от замен","note":"указано"},{"op":"hash","field":"data_at_risk","label":"найден ресурс с данными","note":"указано"},{"op":"claimEquals","field":"replacement_is_safe_update","value":false,"label":"замена не принята за обновление","note":"указано"},{"op":"hash","field":"marker","label":"названа пометка, по которой это видно","note":"указано"}],"why":{"q":"Почему «forces replacement» опаснее, чем звучит?","options":["Потому что замена занимает больше времени","Потому что при замене ресурс уничтожается и создаётся заново","Потому что провайдер может не поддержать новую версию","Потому что после замены меняется имя ресурса"],"answer":1,"explanation":"План читают по пометкам, а не по числу строк: ~ меняет на месте, -/+ уничтожает и создаёт. Область поражения считается до применения — для ресурсов с состоянием у замены есть цена, которой у обновления нет, и обратного хода после destroy не будет."}},{"id":"L26A","title":"Селектор, метка и конечная точка","module":26,"kind":"dataset","salt":"l26a","intro":"Service есть, Pod работает, а список конечных точек пуст. Причина — в одном символе, и найти её можно только сопоставив три объекта между собой.","commands":"python3 course_lab.py init L26A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L26A ./work","expect":{"endpoints_count":"5d5ou6","ready_pods":"4t6hg8","selector_value":"1la7b8y","label_value":"1nu6b44"},"checks":[{"op":"hash","field":"endpoints_count","label":"пустой список конечных точек прочитан","note":"указано"},{"op":"hash","field":"ready_pods","label":"готовность Pod проверена отдельно","note":"указано"},{"op":"hash","field":"selector_value","label":"значение селектора выписано","note":"указано"},{"op":"hash","field":"label_value","label":"значение метки выписано рядом","note":"указано"},{"op":"claimEquals","field":"readiness_is_the_cause","value":false,"label":"готовность снята с подозрения","note":"указано"}],"why":{"q":"Почему Service с работающими Pod может не иметь ни одной конечной точки?","options":["Потому что конечные точки создаются вручную","Потому что targetPort не совпадает с портом контейнера","Потому что список конечных точек собирается по точному совпадению меток","Потому что Pod находятся в другом пространстве имён"],"answer":2,"explanation":"Service не знает про Pod ничего, кроме меток: связь между ними — совпадение строк, а не близость по смыслу. Пустой список конечных точек поэтому читается как «никто не подошёл», и проверять надо пару селектор — метка посимвольно, а готовность и порт — уже следующими шагами."}},{"id":"L27A","title":"Что доказывает журнал сборки","module":27,"kind":"dataset","salt":"l27a","intro":"Журнал успешной сборки приложения UEFI и три файла рядом с ним. По этим данным надо сказать, какой именно образ получился и что о нём доказано, а что нет.","commands":"python3 course_lab.py init L27A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L27A ./work","expect":{"arch":"1hze901","module_type":"w9jibz","entry_point":"1cacluj","sha_prefix":"kox0s0"},"checks":[{"op":"hash","field":"arch","label":"архитектура образа прочитана","note":"указано"},{"op":"hash","field":"module_type","label":"тип модуля прочитан из INF","note":"указано"},{"op":"hash","field":"entry_point","label":"точка входа названа","note":"указано"},{"op":"hash","field":"sha_prefix","label":"образ опознан по контрольной сумме","note":"указано"},{"op":"claimEquals","field":"build_proves_run","value":false,"label":"сборка не выдана за исполнение","note":"указано"}],"why":{"q":"Зачем записывать контрольную сумму образа, если сборка воспроизводима?","options":["Чтобы сравнить размер с предыдущей версией","Чтобы проверить, что компилятор не изменился","Чтобы доказать, что на стенде выполнялся именно этот образ","Чтобы прошивка приняла образ без подписи"],"answer":2,"explanation":"Воспроизводимость — свойство, которое ещё надо доказать, и на неё нельзя опираться при разборе. Сумма связывает журнал сборки с тем, что реально лежало в каталоге FAT; без неё любой вывод о поведении относится к неизвестному файлу."}},{"id":"L28B","title":"Что изменилось, а что осталось","module":28,"kind":"dataset","salt":"l28b","intro":"Две съёмки одной машины: до и после изменения одной настройки платформы. Меняется не всё подряд, и назвать шаг, на котором картина расходится, важнее, чем перечислить отличия.","commands":"python3 course_lab.py init L28B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L28B ./work","expect":{"changed_step":"1qi6fm0","unchanged_bdf":"kbnerg","window_kib":"egbce0"},"checks":[{"op":"hash","field":"changed_step","label":"шаг изменения назван","note":"указано"},{"op":"hash","field":"unchanged_bdf","label":"неизменная часть выписана отдельно","note":"указано"},{"op":"claimEquals","field":"driver_changed","value":false,"label":"привязка драйвера признана прежней","note":"указано"},{"op":"hash","field":"window_kib","label":"размер окна переведён в кибибайты","note":"указано"},{"op":"claimEquals","field":"proves_real_board","value":false,"label":"границы виртуального прогона названы","note":"указано"}],"why":{"q":"Почему полезно назвать не только изменившийся шаг, но и оставшиеся прежними?","options":["Чтобы отчёт выглядел полнее","Потому что неизменные шаги ограничивают область поиска","Потому что прошивка перечисляет устройства в другом порядке","Потому что ОС кэширует привязку драйверов"],"answer":1,"explanation":"Диагностика — это сужение. Совпадающая часть двух срезов исключает целые классы причин; без неё любое отличие выглядит одинаково подозрительным. Отдельно: виртуальная платформа воспроизводит порядок шагов, но не физику — тепло, питание и разводку линий она не моделирует вовсе."}},{"id":"L29A","title":"Таблицы одной загрузки","module":29,"kind":"dataset","salt":"l29a","intro":"Выгрузка таблиц ACPI и вывод lscpu и lspci рядом. Совпадение чисел между источниками и есть работа: расхождение здесь означает, что таблицы сняты не в ту загрузку.","commands":"python3 course_lab.py init L29A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L29A ./work","expect":{"tables_from_this_boot":"1puekns","stale_table":"10lsgig","numa_nodes":"1q4e6cr"},"checks":[{"op":"hash","field":"tables_from_this_boot","label":"таблицы текущей загрузки сосчитаны","note":"указано"},{"op":"hash","field":"stale_table","label":"найдена таблица из чужой загрузки","note":"указано"},{"op":"claimEquals","field":"cpus_match","value":true,"label":"числа сведены между источниками","note":"указано"},{"op":"hash","field":"numa_nodes","label":"узлы NUMA сосчитаны","note":"указано"},{"op":"claimEquals","field":"decompile_means_execute","value":false,"label":"разбор отличён от исполнения","note":"указано"}],"why":{"q":"Чем плоха таблица, снятая в другую загрузку?","options":["Ничем: таблицы ACPI одинаковы при каждой загрузке","Тем, что её контрольная сумма не совпадёт с остальными","Тем, что ядро перечитывает таблицы при каждой загрузке","Тем, что она описывает другое состояние платформы"],"answer":3,"explanation":"Набор фактов должен относиться к одному состоянию системы — как и в любом другом разборе. Отметка загрузки для таблиц играет ту же роль, что общая шкала времени для журналов: без неё сравнение сравнивает разные машины. И отдельно: декомпиляция AML читает байт-код, а не выполняет его, — это разбор, а не запуск."}},{"id":"L30A","title":"До и после добавления корня","module":30,"kind":"dataset","salt":"l30a","intro":"Два вывода одной проверки сертификата: до добавления корня в хранилище и после. Изменилось ровно одно утверждение — и назвать, какие два не изменились, важнее.","commands":"python3 course_lab.py init L30A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L30A ./work","expect":{"changed_claim":"qsuoq1"},"checks":[{"op":"hash","field":"changed_claim","label":"названо изменившееся утверждение","note":"указано"},{"op":"claimEquals","field":"cipher_changed","value":false,"label":"шифр признан прежним","note":"указано"},{"op":"claimEquals","field":"was_encrypted_before","value":true,"label":"шифрование отделено от доверия","note":"указано"},{"op":"claimEquals","field":"proves_server_not_compromised","value":false,"label":"границы проверки названы","note":"указано"},{"op":"claimEquals","field":"proves_right_server","value":false,"label":"подлинность имени отделена от намерения","note":"указано"}],"why":{"q":"Что именно изменилось, когда корень попал в доверенное хранилище?","options":["Соединение стало шифрованным","Сервер начал предъявлять правильный сертификат","Ваш клиент стал доверять тому, кто выдал сертификат","Цепочка сертификатов стала короче"],"answer":2,"explanation":"Шифрование и доверие — разные свойства: канал был закрыт от чтения и до этого, неизвестно было лишь, кто на другом конце. Успешная проверка говорит «сертификат выдан тем, кому я доверяю, и имя совпало» — и ничего не говорит ни о том, не украден ли ключ, ни о том, тот ли это сервер, который вам на самом деле нужен."}},{"id":"L31B","title":"Следствие раньше причины","module":31,"kind":"dataset","salt":"l31b","intro":"Журналы двух узлов об одном обмене. Без поправки картина невозможна: ответ записан раньше запроса. Поправку считают по общему событию, а вместе с ней — её точность.","commands":"python3 course_lab.py init L31B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L31B ./work","expect":{"offset_seconds":"in2jzz","network_ms":"16mh08d","offset_precision_ms":"139fiph"},"checks":[{"op":"hash","field":"offset_seconds","label":"поправка посчитана по общему событию","note":"указано"},{"op":"hash","field":"network_ms","label":"время сети отделено от обработки","note":"указано"},{"op":"hash","field":"offset_precision_ms","label":"точность поправки оценена","note":"указано"},{"op":"claimEquals","field":"order_established","value":false,"label":"порядок событий внутри погрешности не установлен","note":"указано"}],"why":{"q":"Почему поправка по одному обмену известна лишь с точностью до половины сетевого времени?","options":["Потому что часы дрейфуют во время измерения","Потому что журналы пишутся с задержкой","Потому что путь туда и обратно может быть неравным","Потому что сервер обрабатывал запрос 40 мс"],"answer":2,"explanation":"Симметричность сети — предположение, а не измерение, и именно оно задаёт предел точности. Отсюда практический вывод: события, отстоящие меньше чем на погрешность поправки, ваши данные не упорядочивают — и требовать от них ответа «что было раньше» бесполезно, нужен другой источник или точнее синхронизация."}},{"id":"L32B","title":"Отставание, которое перестало сокращаться","module":32,"kind":"dataset","salt":"l32b","intro":"Отставание реплики под тремя нагрузками и одно восстановление на момент. По этим числам видно, где реплика перестаёт догонять, и чем отставание в байтах отличается от отставания в секундах.","commands":"python3 course_lab.py init L32B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L32B ./work","expect":{"breaking_rate":"15dv463","restore_minutes":"i9rhqa","point_gap_minutes":"1i3sohn"},"checks":[{"op":"hash","field":"breaking_rate","label":"найдена нагрузка, при которой реплика не догоняет","note":"указано"},{"op":"hash","field":"restore_minutes","label":"длительность восстановления посчитана","note":"указано"},{"op":"hash","field":"point_gap_minutes","label":"выбор точки восстановления прочитан","note":"указано"},{"op":"claimEquals","field":"lag_seconds_is_data","value":false,"label":"две меры отставания различены","note":"указано"}],"why":{"q":"Чем отставание в 142 секунды отличается от отставания в 4820 МиБ?","options":["Ничем: это одна величина в разных единицах","Секунды измеряют возраст данных на реплике, байты — объём неприехавшего","Байты точнее, потому что не зависят от часов","Секунды относятся к сети, а байты к диску"],"answer":1,"explanation":"Эти две меры отвечают на разные вопросы: «насколько устарели данные на реплике» и «сколько ей ещё разгребать». Тенденция важнее любого мгновенного значения: пока отставание сокращается, реплика догоняет, и величина сама по себе не тревожна; как только растёт — догонять она уже не будет никогда."}},{"id":"L33B","title":"Ветви, которые сходятся","module":33,"kind":"dataset","salt":"l33b","intro":"Проверка резерва под нагрузкой: одну ветвь отключили, вторая приняла трафик —
