<script type="application/json" id="lab-data">{"version":"2","labs":[{"id":"L00B","title":"Смешанные единицы измерения","module":0,"kind":"dataset","salt":"l00b","intro":"Два файла с временами одного и того же запроса, снятые разными людьми. Единицы записать забыли. Несопоставимость надо заметить до сравнения, а не после.","commands":"python3 course_lab.py init L00B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L00B ./work","expect":{"ms_file":"jbnp2l","p90_ms":"1fctca0"},"checks":[{"op":"hash","field":"ms_file","label":"найден файл в миллисекундах","note":"указано"},{"op":"hash","field":"p90_ms","label":"p90 пересчитан из приведённых значений","note":"указано"},{"op":"claimEquals","field":"comparable_as_is","value":false,"label":"файлы признаны несопоставимыми как есть","note":"указано"}],"why":{"q":"Почему сравнивать эти два файла без приведения к одной шкале нельзя, даже если оба «про время»?","options":["Потому что в них разное число значений, а p90 требует равных выборок","Потому что один снят позже другого, и нагрузка за это время изменилась","Потому что значение без единицы измерения — не величина, а число","Потому что p90 по объединённому ряду считается только по большему файлу"],"answer":2,"explanation":"Измерение — это число вместе с единицей и точкой съёма. Без единицы сравнение сравнивает оформление, а не систему; отсюда и правило записывать единицу до запуска, а не после."}},{"id":"L01A","title":"Порядок байтов","module":1,"kind":"dataset","salt":"l01a","intro":"Стенд не нужен: вычисление и разбор представления. Дамп регистра разобран с неверным порядком байтов — восстановите поле, ничего не записывая в аппаратный регистр.","commands":"python3 course_lab.py init L01A ./work\n# считайте значения на Python, заполните answer.json\npython3 course_lab.py collect L01A ./work","expect":{"shifted":"1l42wjs","little":"11idov9","big":"ubghp9"},"checks":[{"op":"hash","field":"shifted","label":"сдвиг и маска","note":"указано"},{"op":"hash","field":"little","label":"разбор как little-endian","note":"указано"},{"op":"hash","field":"big","label":"разбор как big-endian","note":"указано"}],"why":{"q":"Одни и те же четыре байта дали два разных числа. Что именно определяет, какое из них верное?","options":["Разрядность процессора, на котором дамп читают: она и задаёт порядок","Договорённость о порядке байтов у того, кто эти байты записал","Язык и библиотека, которыми дамп разбирают: у каждой свой порядок","Знаковость числа: у знаковых величин байты идут в обратном порядке"],"answer":1,"explanation":"Порядок байтов — свойство формата, а не памяти. Поэтому дамп регистра или пакета читается вместе со спецификацией источника; «перевернулось» означает, что взяли не ту договорённость, а не что данные испорчены."}},{"id":"L02B","title":"Обратное давление и состояние D","module":2,"kind":"dataset","salt":"l02b","intro":"Производитель остановился, а процессор почти свободен. Наборы данных сняты с одной машины: снимок vmstat и список процессов.","commands":"python3 course_lab.py init L02B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L02B ./work","expect":{"blocked":"1mf0zh5","producer_state":"1vknvd8","cpu_is_bottleneck":"xeiixi"},"checks":[{"op":"hash","field":"blocked","label":"число заблокированных задач названо","note":"указано"},{"op":"hash","field":"producer_state","label":"состояние производителя названо","note":"указано"},{"op":"hash","field":"cpu_is_bottleneck","label":"узкое место определено верно","note":"указано"}],"why":{"q":"Почему низкая загрузка процессора не снимает подозрений с нагрузки?","options":["Потому что процессор простаивает, пока задачи ждут устройство","Потому что загрузка усредняется за минуту и запаздывает за нагрузкой","Потому что vmstat показывает работу ядра, а не время самих приложений","Потому что часть работы идёт в прерываниях и в загрузку не попадает"],"answer":0,"explanation":"Задачи в состоянии D ждут блочный ввод-вывод, и процессор в это время свободен. Колонка b и wchan показывают, чего именно ждут, — вопрос про диск, а не про процессор."}},{"id":"L03B","title":"Сумма RSS и разделяемые страницы","module":3,"kind":"dataset","salt":"l03b","intro":"Три процесса одного приложения делят общие страницы. Сумма RSS выглядит расходом памяти, но им не является.","commands":"python3 course_lab.py init L03B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L03B ./work","expect":{"rss_sum_mib":"97tykz","physical_mib":"50yqvi","rss_sum_is_usage":"5kk90z"},"checks":[{"op":"hash","field":"rss_sum_mib","label":"сумма RSS посчитана","note":"указано"},{"op":"hash","field":"physical_mib","label":"физический расход посчитан","note":"указано"},{"op":"hash","field":"rss_sum_is_usage","label":"вывод о сумме RSS верен","note":"указано"}],"why":{"q":"Почему сумма RSS завышает расход памяти?","options":["Потому что RSS включает страничный кэш всех файлов, открытых процессом","Потому что каждый процесс считает разделяемые страницы своими","Потому что RSS считается по основанию 1024, а физическая память по 1000","Потому что RSS учитывает и выгруженные на диск страницы процесса"],"answer":1,"explanation":"PSS делит разделяемую страницу между процессами и потому суммируется честно. Разница между суммой RSS и физическим расходом — это ровно то, что посчитано несколько раз."}},{"id":"L04A","title":"Юнит systemd и его контекст","module":4,"kind":"collect","salt":"l04a","intro":"Создайте учебный юнит по главе 4, сломайте только WorkingDirectory на несуществующий путь, зафиксируйте отказ и исправьте drop-in-файлом. Скрипт соберёт состояние юнита после исправления.","commands":"python3 course_lab.py init L04A ./work --unit course-report.service\n# сломайте, зафиксируйте статус отказа, исправьте drop-in\npython3 course_lab.py collect L04A ./work","expect":{"exit_status":"16unoy8"},"checks":[{"op":"hash","field":"exit_status","label":"статус отказа опознан","note":"указано"},{"op":"equals","fact":"verify_rc","value":0,"label":"файл юнита проходит verify","note":"код возврата"},{"op":"isTrue","fact":"ran","label":"юнит действительно запускался","note":"журнал"},{"op":"isTrue","fact":"succeeded","label":"юнит завершился успешно","note":"журнал"},{"op":"isTrue","fact":"failure_seen","label":"отказ до исправления зафиксирован","note":"журнал"},{"op":"isTrue","fact":"has_dropin","label":"исправление сделано drop-in-файлом","note":"DropInPaths"}],"why":{"q":"Почему «вручную запускается, а из юнита нет» — это не противоречие?","options":["Потому что systemd запускает любой юнит от другого пользователя, чем ваш вход","Потому что у службы свой контекст выполнения, а не окружение оболочки","Потому что оболочка исправляет опечатки и дописывает пути за вас","Потому что юнит держит прежнюю версию файла до перезагрузки демона"],"answer":1,"explanation":"Разница не в правах, а в контексте. Оболочка подставляет каталог, переменные и интерпретатор; systemd выполняет ExecStart напрямую в объявленном контексте, и всё неявное надо объявить."},"bench":true,"chain":"systemd","proof":"Подтверждено: статус отказа опознан, отказ и последующее успешное завершение видны в журнале, исправление сделано drop-in-файлом. Не подтверждено: как вы искали причину — факты снимаются уже после починки.","criteria":2},{"id":"L05B","title":"Необязательный том и аварийная цель","module":5,"kind":"dataset","salt":"l05b","intro":"Машина ушла в аварийную цель. Собраны параметр ядра, список устройств, fstab и журнал загрузки.","commands":"python3 course_lab.py init L05B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L05B ./work","expect":{"root_resolves":"9rqhdq","failing_mount":"1vggnqp","minimal_fix":"zavhmx"},"checks":[{"op":"hash","field":"root_resolves","label":"корень подтверждён","note":"указано"},{"op":"hash","field":"failing_mount","label":"точка монтирования названа","note":"указано"},{"op":"hash","field":"minimal_fix","label":"минимальная правка названа","note":"указано"}],"why":{"q":"Почему отказ дополнительного тома останавливает загрузку целиком?","options":["Потому что systemd монтирует все тома одной операцией и откатывает её целиком","Потому что ядро не смонтирует корень, пока не найдены остальные тома","Потому что запись в fstab без nofail делает том обязательным","Потому что аварийная цель включается при любой ошибке разбора fstab"],"answer":2,"explanation":"Обязательность задаётся параметрами монтирования, а не важностью данных. Поэтому лечение — политика необязательного тома, а не удаление строки: удалив её, вы потеряете и сам том."}},{"id":"L06B","title":"Неверный префикс и ARP","module":6,"kind":"stand","salt":"l06b","intro":"Скрипт добавляет на интерфейс адрес со слишком коротким префиксом: удалённый адрес начинает считаться локальным. Найдите длину префикса, из-за которой это произошло, и верните маршрутизацию через шлюз.","commands":"sudo python3 course_lab.py preflight L06B\nsudo python3 course_lab.py init L06B ./work --local 10.10.10.11\n# сравните ip route get и ip neigh до и после исправления\npython3 course_lab.py collect L06B ./work\nsudo python3 course_lab.py restore L06B ./work","variants":[{"wrong_prefix":"1kdjkfd"},{"wrong_prefix":"1wtgkaw"},{"wrong_prefix":"1xnfddt"}],"checks":[{"op":"hash","field":"wrong_prefix","label":"найдена длина неверного префикса","note":"указано"},{"op":"isTrue","fact":"route_via_gateway","label":"маршрут снова идёт через шлюз","note":"ip route get"},{"op":"isFalse","fact":"arp_for_remote","label":"ARP удалённого адреса больше не запрашивается","note":"ip neigh"}],"why":{"q":"Почему при неверном префиксе хост шлёт ARP на конечный удалённый адрес?","options":["Потому что шлюз перестал отвечать, и хост перешёл к прямому разрешению","Потому что таблица соседей переполнилась и записи о шлюзе не осталось","Потому что маршрут по умолчанию исчез из таблицы, и трафик пошёл напрямую","Потому что адрес попал в собственную подсеть"],"answer":3,"explanation":"Выбор следующего узла делается до всякой отправки: сначала самый длинный совпадающий префикс, и только потом разрешение адреса канального уровня. Запрос ARP конечного удалённого адреса — признак того, что маршрут признал его локальным."},"bench":true,"chain":"сеть","proof":"Подтверждено: длина неверного префикса названа, маршрут к удалённому адресу снова идёт через шлюз, ARP на него не уходит. Не подтверждено: чем именно вы это исправили — адресом, маршрутом или откатом скрипта."},{"id":"L07B","title":"TCP и PMTU","module":7,"kind":"stand","salt":"l07b","intro":"Скрипт снижает MTU одного участка пути. Измерьте границу прохождения пакетов с DF и проверьте передачу файла. Зависание крупного ответа в этой работе не моделируется.","commands":"sudo python3 course_lab.py preflight L07B --peer 10.10.20.12\nsudo python3 course_lab.py init L07B ./work\n# диагностика и подтверждение гипотезы\npython3 course_lab.py collect L07B ./work\nsudo python3 course_lab.py restore L07B ./work","variants":[{"path_mtu":"du5exl"},{"path_mtu":"8zbq5z"},{"path_mtu":"h66y97"}],"checks":[{"op":"hash","field":"path_mtu","label":"найден MTU участка","note":"заявлено"},{"op":"sameAsClaim","fact":"path_mtu","field":"path_mtu","label":"измерение подтверждает заявленное","note":"ip link показывает"},{"op":"offset","fact":"df_max_payload","field":"path_mtu","delta":-28,"label":"нагрузка с запретом фрагментации сходится","note":"прошло"},{"op":"isTrue","fact":"handshake_ok","label":"рукопожатие проходит","note":"соединение"},{"op":"isTrue","fact":"transfer_ok","label":"файл получен целиком","note":"код HTTP"}],"why":{"q":"Рукопожатие проходит, а крупный ответ зависает при потере служебных сообщений PMTU. Какой механизм согласуется с этими наблюдениями?","options":["Сервер перегружен и обрывает отдачу файлов больше нескольких килобайт","Межсетевой экран закрывает порт для пакетов больше обычного размера","Крупный IP-пакет не проходит узкий участок, а отправитель не получает сигнал уменьшить размер","Маршрута до сервера нет, и работает только разрешение адресов в сегменте"],"answer":2,"explanation":"Рукопожатие использует небольшие пакеты, поэтому может пройти при неверной оценке MTU пути. Если крупный пакет с запретом фрагментации не проходит и нужное сообщение ICMP теряется, отправитель продолжает повторять передачу. Это объяснение проверяют измерением MTU и повторами, а не выводят из одного симптома как единственную причину."},"bench":true,"chain":"сеть","proof":"Подтверждено: MTU узкого участка назван и подтверждён измерением — наибольшая прошедшая нагрузка с запретом фрагментации сходится с ним, рукопожатие проходит, файл получен целиком. Не подтверждено: зависание крупных ответов. Инцидент вносится на той же машине, где идёт измерение, а собственный MTU стек учитывает сам: передача при нём не рвётся, и симптом из текста работы на одном узле не воспроизводится."},{"id":"L08B","title":"Политика пересылки и входящая цепочка","module":8,"kind":"dataset","salt":"l08b","intro":"Клиент из одного VLAN не доходит до сервиса в другом, а сам маршрутизатор отвечает. Собраны набор правил со счётчиками, параметр пересылки и таблица маршрутов.","commands":"python3 course_lab.py init L08B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L08B ./work","expect":{"input_works":"1kl4qed","blocking_chain":"1otx0be","forwarding_enabled":"1kl4qed"},"checks":[{"op":"hash","field":"input_works","label":"входящая цепочка проверена","note":"указано"},{"op":"hash","field":"blocking_chain","label":"цепочка потери названа","note":"указано"},{"op":"hash","field":"forwarding_enabled","label":"пересылка проверена","note":"указано"}],"why":{"q":"Почему работающая входящая цепочка ничего не говорит о транзитном трафике?","options":["Потому что входящая цепочка обрабатывает пакеты только до маршрутизации","Потому что счётчики входящей цепочки обнуляются на каждом пакете и скрывают транзит","Потому что транзит разрешается таблицей маршрутизации, а не правилами экрана","Потому что пакеты для маршрутизатора и пакеты через него идут разными цепочками"],"answer":3,"explanation":"Обращение к самому узлу проходит входящую цепочку, транзит — цепочку пересылки. Счётчики показывают это прямо: в одной пакеты есть, в другой ноль при политике запрета."}},{"id":"L09B","title":"Локальная и удалённая память","module":9,"kind":"dataset","salt":"l09b","intro":"Замеры задержки доступа к памяти при одинаковой нагрузке и размещении. Процесс закреплён на одном узле, память выделена на другом.","commands":"python3 course_lab.py init L09B ./work\n# прочитайте numa.txt и README.txt, заполните answer.json\npython3 course_lab.py collect L09B ./work","expect":{"remote_ns":"1t2fwip","ratio":"ghdxsy"},"checks":[{"op":"hash","field":"remote_ns","label":"найдена задержка удалённого доступа","note":"указано"},{"op":"hash","field":"ratio","label":"посчитано, во сколько раз он дороже","note":"указано"},{"op":"claimEquals","field":"idle_means_free","value":false,"label":"низкая средняя загрузка не принята за недогруз","note":"указано"}],"why":{"q":"Почему низкая средняя загрузка процессора не доказывает, что машина недогружена?","options":["Потому что среднее скрывает и насыщенный поток, и ожидание удалённой памяти","Потому что загрузка измеряется раз в секунду и не ловит короткие всплески","Потому что виртуальная машина всегда показывает заниженную загрузку процессора","Потому что доступ к удалённой памяти не попадает в статистику ядра вовсе"],"answer":0,"explanation":"Утилизация отвечает на вопрос «сколько времени процессор был занят», а не «что его ограничивало». Один насыщенный поток на многоядерной машине даёт низкое среднее; ожидание удалённой памяти выглядит как занятость без продвижения работы."}},{"id":"L10B","title":"Две линии времени: ОС и BMC","module":10,"kind":"dataset","salt":"l10b","intro":"Два журнала одного отказа с разным ходом часов: os.log ведут часы системы, bmc.log — часы контроллера управления. Приведите их к одной шкале и решите, доказан ли блок питания как первопричина.","commands":"python3 course_lab.py init L10B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L10B ./work","expect":{"skew_seconds":"d3obwd","first_source":"1rj6n1q","psu_after_seconds":"84mx0f"},"checks":[{"op":"hash","field":"skew_seconds","label":"сдвиг часов измерен","note":"указано"},{"op":"hash","field":"first_source","label":"первым увидел отказ","note":"указано"},{"op":"hash","field":"psu_after_seconds","label":"сигнал питания позже на","note":"указано"},{"op":"claimEquals","field":"root_cause_proven","value":false,"label":"вывод о первопричине","note":"указано"}],"why":{"q":"После приведения часов к одной шкале сигнал блока питания оказался позже отказа ввода-вывода. Что отсюда следует?","options":["Блок питания исправен, и его сигнал можно не учитывать при разборе","Первопричина доказана: просадка питания и вызвала отказ накопителя","Часы контроллера верны, а часы системы отстают, поэтому порядок обратный","Сигнал питания не может быть причиной события, случившегося раньше него"],"answer":3,"explanation":"Порядок событий — необходимое условие причинности, а не достаточное. Пока сдвиг часов не измерен, любой вывод о порядке держится на совпадении шкал; после приведения видно, что сигнал питания следует за отказом, а значит требует отдельного объяснения."}},{"id":"L12A","title":"Идентичность блочного устройства","module":12,"kind":"collect","salt":"l12a","intro":"Добавьте пустые виртуальные диски с уникальными серийными номерами и установите цепочку «диск гипервизора → серийный номер → имя в системе». Ничего не форматируйте. Скрипт сверит заявленное устройство с тем, что видит система.","commands":"python3 course_lab.py init L12A ./work\n# заполните device и serial в answer.json\npython3 course_lab.py collect L12A ./work","expect":{},"checks":[{"op":"isTrue","fact":"claimed_exists","label":"заявленное устройство существует","note":"lsblk"},{"op":"matchesClaim","fact":"serial_of_claimed","label":"серийный номер совпал с заявленным","note":"в системе","field":"serial"},{"op":"isFalse","fact":"claimed_is_system_disk","label":"это не системный диск","note":"точка монтирования"}],"why":{"q":"Почему старый документ с указанием «замените sdb» опасен после перестановки дисков?","options":["Потому что имя sdX выдаётся по порядку обнаружения устройств","Потому что sdb всегда второй диск в корпусе, а порядок в нём изменился","Потому что ядро запрещает обращаться к sdX напрямую после перестановки","Потому что при перестановке диск получает от контроллера новый серийный номер"],"answer":0,"explanation":"Устойчив серийный номер или WWN, а не имя узла устройства. Поэтому инструкция должна называть устройство тем, что не меняется, а перед изменяющим действием объект опознают заново."},"bench":true,"chain":"хранение","proof":"Подтверждено: заявленное устройство существует на стенде, серийный номер совпал с измеренным, это не системный диск. Не подтверждено: верность всей цепочки «диск → раздел → том», которую вы построили."},{"id":"L13B","title":"LVM и расширение файловой системы","module":13,"kind":"collect","salt":"l13b","intro":"Увеличьте логический том, зафиксируйте расхождение размеров тома и файловой системы, затем расширьте файловую систему отдельно. Контрольная сумма файла должна остаться прежней.","commands":"python3 course_lab.py init L13B ./work --volume /dev/course/lvdata --mount /mnt/course-lvm\n# укажите в answer.json ожидаемый размер, контрольный файл и его сумму\npython3 course_lab.py collect L13B ./work","expect":{},"checks":[{"op":"sameAsClaim","fact":"lv_size_mib","field":"lv_size_mib","label":"размер тома совпал с заявленным","note":"lvs"},{"op":"isTrue","fact":"lv_grew","label":"том действительно расширен","note":"размер до работы"},{"op":"isTrue","fact":"fs_grew","label":"файловая система расширена следом","note":"размер до работы"},{"op":"isTrue","fact":"sizes_match","label":"файловая система догнала том","note":"блоки ФС"},{"op":"isTrue","fact":"checksum_same","label":"данные не пострадали","note":"сумма до работы"},{"op":"claimEquals","field":"gap_seen","value":true,"label":"расхождение LV и FS замечено до расширения","note":"заявлено"}],"why":{"q":"Почему после lvextend файловая система не выросла сама?","options":["Потому что нужен перезапуск системы","Потому что это два независимых слоя","Потому что ext4 не умеет расти без размонтирования","Потому что LVM сначала должен закончить синхронизацию"],"answer":1,"explanation":"Слои не знают друг о друге: расширение тома меняет геометрию устройства, а не структуру файловой системы. Обратная операция несимметрична — уменьшение файловой системы не является универсальным откатом, поэтому откатом служит восстановление из копии."},"bench":true,"chain":"восстановление данных","proof":"Подтверждено: том вырос по сравнению с состоянием до работы, файловая система расширена следом и заняла том целиком, контрольный файл совпал с тем, что было до расширения. Не подтверждено: видели ли вы расхождение своими глазами — это ваше слово.","criteria":2},{"id":"L14B","title":"Деградация и восстановление RAID","module":14,"kind":"collect","salt":"l14b","intro":"Пометьте одного подтверждённого учебного участника отказавшим, зафиксируйте деградацию и прочитайте данные, затем выполните документированный возврат или замену. Приёмка включает окончание восстановления, а не только его запуск.","commands":"python3 course_lab.py init L14B ./work --array md127\n# укажите в answer.json помеченного отказавшим участника\npython3 course_lab.py collect L14B ./work","expect":{},"checks":[{"op":"equals","fact":"degraded","value":0,"label":"массив больше не деградирован","note":"sysfs degraded"},{"op":"equals","fact":"sync_action","value":"idle","label":"восстановление завершено, а не идёт","note":"sync_action"},{"op":"isTrue","fact":"failure_logged","label":"отказ участника действительно был","note":"журнал ядра"},{"op":"isTrue","fact":"recovery_logged","label":"восстановление прошло от начала до конца","note":"журнал ядра"},{"op":"isTrue","fact":"claimed_member_back","label":"названный участник вернулся в массив","note":"mdadm --detail"},{"op":"equals","fact":"level","value":"raid1","label":"уровень массива тот же","note":"MD_LEVEL"},{"op":"atLeast","fact":"members","value":2,"label":"участники на месте","note":"MD_DEVICES"}],"why":{"q":"Почему отказ общего нижележащего хранилища нельзя считать имитацией независимого отказа носителя?","options":["Потому что md не отличает отказ участника от отказа их общей полки","Потому что при общем хранилище оба участника теряются одновременно","Потому что виртуальные диски всегда отказывают парами","Потому что при этом теряется суперблок массива"],"answer":1,"explanation":"Избыточность держится на предположении о независимости отказов. Общий диск, общий контроллер и общий источник питания это предположение снимают — и тогда эксперимент отвечает на другой вопрос, чем заявлено."},"bench":true,"chain":"восстановление данных","proof":"Подтверждено: отказ участника и восстановление массива видны в журнале ядра этой попытки, названный участник вернулся в массив, массив собран полностью и не восстанавливается прямо сейчас. Не подтверждено: читались ли данные во время деградации — факты снимаются уже после.","criteria":2},{"id":"L16B","title":"Снимок ZFS и проверка целостности","module":16,"kind":"collect","salt":"l16b","intro":"Проверка целостности, передача снимка во второй учебный пул и восстановление файла из него. Скрипт снимает базовую линию до попытки: по ней видно, что проверка запускалась заново, а контрольная сумма исходного файла взята до восстановления, а не из вашего ответа. Реальные повреждения дисков не вносятся.","commands":"python3 course_lab.py init L16B ./work --pool tank --target-pool backup --file /tank/app/control.bin\n# выполните работу; в answer.json укажите snapshot, received и restored_file\npython3 course_lab.py collect L16B ./work","expect":{},"checks":[{"op":"equals","fact":"health","value":"ONLINE","label":"пул в порядке","note":"health"},{"op":"isTrue","fact":"scrub_finished","label":"проверка целостности завершена","note":"zpool status"},{"op":"isTrue","fact":"scrub_is_new","label":"проверка запускалась в этой попытке, а не когда-то раньше","note":"строка scan"},{"op":"isTrue","fact":"errors_zero","label":"ошибок не найдено","note":"zpool status"},{"op":"isTrue","fact":"snapshot_present","label":"снимок в исходном пуле существует под полным именем","note":"zfs list"},{"op":"isTrue","fact":"pools_differ","label":"принимающий пул не совпадает с исходным","note":"пулы"},{"op":"isTrue","fact":"received_present","label":"снимок принят вторым пулом","note":"zfs list"},{"op":"isTrue","fact":"restored_readable","label":"восстановленный файл читается","note":"путь"},{"op":"isTrue","fact":"restored_on_target","label":"файл восстановлен в принимающем пуле, а не в исходном","note":"restored_pool"},{"op":"same","fact":"restored_sha256","other":"source_sha256","label":"содержимое совпало с исходным до попытки","note":"sha256"}],"why":{"q":"Почему успешная проверка целостности не заменяет резервную копию?","options":["Потому что она проверяет только метаданные, а содержимое файлов не читает","Потому что копия должна лежать на другом носителе всегда","Потому что она проверяет данные здесь, а не их наличие где-то ещё","Потому что снимок хранится дольше, чем копия"],"answer":2,"explanation":"Проверка целостности и снимок живут в том же пуле и разделяют его судьбу: удаление пула, ошибка администратора или отказ всей полки уносят их вместе с данными. Независимой копией является только то, что восстанавливается без исходного хранилища."},"bench":true,"chain":"восстановление данных","proof":"Подтверждено: проверка целостности запущена в этой попытке и завершена без ошибок, снимок существует под полным именем, принят вторым пулом, восстановленный файл лежит в принимающем пуле и побайтно совпадает с исходным до попытки. Не подтверждено: каким способом вы передали снимок.","criteria":2},{"id":"L17A","title":"Кворум и реплики","module":17,"kind":"dataset","salt":"l17a","intro":"Данные о здоровье кластера, параметрах пула и дереве OSD. Число мониторов не подменяет число копий данных.","commands":"python3 course_lab.py init L17A ./work\n# прочитайте выданные файлы, заполните answer.json\npython3 course_lab.py collect L17A ./work","expect":{"mon_quorum":"1rsfyss","replica_size":"1s2fkhr","min_size":"1rsfyss","failure_domain":"s8f5k0"},"checks":[{"op":"hash","field":"mon_quorum","label":"мониторов в кворуме","note":"указано"},{"op":"hash","field":"replica_size","label":"копий данных в пуле","note":"указано"},{"op":"hash","field":"min_size","label":"минимум копий для записи","note":"указано"},{"op":"hash","field":"failure_domain","label":"домен отказа из правила","note":"указано"}],"why":{"q":"Три монитора запущены, а в кворуме два. Что это меняет для данных?","options":["Кворум большинства сохранён; число копий и доступность данных проверяют отдельно по OSD и пулу","Число копий данных падает до двух, и пул перестаёт принимать запись","Запись останавливается до возвращения третьего монитора","Домен отказа меняется с host на osd"],"answer":0,"explanation":"Мониторы держат карту и принимают решения большинством; копии данных задаются size пула, а условие записи — min_size. Смешение этих чисел приводит к выводам вида «у нас три копии, потому что три монитора»."}},{"id":"L18B","title":"Сравнение двух отчётов fio","module":18,"kind":"dataset","salt":"l18b","intro":"Два отчёта fio об одном накопителе и список задержек одного из запусков. Числа IOPS отличаются в сто раз.","commands":"python3 course_lab.py init L18B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L18B ./work","expect":{"comparable":"1sdryhz","differing_parameters":"1hur51","p99_us":"yu7ql0"},"checks":[{"op":"hash","field":"comparable","label":"сопоставимость оценена","note":"указано"},{"op":"hash","field":"differing_parameters","label":"различающиеся параметры сосчитаны","note":"указано"},{"op":"hash","field":"p99_us","label":"p99 посчитан","note":"указано"}],"why":{"q":"Почему два числа IOPS сравнимы не всегда?","options":["Потому что IOPS зависит от размера блока, шаблона доступа и глубины очереди","Потому что накопители дают разный результат при каждом запуске","Потому что IOPS и пропускная способность — одно и то же, выраженное по-разному","Потому что fio округляет результат до сотен"],"answer":0,"explanation":"Один и тот же накопитель честно даёт 48 000 операций по 4 KiB и 512 операций по 1 MiB. Сравнивать можно только при совпадающих размере блока, шаблоне, глубине очереди и режиме."}},{"id":"L20A","title":"Показатель качества и пропущенные измерения","module":20,"kind":"dataset","salt":"l20a","intro":"Тысяча тестовых запросов за окно наблюдения, часть из них осталась без измерения. Цель показателя — 99%.","commands":"python3 course_lab.py init L20A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L20A ./work","expect":{"sli_percent":"1cjjesf","meets_target":"1chjaxj","optimistic_percent":"c1932p"},"checks":[{"op":"hash","field":"sli_percent","label":"показатель посчитан","note":"указано"},{"op":"hash","field":"meets_target","label":"вывод о цели сделан","note":"указано"},{"op":"hash","field":"optimistic_percent","label":"оптимистичный счёт посчитан","note":"указано"}],"why":{"q":"Почему пропущенное измерение нельзя молча выбросить из знаменателя?","options":["Потому что тогда показатель станет слишком строгим","Потому что отсутствие результата по известному запросу нельзя считать успехом и удалять из выборки","Потому что число запросов должно быть круглым","Потому что иначе оповещение сработает раньше времени"],"answer":1,"explanation":"Если тысяча запросов была отправлена, запросы без подтверждённого успешного результата остаются в знаменателе выбранного показателя; их отдельно помечают как отказ или неизвестный исход по контракту измерения. Исключение пропусков делает показатель искусственно зелёным при отказе сервиса или сборщика."}},{"id":"L23A","title":"Сходимость и непроверенные хосты","module":23,"kind":"dataset","salt":"l23a","intro":"Отчёт прогона в режиме проверки и список хостов инвентаря. Парк считается сошедшимся.","commands":"python3 course_lab.py init L23A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L23A ./work","expect":{"drifted_hosts":"tkskik","unchecked_hosts":"uerdlh","converged":"16w0s60"},"checks":[{"op":"hash","field":"drifted_hosts","label":"расхождения сосчитаны","note":"указано"},{"op":"hash","field":"unchecked_hosts","label":"непроверенные хосты сосчитаны","note":"указано"},{"op":"hash","field":"converged","label":"вывод о сходимости сделан","note":"указано"}],"why":{"q":"Почему успешный отчёт о прогоне не описывает состояние парка?","options":["Потому что отчёт считает задачи, а не хосты","Потому что режим проверки не видит изменений в файлах","Потому что отчёт описывает прогон","Потому что счётчик changed обнуляется при повторном запуске"],"answer":2,"explanation":"Расхождение создают недоступный в момент запуска хост, ручная правка после прогона и задача через оболочку вместо идемпотентного модуля. В сводке ничего этого не видно."}},{"id":"L26B","title":"Селектор, конечные точки и планирование","module":26,"kind":"dataset","salt":"l26b","intro":"Сервис не отвечает, хотя поды работают. Собраны описание сервиса, список конечных точек, метки подов и событие планировщика.","commands":"python3 course_lab.py init L26B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L26B ./work","expect":{"endpoints_count":"a7ue63","selector_matches":"1grtr8s","pending_reason":"11krrn1"},"checks":[{"op":"hash","field":"endpoints_count","label":"конечные точки сосчитаны","note":"указано"},{"op":"hash","field":"selector_matches","label":"селектор сверен с метками","note":"указано"},{"op":"hash","field":"pending_reason","label":"причина ожидания названа","note":"указано"}],"why":{"q":"Почему работающий под не обязательно попадает в сервис?","options":["Потому что под попадает в сервис только после перезапуска","Потому что сервис берёт поды по порядку создания","Потому что Running не гарантирует совпадения меток с селектором Service и готовности Pod","Потому что целевой порт должен совпадать с портом сервиса"],"answer":2,"explanation":"Пустой список конечных точек показывает это сразу: сервис не отобрал ни одного пода. Перезапуск работающих подов здесь ничего не меняет — расходятся селектор и метки."}},{"id":"L29B","title":"Матрица прошивок и регрессия","module":29,"kind":"dataset","salt":"l29b","intro":"Матрица «настройка → значение до и после → потребитель → сохранение при тёплой и холодной перезагрузке». В выданной регрессии найдите недоказанный переход.","commands":"python3 course_lab.py init L29B ./work\n# прочитайте firmware-matrix.txt, заполните answer.json\npython3 course_lab.py collect L29B ./work","expect":{"unproven_setting":"1mujy06"},"checks":[{"op":"hash","field":"unproven_setting","label":"найдена настройка, не переживающая холодную перезагрузку","note":"указано"},{"op":"claimEquals","field":"survives_cold_boot","value":false,"label":"ответ о сохранении","note":"указано"}],"why":{"q":"Почему «настройка применилась» и «настройка сохранена» — разные утверждения?","options":["Потому что текущий эффект и сохранение после холодного старта проверяются отдельно","Потому что применение требует перезапуска службы","Потому что значение хранится в ядре операционной системы","Потому что тёплая перезагрузка сбрасывает всё, что настроено в прошивке"],"answer":0,"explanation":"Изменение может повлиять на текущий запуск и при этом не сохраниться или не примениться после холодного старта. Проверяют значение, потребителя и наблюдаемый эффект до и после тёплой и холодной перезагрузки; результат зависит от реализации платформы."}},{"id":"L30B","title":"Цепочка доверия","module":30,"kind":"collect","salt":"l30b","intro":"Ломайте по одному звену цепочки и смотрите, какая именно ошибка появляется. Сначала уберите корень из хранилища и запишите текст ошибки дословно.","commands":"python3 course_lab.py init L30B ./work --root-cert root.pem --cert server.pem\n# впишите в answer.json текст ошибки без корня\npython3 course_lab.py collect L30B ./work","expect":{"error_without_root":"1l08v9f"},"checks":[{"op":"hash","field":"error_without_root","label":"ошибка без корня опознана","note":"указано"},{"op":"isTrue","fact":"verify_ok","label":"с корнем проверка проходит","note":"openssl verify"},{"op":"isFalse","fact":"verify_without_root","label":"без корня проверка не проходит","note":"openssl verify"},{"op":"isFalse","fact":"server_self_signed","label":"серверный сертификат выдан не сам себе","note":"издатель"},{"op":"isTrue","fact":"issued_by_root","label":"сертификат выдан вашим корнем","note":"издатель и субъект корня"},{"op":"isTrue","fact":"root_is_ca","label":"корень объявлен удостоверяющим","note":"basicConstraints"},{"op":"isTrue","fact":"san_present","label":"имя указано в SAN","note":"расширение сертификата"}],"why":{"q":"Что именно меняется, когда корень добавлен в хранилище доверия клиента?","options":["Сертификат сервера становится действительным","Соединение становится шифрованным только после добавления корня","Проверяется срок действия сертификата","Меняется не сертификат, а решение вашего клиента о доверии"],"answer":3,"explanation":"Доверие — свойство проверяющего, а не сертификата. Шифрование работает и без доверия; добавление корня отвечает на вопрос «кому принадлежит ключ», а имя в SAN связывает этот ключ с конкретным именем."},"bench":true,"chain":"доступ","proof":"Подтверждено: цепочка сходится — серверный сертификат выдан вашим корнем, а не самому себе, корень объявлен удостоверяющим, проверка проходит с корнем и не проходит без него, имя указано в SAN. Не подтверждено: как вы разбирали ошибку — факты снимаются с готовой цепочки.","criteria":2},{"id":"L31A","title":"Дрейф часов и поправка","module":31,"kind":"collect","salt":"l31a","intro":"Снимите состояние синхронизации, измерьте собственный дрейф и переведите его в ppm. Величина дрейфа объясняется свойствами генератора, а не «сбоем».","commands":"python3 course_lab.py init L31A ./work\n# впишите в answer.json измеренный дрейф в ppm\npython3 course_lab.py collect L31A ./work","expect":{},"checks":[{"op":"isTrue","fact":"synchronised","label":"часы синхронизированы с источником","note":"chronyc tracking"},{"op":"atLeast","fact":"stratum","value":1,"label":"слой источника записан","note":"stratum"},{"op":"sameAsClaim","fact":"drift_ppm_file","field":"drift_ppm","label":"заявленный дрейф совпал с измеренным","note":"файл дрейфа"}],"why":{"q":"Почему собственный дрейф часов в несколько ppm — это норма, а не неисправность?","options":["Потому что ядро округляет время до секунд и мелкий дрейф теряется","Потому что частота кварцевого генератора зависит от температуры и экземпляра","Потому что дрейф появляется только без синхронизации","Потому что ppm измеряется с большой погрешностью"],"answer":1,"explanation":"Несколько ppm — это секунды в сутки. Служба времени измеряет смещение и скорость ухода и подстраивает ход; поэтому осмысленный вопрос не «есть ли дрейф», а «известна ли поправка и когда она применялась»."},"bench":true,"chain":"время","proof":"Подтверждено: часы синхронизированы с источником, слой источника записан, заявленный дрейф совпал с измеренным в файле поправки. Не подтверждено: длительность наблюдения — величина снята одним замером.","criteria":2},{"id":"L33A","title":"Доступность цепочки","module":33,"kind":"dataset","salt":"l33a","intro":"Доступность каждого звена цепочки зависимостей учебного сервиса. Звенья последовательны: отказ любого роняет сервис.","commands":"python3 course_lab.py init L33A ./work\n# прочитайте chain.txt, заполните answer.json\npython3 course_lab.py collect L33A ./work","expect":{"chain_availability":"rhoaaz","weakest_link":"fnjeza"},"checks":[{"op":"hash","field":"chain_availability","label":"доступность цепочки посчитана","note":"указано"},{"op":"hash","field":"weakest_link","label":"слабое звено названо","note":"указано"}],"why":{"q":"Почему доступность последовательной цепочки ниже доступности каждого звена?","options":["Потому что доступности перемножаются","Потому что берётся минимум из звеньев","Потому что доступность считается за разные периоды","Потому что резерв уменьшает общую величину"],"answer":0,"explanation":"Для последовательной зависимости вероятности умножаются, и добавление звена всегда снижает результат. Поэтому «у нас всё по 99,9%» не означает 99,9% у сервиса, а улучшать надо слабое звено, а не среднее."}},{"id":"L11A","title":"Инвентарь наблюдения за узлом","module":11,"kind":"dataset","salt":"l11a","intro":"Четыре датчика, журнал ОС и выгрузка контроллера управления. Прежде чем объяснять перегрев, надо понять, что каждый источник вообще способен увидеть: единицы, период опроса и место съёма решают это раньше любых выводов.","commands":"python3 course_lab.py init L11A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L11A ./work","expect":{"inlet_c":"m389ax","fast_enough_sensor":"j1zvd","throttle_events":"ku480e"},"checks":[{"op":"hash","field":"inlet_c","label":"температура на входе приведена к градусам Цельсия","note":"указано"},{"op":"hash","field":"fast_enough_sensor","label":"найден датчик с достаточной частотой опроса","note":"указано"},{"op":"hash","field":"throttle_events","label":"эпизоды троттлинга сосчитаны","note":"указано"},{"op":"claimEquals","field":"inlet_proves_cause","value":false,"label":"входная температура не признана доказательством","note":"указано"}],"why":{"q":"Почему датчик на входе не может ни подтвердить, ни опровергнуть секундный эпизод троттлинга?","options":["Потому что он измеряет в градусах Фаренгейта","Потому что он стоит на передней панели, а процессор — внутри","Потому что его опрашивают раз в тридцать секунд","Потому что контроллер управления и ОС ведут разные часы"],"answer":2,"explanation":"Период опроса — это разрешение источника по времени. Событие короче интервала для такого датчика не существует, и никакое сопоставление шкал этого не исправит. Единицы и место съёма — следующие вопросы, но первый именно этот."}},{"id":"L15A","title":"Один LUN, два пути","module":15,"kind":"dataset","salt":"l15a","intro":"Выгрузка multipath и lsblk с инициатора. Считать пути дисками — самая частая ошибка в этой теме, и она видна прямо в выводе, если прочитать его как дерево, а не как список.","commands":"python3 course_lab.py init L15A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L15A ./work","expect":{"luns":"1l06jrz","paths":"1la65gy","capacity_gib":"d86jq"},"checks":[{"op":"hash","field":"luns","label":"число LUN определено по WWID, а не по именам устройств","note":"указано"},{"op":"hash","field":"paths","label":"пути сосчитаны","note":"указано"},{"op":"hash","field":"capacity_gib","label":"ёмкость не удвоена","note":"указано"},{"op":"claimEquals","field":"write_via_sdb_safe","value":false,"label":"запись мимо mapper признана небезопасной","note":"указано"}],"why":{"q":"Почему sdb и sdc — не два диска по 20 ГиБ?","options":["Потому что у них один и тот же WWID","Потому что один из них помечен enabled, а не active","Потому что lsblk показывает mpatha дважды по ошибке","Потому что политика service-time выбирает только один из них"],"answer":0,"explanation":"Идентичность блочного устройства задаёт WWID, а не имя вида sdX: имя выдаётся при обнаружении и у второго пути будет другим. Запись мимо mapper идёт по одному пути, и второй путь о ней не знает — так теряется согласованность."}},{"id":"L19A","title":"Гость и хост меряют разное","module":19,"kind":"dataset","salt":"l19a","intro":"Два снимка iostat, снятых одновременно: внутри учебной машины и на хосте. Гость видит своё ожидание и уверен, что нашёл причину; хост показывает, чьё это ожидание на самом деле.","commands":"python3 course_lab.py init L19A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L19A ./work","expect":{"guest_await_ms":"1f0e0zd","host_await_ms":"wnm4m4","guest_share_percent":"9kn8k4"},"checks":[{"op":"hash","field":"guest_await_ms","label":"ожидание в госте прочитано","note":"указано"},{"op":"hash","field":"host_await_ms","label":"ожидание на устройстве хоста прочитано","note":"указано"},{"op":"hash","field":"guest_share_percent","label":"доля учебной машины в общем потоке посчитана","note":"указано"},{"op":"claimEquals","field":"guest_alone_proves","value":false,"label":"гостевой замер не признан доказательством","note":"указано"}],"why":{"q":"Почему ожидание в госте вчетверо больше, чем на самом устройстве?","options":["Потому что гость измеряет в других единицах","Потому что виртуальный диск медленнее физического по своей природе","Потому что %util в госте выше","Потому что между гостем и устройством стоит очередь хоста"],"answer":3,"explanation":"Точка измерения определяет, что именно измерено. Ожидание гостя включает всё, что стоит ниже него, — очередь гипервизора и чужую нагрузку. Назвать причину можно только сопоставив оба ряда, и подписать точки съёма надо до замера, а не после."}},{"id":"L21A","title":"Сборщик теряет имя команды","module":21,"kind":"dataset","salt":"l21a","intro":"Функция run логирует команду, а потом теряет её: shift убирает не то. Ошибка не падает — она молча запускает не ту программу, и в отчёте это выглядит как отказ утилиты.","commands":"python3 course_lab.py init L21A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L21A ./work","expect":{"lost_line":"cb3io1","executed_word":"spvpb","split_words":"9j7hqb"},"checks":[{"op":"hash","field":"lost_line","label":"строка с потерей имени найдена","note":"указано"},{"op":"hash","field":"executed_word","label":"видно, что именно уйдёт на исполнение","note":"указано"},{"op":"hash","field":"split_words","label":"разбиение аргумента с пробелом посчитано","note":"указано"},{"op":"claimEquals","field":"quote_args","value":true,"label":"кавычки вокруг аргументов признаны обязательными","note":"указано"}],"why":{"q":"Почему эта ошибка не проявляется как падение скрипта?","options":["Потому что set -u не ловит пустые аргументы","Потому что оболочка честно запускает то, что осталось первым словом","Потому что вывод перенаправлен в файл, и ошибка туда не попадает","Потому что pipefail отключает проверку кодов возврата"],"answer":1,"explanation":"Оболочка не знает, что вы задумали: она выполняет то, что получила. Поэтому в сборщике имя команды хранят отдельно от аргументов, аргументы раскрывают в кавычках, а код возврата сохраняют рядом с текстом, а не вместо него."}},{"id":"L22B","title":"Страницы, повтор и неопределённый результат","module":22,"kind":"dataset","salt":"l22b","intro":"Журнал обращений к учебному интерфейсу: три страницы, один отказ с просьбой подождать и один запрос, ответа на который клиент не дождался. Повторить его — значит, возможно, создать второй объект.","commands":"python3 course_lab.py init L22B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L22B ./work","expect":{"total_items":"18l76dc","retry_after_s":"1a94sj6","post_result":"1g8tkcn"},"checks":[{"op":"hash","field":"total_items","label":"объекты сосчитаны по всем страницам без повторов","note":"указано"},{"op":"hash","field":"retry_after_s","label":"просьба сервера подождать прочитана","note":"указано"},{"op":"hash","field":"post_result","label":"результат POST назван неопределённым","note":"указано"},{"op":"claimEquals","field":"repeat_needs_key","value":true,"label":"ключ идемпотентности признан обязательным","note":"указано"}],"why":{"q":"Почему после таймера клиента нельзя сказать, что POST не выполнился?","options":["Потому что таймер сработал слишком рано","Потому что сервер вернул 429 на предыдущий запрос","Потому что таймер обрывает ожидание ответа","Потому что в журнале нет кода ответа"],"answer":2,"explanation":"Отсутствие ответа — это отсутствие сведений, а не сведения об отказе. Следующий GET показывает шесть объектов вместо пяти: POST применился. Ключ идемпотентности превращает повтор в тот же самый запрос, а не во второй."}},{"id":"L24A","title":"Один процесс, два номера","module":24,"kind":"dataset","salt":"l24a","intro":"Снимки изнутри контейнера и с хоста об одном и том же процессе. Номера, имена и localhost в этих двух видах — разные вещи, и путаница между ними стоит часа на каждой первой отладке.","commands":"python3 course_lab.py init L24A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L24A ./work","expect":{"host_pid":"6ztpkp","container_pid":"doo7yj","published_port_outside":"1juulbs","survives_recreate":"10p042s"},"checks":[{"op":"hash","field":"host_pid","label":"процесс найден на хосте","note":"указано"},{"op":"hash","field":"container_pid","label":"его номер внутри контейнера прочитан","note":"указано"},{"op":"hash","field":"published_port_outside","label":"опубликованный порт отделён от порта внутри","note":"указано"},{"op":"hash","field":"survives_recreate","label":"названо, что переживает пересоздание","note":"указано"},{"op":"claimEquals","field":"db_resolves_on_host","value":false,"label":"имя db на хосте не разрешается","note":"указано"}],"why":{"q":"Почему curl на localhost:5432 внутри контейнера приложения не доходит до базы?","options":["Потому что база слушает другой порт, чем указано в строке подключения","Потому что у каждого контейнера своё сетевое пространство имён","Потому что порт 5432 не опубликован наружу","Потому что имя db разрешается только на хосте"],"answer":1,"explanation":"Контейнер — это набор пространств имён, а не машина. Номера процессов, сетевые интерфейсы и точки монтирования у него свои; к соседнему сервису идут по его имени в общей сети, а не по localhost. Данные переживают пересоздание только в томе: записываемый слой уходит вместе с контейнером."}},{"id":"L25A","title":"Один коммит, три артефакта","module":25,"kind":"dataset","salt":"l25a","intro":"Журнал конвейера: коммит один, а собранных образов три. Продвижение подменено пересборкой, и вместе с этим в журнал попало то, чего там быть не должно.","commands":"python3 course_lab.py init L25A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L25A ./work","expect":{"builds":"kh24r0","promoted_digest":"ash8ib","first_rebuild_stage":"12sunn3"},"checks":[{"op":"hash","field":"builds","label":"пересборки сосчитаны","note":"указано"},{"op":"hash","field":"promoted_digest","label":"назван дайджест, который должен был продвигаться","note":"указано"},{"op":"hash","field":"first_rebuild_stage","label":"найден этап, где продвижение подменено сборкой","note":"указано"},{"op":"claimEquals","field":"secret_leaked","value":true,"label":"утечка секрета в журнал замечена","note":"указано"}],"why":{"q":"Что именно теряется, когда каждая среда собирает образ заново из того же коммита?","options":["Скорость конвейера: три сборки дольше одной","Ничего: коммит один, значит и результат один","Место в реестре образов: три сборки занимают втрое больше одной","Что проверяли один дайджест, а в prod приехал другой"],"answer":3,"explanation":"Артефакт проверяют, а не коммит: воспроизводимость сборки не гарантирована ничем — базовый образ, зависимости и время сборки меняются. Поэтому продвигают дайджест, а конфигурацию среды подают отдельно."}},{"id":"L27B","title":"Собралось — не значит выполнилось","module":27,"kind":"dataset","salt":"l27b","intro":"Журнал успешной сборки приложения UEFI и три наблюдения с двух машин. Причины три, наблюдений три, но совпадают они не по порядку: каждое надо привязать к той причине, которую оно отличает от двух остальных.","commands":"python3 course_lab.py init L27B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L27B ./work","expect":{"arch_letter":"d4orgx","policy_letter":"capye0","path_letter":"ckpk2z"},"checks":[{"op":"hash","field":"arch_letter","label":"несовпадение архитектуры отделено","note":"указано"},{"op":"hash","field":"policy_letter","label":"запрет политикой отделён","note":"указано"},{"op":"hash","field":"path_letter","label":"неверный путь устройства отделён","note":"указано"},{"op":"claimEquals","field":"build_proves_run","value":false,"label":"сборка не выдана за доказательство исполнения","note":"указано"}],"why":{"q":"Какой факт говорит в пользу ошибки загрузочной записи, если один и тот же файл проверяют на одной машине?","options":["То, что тот же файл выполняется из оболочки, но не по записи загрузки","То, что сообщения разные по тексту","То, что машины разные, а значит и прошивки на них разных версий","То, что сборка прошла без ошибок"],"answer":0,"explanation":"Если тот же файл запускается из оболочки на той же машине, но не через запись загрузки, неверный путь или параметры записи становятся сильной гипотезой. Политики запуска ещё нужно проверить: один этот опыт не исключает их различия. Успех сборки сам по себе не доказывает исполнение."}},{"id":"L28A","title":"Цепочка от таблицы до драйвера","module":28,"kind":"dataset","salt":"l28a","intro":"Три среза одной загрузки: таблицы ACPI, журнал перечисления устройств прошивкой и вывод загруженной системы. У одного устройства цепочка проходится целиком, у другого обрывается — надо назвать, на каком шаге.","commands":"python3 course_lab.py init L28A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L28A ./work","expect":{"broken_step":"1pxpe3x","complete_device":"1rek8lc"},"checks":[{"op":"hash","field":"broken_step","label":"шаг обрыва назван","note":"указано"},{"op":"hash","field":"complete_device","label":"найдено устройство с полной цепочкой","note":"указано"},{"op":"claimEquals","field":"driver_bound_0300","value":false,"label":"отсутствие привязки драйвера зафиксировано","note":"указано"}],"why":{"q":"Почему «устройство видно в перечислении» ещё не значит, что оно заработает?","options":["Потому что перечисление идёт до загрузки ОС и её драйверы туда не входят","Потому что перечисление только обнаруживает устройство","Потому что таблицы ACPI важнее журнала прошивки","Потому что ОС перечисляет устройства заново"],"answer":1,"explanation":"Между «увидели» и «работает» стоят два отдельных шага: выделение ресурсов и привязка драйвера. Обрыв на любом из них выглядит одинаково — устройства нет в системе, — и различить их можно только по цепочке целиком."}},{"id":"L32A","title":"Среднее прячет хвост","module":32,"kind":"dataset","salt":"l32a","intro":"Задержка одиночной синхронной записи в трёх состояниях фоновой нагрузки. Обещание пользователю ограничивает не среднее и не медиана — это видно по числам, если не смотреть в одну колонку.","commands":"python3 course_lab.py init L32A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L32A ./work","expect":{"p99_ratio":"demfyn","mean_vs_p99":"1dfryh9","limits_transaction":"13z5yt7"},"checks":[{"op":"hash","field":"p99_ratio","label":"расхождение хвостов посчитано","note":"указано"},{"op":"hash","field":"mean_vs_p99","label":"разрыв между средним и хвостом посчитан","note":"указано"},{"op":"hash","field":"limits_transaction","label":"названа величина, ограничивающая транзакцию","note":"указано"},{"op":"claimEquals","field":"mean_is_enough","value":false,"label":"среднее не принято за обещание","note":"указано"}],"why":{"q":"Почему среднее в 9,6 мс не описывает то, что чувствует пользователь?","options":["Потому что оно посчитано по слишком короткому окну","Потому что синхронная запись всегда медленнее асинхронной","Потому что среднее размазывает редкие долгие ожидания по всем остальным","Потому что p50 в этом состоянии тоже вырос, и разрыв между ними сохранился"],"answer":2,"explanation":"Транзакция не ждёт среднего — она ждёт своего ответа. Обещание о задержке даётся по хвосту, а фоновая нагрузка этот хвост и создаёт: разница между p50 и p99 здесь больше, чем разница между состояниями по среднему."}},{"id":"L34A","title":"Три оповещения и три вопроса","module":34,"kind":"dataset","salt":"l34a","intro":"Три оповещения стенда, каждое с ответами на три вопроса дежурного. Решение по каждому — не вкусовое: оно следует из того, что видит пользователь и что дежурный успевает сделать.","commands":"python3 course_lab.py init L34A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L34A ./work","expect":{"page_at_night":"1yganjy","to_daytime":"1yqa98x","to_delete":"1y6b1uz"},"checks":[{"op":"hash","field":"page_at_night","label":"ночное оповещение оставлено одно","note":"указано"},{"op":"hash","field":"to_daytime","label":"запас по времени превращён в дневную задачу","note":"указано"},{"op":"hash","field":"to_delete","label":"оповещение без ущерба и без действия убрано","note":"указано"},{"op":"claimEquals","field":"load_is_symptom","value":true,"label":"загрузка признана показанием, а не ущербом","note":"указано"}],"why":{"q":"Заполнение /var ожидается через шесть часов, пользователи не затронуты, утренняя смена приступит через два часа. Почему это оповещение не требует ночного звонка?","options":["Потому что дисковое место не относится к работе сервиса","Потому что до отказа есть шесть часов и ответственная смена успевает выполнить действие","Потому что у него есть runbook","Потому что пользователь всё равно ничего не заметит"],"answer":1,"explanation":"Оповещение требует действия до ожидаемого отказа, но немедленного ночного вмешательства в этом сценарии не нужно: смена начнёт работу за четыре часа до прогноза. Если скорость заполнения или цена отказа меняются, приоритет пересматривают."}},{"id":"L35A","title":"Точка невозврата и хвост клиентов","module":35,"kind":"dataset","salt":"l35a","intro":"План переноса из шести шагов с ценой возврата на каждом и два способа переключения трафика с измеренным хвостом. Точка невозврата в таком плане ровно одна, и она не там, где кажется.","commands":"python3 course_lab.py init L35A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L35A ./work","expect":{"point_of_no_return":"1opan71","dns_tail_minutes":"hzqw7r","lb_tail_minutes":"1ofb1i2"},"checks":[{"op":"hash","field":"point_of_no_return","label":"точка невозврата найдена по цене возврата","note":"указано"},{"op":"hash","field":"dns_tail_minutes","label":"хвост при переключении через DNS прочитан","note":"указано"},{"op":"hash","field":"lb_tail_minutes","label":"хвост при переключении на балансировщике прочитан","note":"указано"},{"op":"claimEquals","field":"ttl_explains_tail","value":false,"label":"хвост не объяснён одним TTL","note":"указано"}],"why":{"q":"Почему один TTL DNS-записи не гарантирует срок переключения всех клиентов после её изменения?","options":["Потому что TTL в 300 секунд слишком мал","Потому что балансировщик продолжает держать соединения","Потому что запись меняли не на всех серверах имён","Потому что TTL ограничивает хранение записи у соблюдающих его резолверов, но не уже открытые соединения и поведение всех клиентов"],"answer":3,"explanation":"TTL относится к кешированию DNS-ответа, а не к длительности уже установленного соединения. Реальный хвост переключения измеряют по клиентскому трафику и настройкам резолверов и соединений; из одного TTL его вывести нельзя."}},{"id":"L36B","title":"Один симптом, несколько поломок","module":36,"kind":"dataset","salt":"l36b","intro":"Симптом один на всех: 502 на каждом запросе. В наблюдениях за ним стоят несколько независимых поломок, и часть из них к пользовательскому пути отношения не имеет.","commands":"python3 course_lab.py init L36B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L36B ./work","expect":{"user_path_causes":"1b4at7u","total_failures":"1beaewt","enough_to_restore":"1aub7iv"},"checks":[{"op":"hash","field":"user_path_causes","label":"поломки пользовательского пути отделены","note":"указано"},{"op":"hash","field":"total_failures","label":"сосчитаны все независимые поломки","note":"указано"},{"op":"hash","field":"enough_to_restore","label":"названо, сколько нужно для восстановления пути","note":"указано"},{"op":"claimEquals","field":"one_symptom_one_cause","value":false,"label":"общий симптом не принят за одну причину","note":"указано"}],"why":{"q":"Почему из «все запросы отвечают 502» не следует одна первопричина?","options":["Потому что 502 возвращает балансировщик, а не приложение","Потому что в журнале есть и другие ошибки","Потому что 502 — не диагноз","Потому что мониторинг не работает и данных не хватает"],"answer":2,"explanation":"Общая точка отказа сводит разные причины в один симптом. Здесь бэкендов два и сломаны они по-разному: один слушает не тот адрес, второй не стартует. Остановка сборщика метрик к 502 не приводит, но это третья независимая поломка — и найти её надо, а не списать на общую."}},{"id":"L00A","title":"Тридцать замеров и три ошибки","module":0,"kind":"dataset","salt":"l00a","intro":"Тридцать строк вывода curl по одному и тому же запросу. Три попытки не дошли, и главный вопрос работы — что с ними делать: включённая как ноль ошибка улучшает результат и портит вывод.","commands":"python3 course_lab.py init L00A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L00A ./work","expect":{"valid_count":"1r4v3qx","p90_ms":"1qat561","median_ms":"1x8g20d"},"checks":[{"op":"hash","field":"valid_count","label":"ошибки отделены от измерений","note":"указано"},{"op":"hash","field":"p90_ms","label":"p90 посчитан по ближайшему рангу","note":"указано"},{"op":"hash","field":"median_ms","label":"медиана посчитана","note":"указано"},{"op":"claimEquals","field":"errors_as_zero","value":false,"label":"ошибки не засчитаны как нулевая задержка","note":"указано"}],"why":{"q":"Почему неудавшийся запрос нельзя записать как нулевое время?","options":["Потому что ноль испортит медиану сильнее, чем среднее","Потому что ноль — это утверждение «ответ пришёл мгновенно»","Потому что curl печатает время только при успехе, а при отказе молчит","Потому что ошибки надо считать отдельной величиной"],"answer":1,"explanation":"Отсутствие результата — не результат. Отказы считаются отдельно как доля неуспеха: включённые в ряд задержек нулём, они одновременно занижают задержку и прячут недоступность. Единица измерения и точка съёма записываются до запуска — потом восстановить их не по чему."}},{"id":"L01B","title":"Что именно измерил ваш замер","module":1,"kind":"dataset","salt":"l01b","intro":"Три числа одного опыта: последовательный обход, случайный обход и пустой цикл той же длины. Без третьего замера первые два говорят не о памяти, а о языке, на котором написан цикл.","commands":"python3 course_lab.py init L01B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L01B ./work","expect":{"seq_net_s":"11i1b2z","rand_net_s":"lzf75i","ratio_naive":"udn964","ratio_net":"hic6pq"},"checks":[{"op":"hash","field":"seq_net_s","label":"накладные расходы вычтены из последовательного замера","note":"указано"},{"op":"hash","field":"rand_net_s","label":"то же для случайного","note":"указано"},{"op":"hash","field":"ratio_naive","label":"посчитано отношение по сырым числам","note":"указано"},{"op":"hash","field":"ratio_net","label":"посчитано отношение по чистому времени","note":"указано"},{"op":"claimEquals","field":"overhead_matters","value":true,"label":"разница между двумя отношениями замечена","note":"указано"}],"why":{"q":"Почему без пустого цикла отношение 4,4 занижает разрыв вчетверо?","options":["Потому что случайный доступ прогревает кэш","Потому что в оба замера входит одна и та же постоянная","Потому что Python округляет время и разница теряется в погрешности","Потому что массив не помещается в кэш целиком"],"answer":1,"explanation":"Замер всегда меряет всё, что происходит между двумя отметками. Постоянная составляющая, общая для обоих опытов, сокращается только вычитанием: иначе вы сравниваете не память, а сумму памяти и интерпретатора — и чем медленнее язык, тем ближе друг к другу окажутся любые два результата."}},{"id":"L02A","title":"Состояние процесса и потраченное время","module":2,"kind":"dataset","salt":"l02a","intro":"Два процесса, снятых одновременно: один ждёт, другой считает. Буква состояния и потраченное процессорное время говорят о разном, и путать их — самая частая ошибка при чтении ps.","commands":"python3 course_lab.py init L02A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L02A ./work","expect":{"sleep_state":"1xrlw8d","spin_state":"1xhmaje","sleep_cpu_seconds":"za7amv","open_fds":"174o1n1"},"checks":[{"op":"hash","field":"sleep_state","label":"состояние ожидающего процесса прочитано","note":"указано"},{"op":"hash","field":"spin_state","label":"состояние считающего процесса прочитано","note":"указано"},{"op":"hash","field":"sleep_cpu_seconds","label":"процессорное время отделено от календарного","note":"указано"},{"op":"hash","field":"open_fds","label":"дескрипторы сосчитаны","note":"указано"},{"op":"claimEquals","field":"state_shows_cpu_use","value":false,"label":"состояние не принято за расход процессора","note":"указано"}],"why":{"q":"Процесс два часа в состоянии S. Сколько процессорного времени он потратил?","options":["Два часа: состояние S означает, что он работал","Ровно половину: S — это «спит через раз»","Столько, сколько показывает user + sys","Нисколько: в состоянии S процессор не используется никогда"],"answer":2,"explanation":"Состояние — это мгновенный снимок, время — накопленная величина. Календарное время процесса (real) включает всё ожидание; процессорное (user + sys) — только то, что он считал. Разница между ними и есть ответ на вопрос «процесс завис или работает»."}},{"id":"L03A","title":"Имя удалено, место занято","module":3,"kind":"dataset","salt":"l03a","intro":"Три среза вокруг одного удаления: до, сразу после и после завершения процесса. Место возвращается не тогда, когда исчезает имя, — и по df это видно.","commands":"python3 course_lab.py init L03A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L03A ./work","expect":{"size_mib":"upwz54","links_after_unlink":"1ujjug1","freed_mib":"upwz54","frees_space":"o5kdm4"},"checks":[{"op":"hash","field":"size_mib","label":"размер переведён в мебибайты","note":"указано"},{"op":"hash","field":"links_after_unlink","label":"число оставшихся имён прочитано","note":"указано"},{"op":"hash","field":"freed_mib","label":"освобождённое место посчитано по df","note":"указано"},{"op":"claimEquals","field":"df_changed_on_unlink","value":false,"label":"неизменность df после rm замечена","note":"указано"},{"op":"hash","field":"frees_space","label":"названо, что на самом деле освобождает место","note":"указано"}],"why":{"q":"Диск заполнен, вы удалили журнал на гигабайт, а свободного места не прибавилось. Почему?","options":["Файловая система обновляет df раз в минуту","Журнал был разреженным файлом и занимал меньше, чем показывал размер","Удалять надо было через truncate","rm убирает имя, а место держит последняя ссылка на данные"],"answer":3,"explanation":"Имя и данные — разные вещи: имя это запись в каталоге, данные живут, пока на них есть хоть одна ссылка, включая открытый дескриптор. Поэтому лечится это не повторным rm, а перезапуском или перечитыванием журнала службой; lsof +L1 показывает такие файлы прямо."}},{"id":"L04B","title":"Загрузка встала не там, где кажется","module":4,"kind":"dataset","salt":"l04b","intro":"Загрузка остановилась в аварийном режиме после правки fstab. В журнале три источника, и по ним надо назвать шаг, на котором всё встало, — а не тот, на который привычно думают.","commands":"python3 course_lab.py init L04B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L04B ./work","expect":{"failing_mount":"67d152","boot_stage":"t7xdvc","fix_option":"gd1u12"},"checks":[{"op":"hash","field":"failing_mount","label":"найдено монтирование, остановившее загрузку","note":"указано"},{"op":"hash","field":"boot_stage","label":"назван шаг загрузки","note":"указано"},{"op":"claimEquals","field":"grub_at_fault","value":false,"label":"загрузчик снят с подозрения","note":"указано"},{"op":"hash","field":"fix_option","label":"назван параметр, который пустил бы систему дальше","note":"указано"}],"why":{"q":"Что в этом журнале доказывает, что загрузчик и ядро отработали?","options":["Строка про Emergency Shell: до неё дело дошло","То, что ядро напечатало версию, а systemd дошёл до монтирования","Наличие /boot в fstab: раз он описан, загрузчик отработал целиком","Ничего: по журналу это установить нельзя"],"answer":1,"explanation":"Каждый шаг загрузки оставляет свой след, и чужие следы за него не считаются. Раз работает journalctl -b, ядро и корень уже на месте; значит, «не грузится» относится к одному дополнительному тому, а не к загрузчику. Параметр nofail оставляет такой том необязательным."}},{"id":"L05A","title":"Три записи об одном корне","module":5,"kind":"dataset","salt":"l05a","intro":"Корень назван в трёх местах тремя разными способами. Работа — доказать, что все три описывают один объект, и назвать, какая запись переживёт перестановку дисков.","commands":"python3 course_lab.py init L05A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L05A ./work","expect":{"root_uuid":"yobf9w","stable_identifier":"1ylvoli"},"checks":[{"op":"hash","field":"root_uuid","label":"устойчивый идентификатор корня найден","note":"указано"},{"op":"claimEquals","field":"cmdline_names_uuid","value":false,"label":"видно, что ядро названо именем устройства","note":"указано"},{"op":"claimEquals","field":"same_object","value":true,"label":"обе записи сведены к одному разделу","note":"указано"},{"op":"hash","field":"stable_identifier","label":"названо, что переживает перестановку","note":"указано"}],"why":{"q":"Почему root=/dev/vda2 в параметрах ядра опаснее, чем root=UUID=…?","options":["Потому что имя длиннее и его легче опечатать","Потому что имена вида vdaN выдаются при обнаружении устройств","Потому что ядро не умеет монтировать по именам","Потому что /dev/vda2 не работает с ext4 и требует указания UUID"],"answer":1,"explanation":"Идентичность блочного устройства задаётся тем, что лежит на нём, а не тем, каким по счёту его нашли. Отсюда правило: в fstab и в параметрах ядра — устойчивый идентификатор; имя вида sdX или vdaN годится ровно на одну загрузку."}},{"id":"L06A","title":"Кого спрашивает ARP","module":6,"kind":"dataset","salt":"l06a","intro":"Три записи об одном пинге: решение таблицы маршрутизации, таблица соседей и сам перехват. Адрес, который спрашивает ARP, и адрес, куда идёт пакет, — разные, и это видно прямо в выводе.","commands":"python3 course_lab.py init L06A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L06A ./work","expect":{"arp_target":"12sl8ym","next_hop_mac":"1p2l6pn","ping_dst_ip":"1fc8lsl"},"checks":[{"op":"hash","field":"arp_target","label":"видно, чей адрес спрашивается","note":"указано"},{"op":"hash","field":"next_hop_mac","label":"адрес второго уровня следующего узла прочитан","note":"указано"},{"op":"hash","field":"ping_dst_ip","label":"адрес назначения пакета прочитан","note":"указано"},{"op":"claimEquals","field":"arp_for_destination","value":false,"label":"ARP не принят за запрос адреса получателя","note":"указано"}],"why":{"q":"Почему ARP спрашивает про 10.10.10.1, хотя пинг идёт на 10.10.20.12?","options":["Потому что 10.10.20.12 ещё не отвечает","Потому что ARP работает только с первым адресом подсети","Потому что адрес второго уровня нужен для одного шага","Потому что клиент не знает маску подсети"],"answer":2,"explanation":"Второй уровень живёт в пределах одного сегмента, третий — до конца маршрута. Поэтому в кадре стоит адрес шлюза, а в пакете — адрес получателя, и на каждом шаге первый меняется, а второй нет. Запрос ARP по адресу за пределами префикса означает, что префикс настроен неверно."}},{"id":"L07A","title":"Соединение установлено — это не «файл получен»","module":7,"kind":"dataset","salt":"l07a","intro":"Перехват одного обращения по HTTP и две контрольные суммы. Ответ 200 и целый файл — разные утверждения, и в этом наборе они расходятся.","commands":"python3 course_lab.py init L07A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L07A ./work","expect":{"client_port":"irutva","server_port":"1aaazgf","data_segment_number":"dbscoh","bytes_missing":"u2m9cl"},"checks":[{"op":"hash","field":"client_port","label":"порт клиента прочитан","note":"указано"},{"op":"hash","field":"server_port","label":"порт сервера прочитан","note":"указано"},{"op":"hash","field":"data_segment_number","label":"рукопожатие отделено от передачи данных","note":"указано"},{"op":"hash","field":"bytes_missing","label":"недостача посчитана","note":"указано"},{"op":"claimEquals","field":"ok_means_intact","value":false,"label":"ответ 200 не принят за доказательство целостности","note":"указано"}],"why":{"q":"Почему в этом наборе ответ 200 OK стоит рядом с испорченным файлом?","options":["Потому что сервер ошибся с кодом ответа","Потому что 200 относится к началу ответа","Потому что Content-Length был неверным","Потому что клиент считал сумму до конца загрузки"],"answer":1,"explanation":"Код ответа — утверждение о начале обмена, контрольная сумма — о его результате. Поэтому приёмка работы требует совпадения сумм, а не успешного соединения: TCP гарантирует порядок и отсутствие потерь внутри установленного соединения, но не то, что оно доживёт до конца."}},{"id":"L08A","title":"Матрица достижимости двух VLAN","module":8,"kind":"dataset","salt":"l08a","intro":"Четыре клиента, два VLAN, таблица портов и результаты проверки связности. Матрица предсказывается до запуска — и в этом смысл работы: совпадение предсказания с опытом и есть проверка модели.","commands":"python3 course_lab.py init L08A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L08A ./work","expect":{"reachable_pairs":"194evm4","pvid_linux3":"1gnlxpw","needs_for_crossvlan":"rkmreu"},"checks":[{"op":"hash","field":"reachable_pairs","label":"матрица сосчитана","note":"указано"},{"op":"hash","field":"pvid_linux3","label":"PVID порта прочитан","note":"указано"},{"op":"claimEquals","field":"crossvlan_works","value":false,"label":"отсутствие связи между VLAN зафиксировано","note":"указано"},{"op":"hash","field":"needs_for_crossvlan","label":"названо недостающее звено","note":"указано"}],"why":{"q":"Почему клиенты разных VLAN не видят друг друга, хотя воткнуты в один коммутатор?","options":["Потому что у них разные маски подсети и адреса не попадают в один префикс","Потому что тегированный порт выключен","Потому что VLAN — это разделение на втором уровне","Потому что PVID не назначен маршрутизатору"],"answer":2,"explanation":"VLAN делит один коммутатор на несколько независимых коммутаторов. Соединить их — работа маршрутизации, а не настройки портов; поэтому «сделайте им один VLAN» и «поставьте маршрутизатор» — решения с разными последствиями для изоляции."}},{"id":"L09A","title":"Восемь процессоров, четыре ядра","module":9,"kind":"dataset","salt":"l09a","intro":"Таблица топологии и два запуска одной задачи: без привязки и с привязкой к одному процессору. Числа из lscpu складывать нельзя — сначала надо понять, что именно пересчитано.","commands":"python3 course_lab.py init L09A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L09A ./work","expect":{"logical_cpus":"ka4axj","physical_cores":"gy92lv","sibling_of_cpu2":"hi89zt","slowdown":"gy92lv"},"checks":[{"op":"hash","field":"logical_cpus","label":"логические процессоры сосчитаны","note":"указано"},{"op":"hash","field":"physical_cores","label":"ядра отделены от логических процессоров","note":"указано"},{"op":"hash","field":"sibling_of_cpu2","label":"сосед по ядру найден","note":"указано"},{"op":"hash","field":"slowdown","label":"замедление посчитано","note":"указано"},{"op":"claimEquals","field":"machine_is_limited","value":false,"label":"ограничение процесса не выдано за ограничение машины","note":"указано"}],"why":{"q":"Что на самом деле показал прогон с taskset -c 2?","options":["Что машина способна на 15,8 с в этой задаче","Что один процессор медленнее остальных","Что гиперпоточность вредит этой задаче","Что задача умеет расходиться на несколько процессоров"],"answer":3,"explanation":"Привязка ограничивает один процесс, а не машину: остальные семь процессоров в это время свободны. Отсюда правило читать lscpu -e как таблицу отношений — логический процессор, ядро, сокет, узел — и не складывать строки, в которых одно и то же ядро перечислено дважды."}},{"id":"L10A","title":"Видно, привязано, работает","module":10,"kind":"dataset","salt":"l10a","intro":"Устройство PCIe в трёх видах: дерево перечисления, привязка драйвера в sysfs и функциональная проверка. Это три разных утверждения, и в виртуальной машине часть из них просто не существует.","commands":"python3 course_lab.py init L10A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L10A ./work","expect":{"driver":"4ysakh","numa_node":"fjy5ul"},"checks":[{"op":"hash","field":"driver","label":"драйвер найден в sysfs","note":"указано"},{"op":"hash","field":"numa_node","label":"значение numa_node прочитано как есть","note":"указано"},{"op":"claimEquals","field":"numa_known","value":false,"label":"минус единица прочитана как «неизвестно»","note":"указано"},{"op":"claimEquals","field":"link_speed_known","value":false,"label":"отсутствие данных о линии зафиксировано","note":"указано"},{"op":"claimEquals","field":"enumeration_proves_function","value":false,"label":"перечисление не выдано за работоспособность","note":"указано"}],"why":{"q":"Почему numa_node = -1 — это не «узел номер минус один»?","options":["Потому что нумерация узлов начинается с единицы","Потому что это признак отсутствия сведений","Потому что устройство подключено ко всем узлам сразу","Потому что драйвер ещё не завершил инициализацию"],"answer":1,"explanation":"Отрицательное значение здесь — не величина, а отсутствие ответа. Разница важна: «устройство на дальнем узле» — вывод, требующий действий, а «платформа не сказала» — повод искать данные в другом месте или признать, что в этой среде вопрос не имеет смысла."}},{"id":"L11B","title":"Кто остановил узел","module":11,"kind":"dataset","salt":"l11b","intro":"Узел внезапно встал. Три источника: журнал гостя, журнал гипервизора и данные о питании стенда. Восстановить порядок можно, но не всякий вывод этими данными подтверждается.","commands":"python3 course_lab.py init L11B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L11B ./work","expect":{"gap_seconds":"1s5492f","initiator":"1bi2gv5"},"checks":[{"op":"claimEquals","field":"guest_has_shutdown_record","value":false,"label":"обрыв журнала отличён от штатного завершения","note":"указано"},{"op":"hash","field":"gap_seconds","label":"промежуток между источниками посчитан","note":"указано"},{"op":"hash","field":"initiator","label":"назван источник остановки","note":"указано"},{"op":"claimEquals","field":"proves_psu_failure","value":false,"label":"границы модели названы","note":"указано"}],"why":{"q":"Что именно доказывает обрыв журнала гостя без записи о завершении?","options":["Что машина потеряла питание","Что диск был переполнен и записи не сохранились","Что гость не получил возможности завершиться штатно","Что журнал был повреждён при остановке"],"answer":2,"explanation":"Источник видит только себя. Отсутствие записи о завершении отличает внезапную остановку от плановой, но не называет причину; причину называет журнал уровнем ниже. Поэтому такая модель воспроизводит порядок событий, но ничего не говорит о физическом отказе — для него нужны данные, которых в ней нет."}},{"id":"L12B","title":"После перестановки sdb — другой диск","module":12,"kind":"dataset","salt":"l12b","intro":"Два вывода lsblk: до и после перестановки дисков на выключенной машине. Имя осталось прежним, объект за ним изменился — а старая инструкция называет именно имя.","commands":"python3 course_lab.py init L12B ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L12B ./work","expect":{"serial_sdb_before":"n3d37d","name_after":"1ni0m6y","stable_key":"12cpxma"},"checks":[{"op":"hash","field":"serial_sdb_before","label":"диск опознан по серийному номеру","note":"указано"},{"op":"hash","field":"name_after","label":"найдено его новое имя","note":"указано"},{"op":"claimEquals","field":"sdb_is_same_disk","value":false,"label":"подмена объекта за именем замечена","note":"указано"},{"op":"hash","field":"stable_key","label":"назван устойчивый признак","note":"указано"}],"why":{"q":"Почему размер и модель не годятся для опознания диска в этом случае?","options":["Потому что lsblk показывает их неточно","Потому что размер меняется при разметке","Потому что оба диска имеют одинаковые размер и модель","Потому что модель у виртуальных дисков всегда одна и та же"],"answer":2,"explanation":"Опознание требует признака, уникального в пределах рассматриваемого множества. Имя вида sdX выдаётся при обнаружении и к диску не привязано; размер и модель совпадают у партии одинаковых дисков. Остаются серийный номер, WWN и идентификаторы файловой системы — и именно их пишут в документ."}},{"id":"L13A","title":"Пять слоёв над одним разделом","module":13,"kind":"dataset","salt":"l13a","intro":"Вывод pvs, vgs, lvs, findmnt и df об одном и том же томе. Пять чисел про «размер» не совпадают, и каждое расхождение имеет своё объяснение — работа в том, чтобы назвать все.","commands":"python3 course_lab.py init L13A ./work\n# прочитайте README.txt, заполните answer.json\npython3 course_lab.py collect L13A ./work","expect":{"lv_size_mib":"13qbhcz"
